texts:
- seq: 1
  standard_code: L2-CES1-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 1、未对登录操作系统的用户进行身份鉴别
  issue_detail: 经核查：1）未对登录操作系统的用户采取用户名和口令的方式进行身份标识和鉴别；2）查看/etc/passwd文件，存在uid相同的用户，其中XX和XX的UID相同，身份鉴别标识不具备唯一性；3）管理用户root口令长度小于8位，口令仅由数字/字母组成；（或管理用户使用了弱口令）；4）查看/etc/security/user文件，口令复杂度要求及更换周期如下：，maxage         XX，maxexpried     XX，minalpha       XX，minother       XX，minlen         XX，mindiff        XX，max  repeats   XX，histexpire     XX，histsize       XX，口令更换周期及口令复杂度要求设置不合理。
  hazard: '1、合法用户身份被仿冒，导致系统被非授权访问的可能性

    2、用户权限被冒用，系统资源被非授权访问

    3、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致操作系统被非授权访问

    4、未提供用户口令复杂度校验功能，允许用户设置简单口令，口令未定期更换可能导致口令被恶意用户破解'
  remediation: '1、建议操作系统实现身份鉴别功能，采用用户名和口令的方式对用户进行身份鉴别

    2、建议修改/etc/passwd文件，修改UID相同的用户

    3、建议修改管理用户现用口令，口令长度8位以上，包含大写字母、小写字母、数字以及特殊符号

    4、建议修改配置文件/etc/security/user，合理配置参数实现口令复杂校验功能及口令更换周期限制'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 2
  standard_code: L2-CES1-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 1、未提供登录失败处理、超时自动退出功能
  issue_detail: 经核查：1）不具备设置登录失败锁定账户和登录连接超时自动退出的功能；2）查看/etc/security/login.cfg、/etc/security/user文件，未设置登录失败处理功能；3）查看/etc/profile文件，操作系统未设置超时自动退出功能/超时等待时间过长：，TMOUT=X。
  hazard: '1、登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致操作系统被非授权访问。

    2、长时间保持会话连接活跃，非授权用户可使用会话连接访问系统，造成非授权访问'
  remediation: '1、建议修改配置文件/etc/security/login.cfg或/etc/security/user实现登录失败处理功能

    2、建议修改配置文件/etc/profile，合理配置TimeOUT参数实现超时自动退出功能'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 3
  standard_code: L2-CES1-03
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听。
  issue_summary: 1、未采用加密措施进行远程管理
  issue_detail: 经核查：1）登录服务器时采用远程管理的方式；2）远程管理时使用Telnet；不能够保证鉴别数据在网络传输过程中的保密性。
  hazard: 操作系统帐号、口令等重要数据可能被嗅探并盗用，导致操作系统被非授权访问。
  remediation: 建议远程连接管理时，采取相应措施防止鉴别信息被窃听，如使用SSL协议等
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 4
  standard_code: L2-CES1-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: a）应对登录的用户分配账户和权限；
  issue_summary: 1、未对需要登录使用设备的人员单独设立账户并分配权限；
  issue_detail: 经核查：1）未对需要登录使用设备的人员单独设立账户并分配权限；2）存在匿名账户XXX，且未对其进行禁用或限制。
  hazard: '1、可能出现多人共用一个账户的情况，发生误操作不利于追溯自然人；

    2、存在可以通过匿名账户非授权访问设备造成风险的情况'
  remediation: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 5
  standard_code: L2-CES1-05
  layer: 安全计算环境
  control_point: 访问控制
  control_item: b）应重命名或删除默认账户，修改默认账户的默认口令；
  issue_summary: 1、未重命名系统默认账户。
  issue_detail: 经核查：1）未对默认管理账户root进行重命名，且未禁用默认账户X；2）未对X账户的默认口令进行修改。
  hazard: '1、可能导致外部能猜测系统用户名口令，造成信息泄露。

    2、口令被恶意用户猜测获得，合法用户身份被仿冒，导致操作系统被非授权访问'
  remediation: 建议重命名root等系统默认账户的用户名，或修改其默认口令为强口令
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 6
  standard_code: L2-CES1-06
  layer: 安全计算环境
  control_point: 访问控制
  control_item: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  issue_summary: 1、操作系统存在多余账户
  issue_detail: 经核查：1）服务器中存在多余账户X；2）服务器中存在过期账户X；3）账户与实际人员未对应，存在多人共用一个X账户的情况。
  hazard: 口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议删除操作系统中多余的、过期的账户，为需要使用操作系统的人员创建各自的账户
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 7
  standard_code: L2-CES1-07
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离。
  issue_summary: 未实现管理用户权限分离
  issue_detail: 经核查：1）未设立XX管理员账户、XX管理员账户..，未实现管理用户的权限分离。
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 8
  standard_code: L2-CES1-08
  layer: 安全计算环境
  control_point: 安全审计
  control_item: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  issue_summary: 1、服务器未启用审计服务auditd；
  issue_detail: 经核查：1）操作系统未开启安全审计功能。
  hazard: 无法对安全事件进行追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患
  remediation: 建议启动auditd、rsyslog服务，对重要的用户行为和重要安全事件进行审计
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 9
  standard_code: L2-CES1-09
  layer: 安全计算环境
  control_point: 安全审计
  control_item: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息；
  issue_summary: 服务器中日志记录仅包括XX，不够完善
  issue_detail: 经核查：1）审计记录包括仅XXX、XXX、XXX，审计记录不完善。
  hazard: 审计信息不完整，可能无法对安全事件进行有效追溯。
  remediation: 建议将服务器日志记录内容进行完善，至少包含：日期和时间、用户、事件类型、事件是否成功等重要信息
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 10
  standard_code: L2-CES1-10
  layer: 安全计算环境
  control_point: 安全审计
  control_item: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等。
  issue_summary: 1、未合理配置日志文件权限
  issue_detail: 经核查：1）查看系统日志文件权限，权限分别为，/etc/log/message               666，/var/adm/messages              666，/etc/security/audit/events     666，/etc/security/audit/objects    666；2）操作系统日志文件权限设置不合理，不能避免被删除、修改以及覆盖，未定期对日志文件进行备份。
  hazard: '1、日志文件权限设置不合理。增加了审计日志被未预期删除、覆盖的可能性

    2、当存储空间被耗尽时，可能导致审计信息缺失，不便于安全事件的追溯'
  remediation: '建议合理设置日志文件权限，仅root用户、审计管理员可以对日志进行读写操作。

    建议对审计记录定期备份，备份时长超过6个月。'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 高
- seq: 11
  standard_code: L2-CES1-11
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  issue_summary: 操作系统未最小化安装，存在多余的组件或服务。
  issue_detail: 经核查：1）服务器操作系统中部署了非必要的组件和应用程序XX；2）存在部分组件/应用程序XX未遵循最小化安装原则。
  hazard: 多余组件或服务可能存在安全漏洞，或影响服务器性能，造成业务中断
  remediation: 建议卸载多余的组件、服务
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 12
  standard_code: L2-CES1-12
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: b）应关闭不需要的系统服务、默认共享和高危端口；
  issue_summary: 1、服务器中未关闭与业务无关的系统服务XXX；
  issue_detail: 经核查：1）查看运行中的服务，启用了多余服务XX；2）未关闭X磁盘默认共享功能；3）查看监听状态的端口，开启了多余端口。
  hazard: '1、多余服务可能存在安全漏洞，或影响服务器性能，造成业务中断；

    2、磁盘默认共享功能可能会被恶意利用，导致系统遭到病毒入侵和网络攻击；

    3、多余端口可能会被恶意利用，导致系统遭到病毒入侵和网络攻击。'
  remediation: '1、建议关闭服务器中与业务无关的系统服务XXX；

    2、建议关闭系统中X磁盘默认共享功能；

    3、建议关闭服务器中多余端口'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 13
  standard_code: L2-CES1-13
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  issue_summary: 未限制终端接入地址。
  issue_detail: 经核查：1）未对终端接入的方式或地址进行限制。
  hazard: 恶意用户可使用任意终端，尝试非授权访问服务器
  remediation: 建议设置严格的访问控制规则，如对IP地址段的限制
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 低
- seq: 14
  standard_code: L2-CES1-14
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求；
  issue_summary: /
  issue_detail: —
  hazard: /
  remediation: /
  threat: —
  inherent_risk: 中
- seq: 15
  standard_code: L2-CES1-15
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞。
  issue_summary: 未定期进行漏洞扫描，无法对可能存在的漏洞进行评估后再进行补丁修复。
  issue_detail: 经核查：1）未定期对服务器进行漏洞扫描；2）不具备漏洞扫描报告；3）未对发现的系统漏洞进行及时修复，若未定期进行漏扫，则只需要记录第1项。
  hazard: 无法及时发现系统中存在的漏洞，部分漏洞再未经过充分评估后进行修补，可能会对业务的连续性造成影响
  remediation: 建议定期对服务器进行漏洞扫描，并根据漏洞扫描报告进行漏洞修复
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 16
  standard_code: L2-CES1-16
  layer: 安全计算环境
  control_point: 恶意代码防范
  control_item: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  issue_summary: 1、未安装防病毒软件
  issue_detail: 经核查：1）未安装主机防病毒软件；2）未定期对病毒库进行更新；3）不具备杀毒记录，无法确保软件防护功能是否正常运行。
  hazard: 存在发生恶意代码在系统内部网络传播的可能性，可能导致信息系统被恶意代码感染，存在信息系统敏感信息泄露的风险
  remediation: 建议安装主机防病毒软件，并定期更新防病毒软件特征库
  threat: 病毒木马感染、勒索软件
  inherent_risk: 高
- seq: 17
  standard_code: L2-CES1-17
  layer: 安全计算环境
  control_point: 可信验证
  control_item: a）可基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心。
  issue_summary: 1、未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；
  issue_detail: 经核查：未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和计算应用程序等进行可信验证。
  hazard: '1、无可信链和可信验证,无法通过主动免疫可信验证技术提高系统自身安全防护能力，无法实现积极主动防御；

    2、存在不能及时发现可信性受到破坏而造成系统信息泄漏或损坏的风险。'
  remediation: '1、建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警；

    2、建议对可信验证设备的配置进行检查和调整，使其发现可信性受到破坏后及时向管理员进行报警。'
  threat: 系统被篡改无法发现、后门植入
  inherent_risk: 低
- seq: 18
  standard_code: L2-CES1-18
  layer: 安全计算环境
  control_point: 数据完整性
  control_item: a）应采用校验技术保证重要数据在传输过程中的完整性。
  issue_summary: 服务器远程管理时采用Telnet/Ftp明文传输方式，无法保证鉴别数据传输过程中的完整性
  issue_detail: 经核查：1）操作系统层面仅鉴别信息有完整性需求，远程访问服务器时，通过Telnet的方式不能保证鉴别数据在传输过程中的完整性。
  hazard: 可能导致鉴别数据在传输过程中被攻击者劫持、篡改，使传输数据的完整性遭到破坏。
  remediation: 建议远程连接管理时，采取相应措施防止鉴别信息被篡改，如使用SSL协议等
  threat: 传输或存储数据被篡改
  inherent_risk: 低
- seq: 19
  standard_code: L2-CES1-19
  layer: 安全计算环境
  control_point: 数据备份恢复
  control_item: a）应提供重要数据的本地数据备份与恢复功能；
  issue_summary: /
  issue_detail: —
  hazard: /
  remediation: /
  threat: —
  inherent_risk: 中
- seq: 20
  standard_code: L2-CES1-20
  layer: 安全计算环境
  control_point: 数据备份恢复
  control_item: b）应提供异地数据备份功能，利用通信网络将重要数据定时批量传送至备用场地。
  issue_summary: /
  issue_detail: —
  hazard: /
  remediation: /
  threat: —
  inherent_risk: 中
- seq: 21
  standard_code: L2-CES1-21
  layer: 安全计算环境
  control_point: 剩余信息保护
  control_item: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除。
  issue_summary: /
  issue_detail: /
  hazard: /
  remediation: /
  threat: 残留信息泄露
  inherent_risk: 低
- seq: 22
  standard_code: L2-CES1-22
  layer: 安全计算环境
  control_point: 个人信息保护
  control_item: a）应仅采集和保存业务必需的用户个人信息；
  issue_summary: 此类对象不涉及该控制项。
  issue_detail: —
  hazard: —
  remediation: —
  threat: —
  inherent_risk: 中
- seq: 23
  standard_code: L2-CES1-23
  layer: 安全计算环境
  control_point: 个人信息保护
  control_item: b）应禁止未授权访问和非法使用用户个人信息；
  issue_summary: 此类对象不涉及该控制项。
