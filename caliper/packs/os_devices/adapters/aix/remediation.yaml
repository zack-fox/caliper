- id: REM-AIX-4-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、未对登录操作系统的用户进行身份鉴别

    2、身份标识不具有唯一性

    3、管理员现用口令不满足口令复杂度要求

    4、操作系统未提供口令复杂度校验功能/口令复杂度校验功能参数设置不合理、未要求定期更换口令'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议操作系统实现身份鉴别功能，采用用户名和口令的方式对用户进行身份鉴别

    2、建议修改/etc/passwd文件，修改UID相同的用户

    3、建议修改管理用户现用口令，口令长度8位以上，包含大写字母、小写字母、数字以及特殊符号

    4、建议修改配置文件/etc/security/user，合理配置参数实现口令复杂校验功能及口令更换周期限制'
  clause: GB/T 22239-2019 4级 L4-CES1-01 身份鉴别
- id: REM-AIX-4-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、未提供登录失败处理、超时自动退出功能

    2、未提供登录失败吃力功能/登录失败处理功能设置不合理

    3、未提供超时自动退出功能/超时自动退出功能设置不合理'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议修改配置文件/etc/security/login.cfg或/etc/security/user实现登录失败处理功能

    2、建议修改配置文件/etc/profile，合理配置TimeOUT参数实现超时自动退出功能'
  clause: GB/T 22239-2019 4级 L4-CES1-02 身份鉴别
