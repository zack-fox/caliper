- seq: 1
  standard_code: L3-CES1-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换：
  issue_summary: 1、未对登录的用户进行身份鉴别；
  issue_detail: 经核查：1）未采用身份鉴别机制对登录的用户进行身份鉴别；2）存在同名账户XXX，身份标识不具备唯一性；3）系统当前账户口令长度小于8位，仅包含大写字母、小写字母、数字，特殊符号，口令复杂度不合规；4）查看Security.PasswordQualityControl值为：retry=3 min=disabled,disabled,disabled,7,7，修改密码可重试的次数为3，口令长度最小为7位，至少包含大写字母、小写字母、数字和特殊字符中的三类，口令复杂度策略设置不合规，查看Security.PasswordMaxDays值为：XX (大于90)，用户口令更新间隔时间较长，口令更新机制不合规。
  hazard: '1、鉴别信息不完善，使合法用户的鉴别信息更容易被攻击者所获取，从而使合法用户身份被冒用，对相关系统的正常运行带来影响；

    2、倘若发生安全事故，无法追溯到自然人；

    3、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    4、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    5、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性。'
  remediation: '1、建议登录访问服务器时必须对用户进行身份鉴别，不允许用空口令登录；

    2、建议为不同用户设立不同的身份标识；

    3、建议增强服务器口令强度，长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    4、建议在设置服务器口令复杂度策略，强制要求口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    5、建议完善服务器口令更换策略，如口令每月更新一次。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 2
  standard_code: L3-CES1-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施：
  issue_summary: 1、服务器未设置登录失败处理功能；
  issue_detail: 经核查：1）未具备设置登录失败锁定账户和登录连接超时自动退出的功能；2）未设置Security.AccountLockFailures和，Security.AccountUnlockTim参数，未设置完善的登录失败锁定策略；3）未设置应用程序超时时间或UserVars.HostClientSessionTimeout会话超时时间，或登录连接超时自动退出时间过长或短。
  hazard: '1、登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问；

    2、可能由于人员长时间离开电脑未锁屏而导致系统重要信息泄露。'
  remediation: '1、建议为服务器设置完善的登录失败处理功能，例如登录失败5次锁定30分钟；

    2、建议为服务器设置超时自动退出功能，例如600秒无操作自动退出。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
