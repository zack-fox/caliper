texts:
- seq: 1
  standard_code: L2-CES1-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 1、未对登录的用户进行身份鉴别；
  issue_detail: 经核查：1）未采用身份鉴别机制对登录的用户进行身份鉴别；2）存在同名账户XXX，身份标识不具备唯一性；3）系统当前账户口令长度小于8位，仅包含大写字母、小写字母、数字，特殊符号，口令复杂度不合规；4）查看Security.PasswordQualityControl值为：retry=3 min=disabled,disabled,disabled,7,7，修改密码可重试的次数为3，口令长度最小为7位，至少包含大写字母、小写字母、数字和特殊字符中的三类，口令复杂度策略设置不合规，查看Security.PasswordMaxDays值为：XX (大于90)，用户口令更新间隔时间较长，口令更新机制不合规。
  hazard: '1、鉴别信息不完善，使合法用户的鉴别信息更容易被攻击者所获取，从而使合法用户身份被冒用，对相关系统的正常运行带来影响；

    2、倘若发生安全事故，无法追溯到自然人；

    3、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    4、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    5、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性。'
  remediation: '1、建议登录访问服务器时必须对用户进行身份鉴别，不允许用空口令登录；

    2、建议为不同用户设立不同的身份标识；

    3、建议增强服务器口令强度，长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    4、建议在设置服务器口令复杂度策略，强制要求口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    5、建议完善服务器口令更换策略，如口令每月更新一次。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 2
  standard_code: L2-CES1-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 1、服务器未设置登录失败处理功能；
  issue_detail: 经核查：1）未具备设置登录失败锁定账户和登录连接超时自动退出的功能；2）未设置Security.AccountLockFailures和，Security.AccountUnlockTim参数，未设置完善的登录失败锁定策略；3）未设置应用程序超时时间或UserVars.HostClientSessionTimeout会话超时时间，或登录连接超时自动退出时间过长或短。
  hazard: '1、登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问；

    2、可能由于人员长时间离开电脑未锁屏而导致系统重要信息泄露。'
  remediation: '1、建议为服务器设置完善的登录失败处理功能，例如登录失败5次锁定30分钟；

    2、建议为服务器设置超时自动退出功能，例如600秒无操作自动退出。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 3
  standard_code: L2-CES1-03
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听。
  issue_summary: 1、远程登录服务器时采用XX明文传输协议进行连接；
  issue_detail: 经核查：1）该设备采用XXX协议进行远程管理；2）XXX协议不能防止鉴别信息在网络传输过程中被窃听。
  hazard: '1、帐号、口令等重要数据可能被嗅探并盗用，导致系统被非授权访问；

    2、增加了鉴别信息或管理信息被网络截取进行攻击的风险。'
  remediation: '1、建议在远程管理时采用SSH加密协议进行连接；

    2、建议关闭服务器Telnet/FTP等明文传输协议。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 4
  standard_code: L2-CES1-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: a）应对登录的用户分配账户和权限；
  issue_summary: 1、未对需要登录使用设备的人员单独设立账户并分配权限；
  issue_detail: 经核查：1）未对需要登录使用设备的人员单独设立账户并分配权限；2）存在匿名账户XXX，且未对其进行禁用或限制。
  hazard: '1、可能出现多人共用一个账户的情况，发生误操作不利于追溯自然人；

    2、存在可以通过匿名账户非授权访问设备造成风险的情况'
  remediation: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 5
  standard_code: L2-CES1-05
  layer: 安全计算环境
  control_point: 访问控制
  control_item: b）应重命名或删除默认账户，修改默认账户的默认口令；
  issue_summary: 1、服务器存在易猜测账户XX、YY；
  issue_detail: 经核查：1）主机→管理→安全和用户列表中存在XX、YY等易猜测账户；2）未修改易猜测账户的默认口令。
  hazard: '1、用户名及口令容易被恶意用户猜测获得，合法用户身份被仿冒，导致服务器被非授权访问；

    2、口令被恶意用户猜测获得，合法用户身份被仿冒，导致服务器被非授权访问。'
  remediation: '1、建议对服务器存在的易猜测账户XX、YY进行重命名或禁用删除相关账户；

    2、建议对服务器易猜测账户默认口令进行修改'
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 6
  standard_code: L2-CES1-06
  layer: 安全计算环境
  control_point: 访问控制
  control_item: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  issue_summary: 1、服务器中存在多余账户X；
  issue_detail: 经核查：1）用户列表中存在多余的账户：XX、YY；2）用户列表中存在过期的账户：XX、YY；3）账户与实际人员未对应，存在多人共用一个账户的情况。
  hazard: '1、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致服务器被非授权访问；

    2、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问；

    3、倘若发生安全事故，不便于追溯到自然人。'
  remediation: '1、建议删除服务器中多余账户X；

    2、建议删除服务器中过期账户X；

    3、建议为需要使用服务器的人员单独设立账户，避免多人共用一个账户的情况'
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 7
  standard_code: L2-CES1-07
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离。
  issue_summary: 未实现管理用户权限分离
  issue_detail: 经核查：1）未设立XX管理员账户、XX管理员账户..，未实现管理用户的权限分离。
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 8
  standard_code: L2-CES1-08
  layer: 安全计算环境
  control_point: 安全审计
  control_item: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  issue_summary: 1、服务器未启用审计服务；
  issue_detail: 经核查：1）未具备对重要事件进行记录的审计功能；2）syslog server服务显示为未运行，审计服务未开启；3）Config.HostAgent.log.level值为none，无法对用户行为进行审计；4）审计内容不完善，无法对重要的用户行为和重要安全事件进行审计。
  hazard: '1、安全审计不完善，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    2、安全审计不完善，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    3、安全审计不完善，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患。'
  remediation: '1、建议启用服务器审计服务syslog server；

    2、建议开启完善的审计策略，Config.HostAgent.log.level设置为info；

    3、建议完善服务器日志审计范围，将服务器中各种重要安全事件进行审计记录。'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 9
  standard_code: L2-CES1-09
  layer: 安全计算环境
  control_point: 安全审计
  control_item: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息；
  issue_summary: 服务器中日志记录仅包括XX，不够完善。
  issue_detail: 经核查：1）审计记录未包含日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息。
  hazard: 审计信息不完整，可能无法对安全事件进行有效追溯。
  remediation: 建议将服务器日志记录内容进行完善，至少包含：日期和时间、用户、事件类型、事件是否成功等重要信息。
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 10
  standard_code: L2-CES1-10
  layer: 安全计算环境
  control_point: 安全审计
  control_item: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等；
  issue_summary: 1、服务器中非授权用户可以对审计记录进行修改/删除；
  issue_detail: 经核查：1）审计记录管理权限划分不合理，审计日志能够进行删除；2）未设置Syslog.global.logHost日志服务器，无法对审计记录进行保存备份。
  hazard: '1、审计记录被删除，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    2、当存储空间被耗尽时，可能导致审计信息缺失，不便于安全事件的追溯；

    3、日志保存时间不足，审计信息缺失，不便于安全事件的追溯。'
  remediation: '1、建议将日志文件权限设置为644范围以内，避免非授权用户对其中的日志记录进行删除、修改；

    2、建议定期对服务器日志记录进行备份保存；

    3、建议加长日志记录的保存时间，至少保存6个月。'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 高
- seq: 11
  standard_code: L2-CES1-11
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  issue_summary: 1、服务器中安装了与多余的组件XXX；
  issue_detail: 经核查：1）安装了非必要的组件和应用程序：XX、YY；2）操作系统未遵循最小安装原则。
  hazard: '1、多余组件或应用程序可能存在安全漏洞，或影响服务器性能，造成业务中断；

    2、多余组件或应用程序可能存在安全漏洞，或影响服务器性能，造成业务中断。'
  remediation: '1、建议删除服务器中安装的多余组件XXX；

    2、建议将部分组件/应用程序XX安装过程中非必要的连带组件进行删除，确保最小安装'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 12
  standard_code: L2-CES1-12
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: b）应关闭不需要的系统服务、默认共享和高危端口；
  issue_summary: 1、服务器中未关闭与业务无关的系统服务XXX；
  issue_detail: 经核查：1）操作系统运行了不必要的系统服务：XX、YY；2）存在NFS网络文件目录：XX、YY；3）查看开启端口的列表，启用了多余端口。
  hazard: '1、多余服务可能存在安全漏洞，或影响服务器性能，造成业务中断；

    2、磁盘默认共享功能可能会被恶意利用，导致系统遭到病毒入侵和网络攻击；

    3、多余端口可能会被恶意利用，导致系统遭到病毒入侵和网络攻击。'
  remediation: '1、建议关闭服务器中与业务无关的系统服务XXX；

    2、建议关闭系统中X磁盘默认共享功能；

    3、建议关闭服务器中多余端口'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 13
  standard_code: L2-CES1-13
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  issue_summary: 1、未对服务器接入方式或网络地址范围进行限制；
  issue_detail: 经核查：1）vSphere Web Client未限制管理终端接入地址范围，允许来自所有IP地址的全部连接；2）管理终端网络地址范围设置不合理。
  hazard: '1、恶意用户可以尝试从任意终端对服务器进行访问并暴力破解，导致系统遭到入侵破坏；

    2、恶意用户可以尝试从任意终端对服务器进行访问并暴力破解，导致系统遭到入侵破坏。'
  remediation: '1、建议对服务器接入方式或网络地址范围进行限制（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）；

    2、建议合理限制服务器接入方式/网络地址范围（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）。'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 低
- seq: 14
  standard_code: L2-CES1-14
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求；
  issue_summary: /
  issue_detail: —
  hazard: /
  remediation: /
  threat: —
  inherent_risk: 中
- seq: 15
  standard_code: L2-CES1-15
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞。
  issue_summary: 1、未定期对服务器进行漏洞扫描；
  issue_detail: 经核查：1）未定期对服务器进行漏洞扫描；2）不具备漏洞扫描报告；3）未对发现的系统漏洞进行及时修复，若未定期进行漏扫，则只需要记录第1项。
  hazard: '1、可能存在安全漏洞，且漏洞可能被利用进行网络攻击影响正常运行，造成业务中断；

    2、无法有效收集掌握系统漏洞情况；

    3、安全漏洞可能被利用进行网络攻击影响正常运行，造成业务中断。'
  remediation: '1、建议定期对服务器进行漏洞扫描（至少一个季度进行一次）；

    2、建议每次开展漏洞扫描后将扫描报告进行保存留档；

    3、建议对扫描发现的服务器漏洞进行评估并修复，且保留修复记录。'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 16
  standard_code: L2-CES1-16
  layer: 安全计算环境
  control_point: 恶意代码防范
  control_item: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  issue_summary: 1、未部署主机防病毒软件；
  issue_detail: 经核查：1）未安装XX主机防病毒软件；2）未定期对病毒库进行更新；3）不具备杀毒记录，无法确保软件防护功能是否正常运行。
  hazard: '1、存在发生恶意代码在系统内部网络传播的可能性；

    2、病毒库更新不及时，存在恶意代码在系统内部网络传播的可能性；

    3、防病毒软件运行不正常，存在发生恶意代码在系统内部网络传播的可能性。'
  remediation: '1、建议为服务器部署主机防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议对防病毒软件进行故障排查，确保其运行正常，并保留杀毒记录'
  threat: 病毒木马感染、勒索软件
  inherent_risk: 高
- seq: 17
  standard_code: L2-CES1-17
  layer: 安全计算环境
