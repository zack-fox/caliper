  priority: 高
  problem: 未提供对重要主体和客体设置安全标记的功能。
  cause: 越权访问、权限滥用
  action: 建议对系统重要资源增加敏感标记的功能，并控制用户对已标记的敏感信息的操作。
  clause: GB/T 22239-2019 4级 L4-CES1-11 访问控制
- id: REM-ESXI-4-12
  title: 安全审计要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 12
  priority: 低
  problem: '1、服务器未启用审计服务；

    2、服务器审计策略不完善；

    3、服务器日志审计范围不够完善。'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议启用服务器审计服务syslog server；

    2、建议开启完善的审计策略，Config.HostAgent.log.level设置为info；

    3、建议完善服务器日志审计范围，将服务器中各种重要安全事件进行审计记录。'
  clause: GB/T 22239-2019 4级 L4-CES1-12 安全审计
- id: REM-ESXI-4-13
  title: 安全审计要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 13
  priority: 低
  problem: 服务器中日志记录仅包括XX，不够完善。
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 建议将服务器日志记录内容进行完善，至少包含：日期和时间、用户、事件类型、事件是否成功等重要信息。
  clause: GB/T 22239-2019 4级 L4-CES1-13 安全审计
- id: REM-ESXI-4-14
  title: 安全审计要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 14
  priority: 高
  problem: '1、服务器中非授权用户可以对审计记录进行修改/删除；

    2、未定期对服务器日志记录进行备份；

    3、服务器日志记录保存时间小于6个月。'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议将日志文件权限设置为644范围以内，避免非授权用户对其中的日志记录进行删除、修改；

    2、建议定期对服务器日志记录进行备份保存；

    3、建议加长日志记录的保存时间，至少保存6个月。'
  clause: GB/T 22239-2019 4级 L4-CES1-14 安全审计
- id: REM-ESXI-4-15
  title: 安全审计要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 15
  priority: 低
  problem: 服务器中存在XX账户可以非授权中止审计进程的情况。
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 建议删除或修改XX账户对审计进程的启停权限
  clause: GB/T 22239-2019 4级 L4-CES1-15 安全审计
- id: REM-ESXI-4-16
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 16
  priority: 高
  problem: '1、服务器中安装了与多余的组件XXX；

    2、服务器中部分组件/应用程序XX未遵循最小化安装原则。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议删除服务器中安装的多余组件XXX；

    2、建议将部分组件/应用程序XX安装过程中非必要的连带组件进行删除，确保最小安装'
  clause: GB/T 22239-2019 4级 L4-CES1-16 入侵防范
- id: REM-ESXI-4-17
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 17
  priority: 高
  problem: '1、服务器中未关闭与业务无关的系统服务XXX；

    2、未关闭服务器X磁盘默认共享功能；

    3、服务器中启用了多余端口'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议关闭服务器中与业务无关的系统服务XXX；

    2、建议关闭系统中X磁盘默认共享功能；

    3、建议关闭服务器中多余端口'
  clause: GB/T 22239-2019 4级 L4-CES1-17 入侵防范
- id: REM-ESXI-4-18
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 18
  priority: 低
  problem: '1、未对服务器接入方式或网络地址范围进行限制；

    2、服务器接入方式/网络地址范围限制不合理。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议对服务器接入方式或网络地址范围进行限制（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）；

    2、建议合理限制服务器接入方式/网络地址范围（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）。'
  clause: GB/T 22239-2019 4级 L4-CES1-18 入侵防范
- id: REM-ESXI-4-19
  title: 入侵防范要求未满足
