- id: REM-ESXI-3-04
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 4
  priority: 高
  problem: '服务器未采用双因子鉴别技术对登录用户进行身份验证

    或

    服务器所使用的X身份验证方式非密码技术技术。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '建议采用动态口令、数字证书、生物技术和设备指纹等两种或两种以上组合的鉴别技术对用户进行身份鉴别，其中一种鉴别应采用国家认可的密码技术；

    或

    建议将第二种身份鉴别方式改为采用国家认可的密码技术。'
  clause: GB/T 22239-2019 3级 L3-CES1-04 身份鉴别
