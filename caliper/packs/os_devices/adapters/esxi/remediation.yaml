    level:
    - 4
    family:
    - server
    item_seqs:
    - 19
  priority: 中
  problem: /
  cause: —
  action: /
  clause: GB/T 22239-2019 4级 L4-CES1-19 入侵防范
- id: REM-ESXI-4-20
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 20
  priority: 高
  problem: '1、未定期对服务器进行漏洞扫描；

    2、未提供服务器漏洞扫描报告；

    3、未对发现的服务器漏洞进行及时修复。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议定期对服务器进行漏洞扫描（至少一个季度进行一次）；

    2、建议每次开展漏洞扫描后将扫描报告进行保存留档；

    3、建议对扫描发现的服务器漏洞进行评估并修复，且保留修复记录。'
  clause: GB/T 22239-2019 4级 L4-CES1-20 入侵防范
- id: REM-ESXI-4-21
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 21
  priority: 低
  problem: '1、未部署主机型入侵检测系统；

    2、服务器部署的入侵检测系统无告警措施。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议部署主机型入侵检测软件，对服务器层面入侵行为进行检测；

    2、建议启用/增设入侵检测软件的实时告警功能，确保第一时间发现入侵行为并采取措施进行阻止。'
  clause: GB/T 22239-2019 4级 L4-CES1-21 入侵防范
- id: REM-ESXI-4-22
  title: 恶意代码防范要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 22
  priority: 高
  problem: '1、未部署主机防病毒软件；

    2、未定期对防病毒软件病毒库进行更新；

    3、防病毒软件中不具备杀毒记录，无法确保软件防护功能是否正常运行'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为服务器部署主机防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议对防病毒软件进行故障排查，确保其运行正常，并保留杀毒记录'
  clause: GB/T 22239-2019 4级 L4-CES1-22 恶意代码防范
- id: REM-ESXI-4-23
  title: 可信验证要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 23
  priority: 低
  problem: '1、服务器未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、不能够在应用程序所有执行环节进行动态可信验证；

    3、验证可信性受到破坏后未进行告警；

    4、验证结果未形成审计记录送至安全管理中心

    5、未进行动态关联感知'
  cause: 系统被篡改无法发现、后门植入
  action: 建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的所有执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心，并进行动态关联感知
  clause: GB/T 22239-2019 4级 L4-CES1-23 可信验证
