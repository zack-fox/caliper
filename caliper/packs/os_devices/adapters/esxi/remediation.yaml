  problem: '1、远程登录服务器时采用XX明文传输协议进行连接；

    2、服务器未关闭XX明文传输方式。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议在远程管理时采用SSH加密协议进行连接；

    2、建议关闭服务器Telnet/FTP等明文传输协议。'
  clause: GB/T 22239-2019 4级 L4-CES1-03 身份鉴别
- id: REM-ESXI-4-04
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 4
  priority: 高
  problem: '服务器未采用双因子鉴别技术对登录用户进行身份验证

    或

    服务器所使用的X身份验证方式非密码技术技术。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '建议采用动态口令、数字证书、生物技术和设备指纹等两种或两种以上组合的鉴别技术对用户进行身份鉴别，其中一种鉴别应采用国家认可的密码技术；

    或

    建议将第二种身份鉴别方式改为采用国家认可的密码技术。'
  clause: GB/T 22239-2019 4级 L4-CES1-04 身份鉴别
- id: REM-ESXI-4-05
  title: 访问控制要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 5
  priority: 高
  problem: '1、未对需要登录使用设备的人员单独设立账户并分配权限；

    2、未对匿名账户XXX进行禁用或限制'
  cause: 越权访问、权限滥用
  action: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  clause: GB/T 22239-2019 4级 L4-CES1-05 访问控制
