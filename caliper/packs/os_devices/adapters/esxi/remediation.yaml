- id: REM-ESXI-4-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、未对登录的用户进行身份鉴别；

    2、服务器用户身份标识不具备唯一性；

    3、服务器用户口令强度不够完善

    4、服务器未设置完善的密码复杂度校验机制；

    5、服务器未设置口令有效期；'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议登录访问服务器时必须对用户进行身份鉴别，不允许用空口令登录；

    2、建议为不同用户设立不同的身份标识；

    3、建议增强服务器口令强度，长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    4、建议在设置服务器口令复杂度策略，强制要求口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    5、建议完善服务器口令更换策略，如口令每月更新一次。'
  clause: GB/T 22239-2019 4级 L4-CES1-01 身份鉴别
- id: REM-ESXI-4-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、服务器未设置登录失败处理功能；

    2、服务器未设置超时自动退出功能。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议为服务器设置完善的登录失败处理功能，例如登录失败5次锁定30分钟；

    2、建议为服务器设置超时自动退出功能，例如600秒无操作自动退出。'
  clause: GB/T 22239-2019 4级 L4-CES1-02 身份鉴别
