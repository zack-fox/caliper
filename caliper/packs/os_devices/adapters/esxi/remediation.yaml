    2、未修改易猜测账户的默认口令。'
  cause: 越权访问、权限滥用
  action: '1、建议对服务器存在的易猜测账户XX、YY进行重命名或禁用删除相关账户；

    2、建议对服务器易猜测账户默认口令进行修改'
  clause: GB/T 22239-2019 4级 L4-CES1-06 访问控制
- id: REM-ESXI-4-07
  title: 访问控制要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 7
  priority: 高
  problem: '1、服务器中存在多余账户X；

    2、服务器中存在过期账户X；

    3、服务器中账户与实际人员未对应，存在多人共用一个账户的情况。'
  cause: 越权访问、权限滥用
  action: '1、建议删除服务器中多余账户X；

    2、建议删除服务器中过期账户X；

    3、建议为需要使用服务器的人员单独设立账户，避免多人共用一个账户的情况'
  clause: GB/T 22239-2019 4级 L4-CES1-07 访问控制
- id: REM-ESXI-4-08
  title: 访问控制要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 8
  priority: 高
  problem: 未实现管理用户权限分离
  cause: 越权访问、权限滥用
  action: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  clause: GB/T 22239-2019 4级 L4-CES1-08 访问控制
- id: REM-ESXI-4-09
  title: 访问控制要求未满足
  applies_to:
