    family:
    - server
    item_seqs:
    - 9
  priority: 高
  problem: '1、未指定授权主体负责访问控制策略的配置；

    2、服务器中存在文件XXXX访问权限设置不合理的情况。'
  cause: 越权访问、权限滥用
  action: '1、建议指定授权主体对服务器中访问控制策略进行配置；

    2、建议修改服务器中文件访问权限，设置在合理范围内。'
  clause: GB/T 22239-2019 4级 L4-CES1-09 访问控制
