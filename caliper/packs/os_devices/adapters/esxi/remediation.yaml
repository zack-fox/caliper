version: 0.1.0
status: active
rules:
- id: REM-ESXI-2-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、未对登录的用户进行身份鉴别；

    2、服务器用户身份标识不具备唯一性；

    3、服务器用户口令强度不够完善

    4、服务器未设置完善的密码复杂度校验机制；

    5、服务器未设置口令有效期；'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议登录访问服务器时必须对用户进行身份鉴别，不允许用空口令登录；

    2、建议为不同用户设立不同的身份标识；

    3、建议增强服务器口令强度，长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    4、建议在设置服务器口令复杂度策略，强制要求口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    5、建议完善服务器口令更换策略，如口令每月更新一次。'
  clause: GB/T 22239-2019 2级 L2-CES1-01 身份鉴别
- id: REM-ESXI-2-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、服务器未设置登录失败处理功能；

    2、服务器未设置超时自动退出功能。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议为服务器设置完善的登录失败处理功能，例如登录失败5次锁定30分钟；

    2、建议为服务器设置超时自动退出功能，例如600秒无操作自动退出。'
  clause: GB/T 22239-2019 2级 L2-CES1-02 身份鉴别
- id: REM-ESXI-2-03
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 3
  priority: 低
  problem: '1、远程登录服务器时采用XX明文传输协议进行连接；

    2、服务器未关闭XX明文传输方式。'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议在远程管理时采用SSH加密协议进行连接；

    2、建议关闭服务器Telnet/FTP等明文传输协议。'
  clause: GB/T 22239-2019 2级 L2-CES1-03 身份鉴别
- id: REM-ESXI-2-04
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 4
  priority: 低
  problem: '1、未对需要登录使用设备的人员单独设立账户并分配权限；

    2、未对匿名账户XXX进行禁用或限制'
  cause: 越权访问、权限滥用
  action: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  clause: GB/T 22239-2019 2级 L2-CES1-04 访问控制
- id: REM-ESXI-2-05
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 5
  priority: 中
  problem: '1、服务器存在易猜测账户XX、YY；

    2、未修改易猜测账户的默认口令。'
  cause: 越权访问、权限滥用
  action: '1、建议对服务器存在的易猜测账户XX、YY进行重命名或禁用删除相关账户；

    2、建议对服务器易猜测账户默认口令进行修改'
  clause: GB/T 22239-2019 2级 L2-CES1-05 访问控制
- id: REM-ESXI-2-06
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 6
  priority: 高
  problem: '1、服务器中存在多余账户X；

    2、服务器中存在过期账户X；

    3、服务器中账户与实际人员未对应，存在多人共用一个账户的情况。'
  cause: 越权访问、权限滥用
  action: '1、建议删除服务器中多余账户X；

    2、建议删除服务器中过期账户X；

    3、建议为需要使用服务器的人员单独设立账户，避免多人共用一个账户的情况'
  clause: GB/T 22239-2019 2级 L2-CES1-06 访问控制
- id: REM-ESXI-2-07
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 7
  priority: 低
  problem: 未实现管理用户权限分离
  cause: 越权访问、权限滥用
  action: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  clause: GB/T 22239-2019 2级 L2-CES1-07 访问控制
- id: REM-ESXI-2-08
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 8
  priority: 低
  problem: '1、服务器未启用审计服务；

    2、服务器审计策略不完善；

    3、服务器日志审计范围不够完善。'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议启用服务器审计服务syslog server；

    2、建议开启完善的审计策略，Config.HostAgent.log.level设置为info；

    3、建议完善服务器日志审计范围，将服务器中各种重要安全事件进行审计记录。'
  clause: GB/T 22239-2019 2级 L2-CES1-08 安全审计
- id: REM-ESXI-2-09
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 9
  priority: 低
  problem: 服务器中日志记录仅包括XX，不够完善。
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 建议将服务器日志记录内容进行完善，至少包含：日期和时间、用户、事件类型、事件是否成功等重要信息。
  clause: GB/T 22239-2019 2级 L2-CES1-09 安全审计
- id: REM-ESXI-2-10
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 10
  priority: 高
  problem: '1、服务器中非授权用户可以对审计记录进行修改/删除；

    2、未定期对服务器日志记录进行备份；

    3、服务器日志记录保存时间小于6个月。'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议将日志文件权限设置为644范围以内，避免非授权用户对其中的日志记录进行删除、修改；

    2、建议定期对服务器日志记录进行备份保存；

    3、建议加长日志记录的保存时间，至少保存6个月。'
  clause: GB/T 22239-2019 2级 L2-CES1-10 安全审计
- id: REM-ESXI-2-11
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 11
  priority: 高
  problem: '1、服务器中安装了与多余的组件XXX；

    2、服务器中部分组件/应用程序XX未遵循最小化安装原则。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议删除服务器中安装的多余组件XXX；

    2、建议将部分组件/应用程序XX安装过程中非必要的连带组件进行删除，确保最小安装'
  clause: GB/T 22239-2019 2级 L2-CES1-11 入侵防范
- id: REM-ESXI-2-12
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 12
  priority: 高
  problem: '1、服务器中未关闭与业务无关的系统服务XXX；

    2、未关闭服务器X磁盘默认共享功能；

    3、服务器中启用了多余端口'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议关闭服务器中与业务无关的系统服务XXX；

    2、建议关闭系统中X磁盘默认共享功能；

    3、建议关闭服务器中多余端口'
  clause: GB/T 22239-2019 2级 L2-CES1-12 入侵防范
- id: REM-ESXI-2-13
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 13
  priority: 低
  problem: '1、未对服务器接入方式或网络地址范围进行限制；

    2、服务器接入方式/网络地址范围限制不合理。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议对服务器接入方式或网络地址范围进行限制（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）；

    2、建议合理限制服务器接入方式/网络地址范围（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）。'
  clause: GB/T 22239-2019 2级 L2-CES1-13 入侵防范
- id: REM-ESXI-2-14
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 14
  priority: 中
  problem: /
  cause: —
  action: /
  clause: GB/T 22239-2019 2级 L2-CES1-14 入侵防范
- id: REM-ESXI-2-15
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 15
  priority: 高
  problem: '1、未定期对服务器进行漏洞扫描；

    2、未提供服务器漏洞扫描报告；

    3、未对发现的服务器漏洞进行及时修复。'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议定期对服务器进行漏洞扫描（至少一个季度进行一次）；

    2、建议每次开展漏洞扫描后将扫描报告进行保存留档；

    3、建议对扫描发现的服务器漏洞进行评估并修复，且保留修复记录。'
  clause: GB/T 22239-2019 2级 L2-CES1-15 入侵防范
- id: REM-ESXI-2-16
  title: 恶意代码防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 16
  priority: 高
  problem: '1、未部署主机防病毒软件；

    2、未定期对防病毒软件病毒库进行更新；

    3、防病毒软件中不具备杀毒记录，无法确保软件防护功能是否正常运行'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为服务器部署主机防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议对防病毒软件进行故障排查，确保其运行正常，并保留杀毒记录'
  clause: GB/T 22239-2019 2级 L2-CES1-16 恶意代码防范
- id: REM-ESXI-2-17
  title: 可信验证要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 17
  priority: 低
  problem: '1、未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、部署了可信验证检测的设备，但检测到可信性受到破坏时无法进行报警。'
  cause: 系统被篡改无法发现、后门植入
  action: '1、建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警；

    2、建议对可信验证设备的配置进行检查和调整，使其发现可信性受到破坏后及时向管理员进行报警。'
  clause: GB/T 22239-2019 2级 L2-CES1-17 可信验证
- id: REM-ESXI-2-18
  title: 数据完整性要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 18
  priority: 低
  problem: 服务器远程管理时采用Telnet/Ftp明文传输方式，无法保证鉴别数据传输过程中的完整性
  cause: 传输或存储数据被篡改
  action: 建议采用SSH远程连接服务器，保证鉴别数据在传输过程中的完整性
  clause: GB/T 22239-2019 2级 L2-CES1-18 数据完整性
