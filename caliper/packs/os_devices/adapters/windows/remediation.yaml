  title: 可信验证要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 23
  priority: 低
  problem: '1、未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、部署了可信验证检测的设备，但检测到可信性受到破坏时无法进行报警。'
  cause: 系统被篡改无法发现、后门植入
  action: '1、建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警；

    2、建议对可信验证设备的配置进行检查和调整，使其发现可信性受到破坏后及时向管理员进行报警。'
  clause: GB/T 22239-2019 3级 L3-CES1-24 可信验证
