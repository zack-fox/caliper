version: 0.1.0
status: active
rules:
- id: REM-WINDOWS-2-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、登录操作系统时未对用户进行身份鉴别；

    2、操作系统中用户身份标识不唯一；

    3、操作系统口令强度不完善；

    4、操作系统未设置口令复杂度策略或口令更换周期策略

    5、未在三个月内进行口令更改'
  cause: 身份冒用、口令猜测与暴力破解
  action: "1、建议登录操作系统时必须对用户进行身份鉴别，不允许用空口令进行登录；\n2、建议为不同用户设立不同的身份标识；\n3、建议增强当前使用账户的口令强度，使口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种；\n4、建议启用操作系统口令复杂度策略和口令更换周期策略，保证口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种，且保证定期90天系统提醒更换账户口令，策略设置如下：\n密码复杂度要求：已启用       \n密码长度最小值：8个字符     \n密码最短使用周期：1天\n密码最长使用期限：90天      \n强制密码历史：3个记住的密码      \n用可还原的加密来存储密码：已禁用\n5、建议每个三月内进行一次口令更改。"
  clause: GB/T 22239-2019 2级 L2-CES1-01 身份鉴别
- id: REM-WINDOWS-2-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、操作系统未设置登录失败处理功能；

    2、操作系统未设置超时自动退出功能'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议启用操作系统的登录失败处理功能，如登录失败5次锁定30分钟，策略设置如下:

    账户锁定时间：30X分钟

    账户锁定阈值：5次无效登录

    复位账户锁定计数器：30分钟之后；

    2、建议启用操作系统屏幕保护功能，勾选“在恢复时显示登录屏幕”，等待时间设置为30分钟后自动断开连接'
  clause: GB/T 22239-2019 2级 L2-CES1-02 身份鉴别
- id: REM-WINDOWS-2-03
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 3
  priority: 低
  problem: '1、操作系统未采用加密方式进行远程管理；

    2、未设置RDP连接的安全层级别'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议禁止Telnet/FTP的明文传输管理方式；

    2、建议将“远程（RDP）连接要求使用指定的安全层”设置为“SSL”'
  clause: GB/T 22239-2019 2级 L2-CES1-03 身份鉴别
- id: REM-WINDOWS-2-04
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 4
  priority: 低
  problem: '1、未对需要登录使用设备的人员单独设立账户并分配权限；

    2、未对匿名账户XXX进行禁用或限制'
  cause: 越权访问、权限滥用
  action: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  clause: GB/T 22239-2019 2级 L2-CES1-04 访问控制
- id: REM-WINDOWS-2-05
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 5
  priority: 中
  problem: '1、未重命名默认管理用户Administrator的账户名、未禁用默认账户Guest；

    2、未修改XXX默认账户的默认口令'
  cause: 越权访问、权限滥用
  action: '1、建议重命名操作系统默认管理用户Administrator的账户名，禁用默认账户Guest；

    2、建议修改XXX默认账户的默认口令'
  clause: GB/T 22239-2019 2级 L2-CES1-05 访问控制
- id: REM-WINDOWS-2-06
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 6
  priority: 高
  problem: '1、操作系统中存在多余账户XXX；

    2、操作系统中存在过期账户XXX；

    3、操作系统中账户与实际人员未对应，存在多人共用一个账户XXX的情况'
  cause: 越权访问、权限滥用
  action: '1、建议删除操作系统中多余账户XXX；

    2、建议删除操作系统中过期账户XXX；

    3、建议为需要使用操作系统的人员单独设立账户，避免多人共用一个账户的情况'
  clause: GB/T 22239-2019 2级 L2-CES1-06 访问控制
- id: REM-WINDOWS-2-07
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 7
  priority: 低
  problem: 未实现管理用户权限分离
  cause: 越权访问、权限滥用
  action: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  clause: GB/T 22239-2019 2级 L2-CES1-07 访问控制
- id: REM-WINDOWS-2-08
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 8
  priority: 低
  problem: '1、操作系统未启用审计功能；

    2、操作系统审计对象未覆盖到全部用户；

    3、操作系统行为审计未覆盖到全部的用户行为或安全事件'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议启用操作系统的审计功能；

    2、建议启用操作系统审计功能中与用户账户相关的审计策略；

    3、启用操作系统审计功能中各种重要安全事件相关的审计策略'
  clause: GB/T 22239-2019 2级 L2-CES1-08 安全审计
- id: REM-WINDOWS-2-09
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 9
  priority: 低
  problem: 操作系统审计记录仅包含XX，无法完整的记录审计相关的信息
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 建议完整的记录操作系统审计相关信息，至少应包含：日期和时间、用户、事件类型、事件是否成功等重要信息
  clause: GB/T 22239-2019 2级 L2-CES1-09 安全审计
- id: REM-WINDOWS-2-10
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 10
  priority: 高
  problem: '1、操作系统中存在XX账户/XX组账户能够对审计记录进行修改/删除；

    2、未定期对操作系统日志记录进行备份；

    3、操作系统日志记录保存时间小于6个月'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议修改XX账户/XX组账户的权限，限制账户对操作系统日志记录的删除、修改等操作权限；

    2、建议定期3个月对操作系统日志记录进行备份保存；

    3、建议延长日志记录的保存时间，至少保证日志记录留存时间大于6个月'
  clause: GB/T 22239-2019 2级 L2-CES1-10 安全审计
- id: REM-WINDOWS-2-11
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 11
  priority: 高
  problem: '1、操作系统中安装了与多余的组件XXX/应用软件XXX；

    2、操作系统中部分组件XXX/应用程序XXX未遵循最小化安装原则'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议删除操作系统中安装的多余组件XXX/应用软件XXX；

    2、建议删除部分组件XXX/应用程序XXX中非必要的连带组件，确保最小化安装。'
  clause: GB/T 22239-2019 2级 L2-CES1-11 入侵防范
- id: REM-WINDOWS-2-12
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 12
  priority: 高
  problem: '1、操作系统中未关闭不必要的系统服务XXX；

    2、操作系统未关闭默认共享功能；

    3、操作系统中未关闭不必要的端口'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议关闭操作系统中不必要的系统服务XXX；

    2、建议关闭操作系统的默认共享功能；

    3、建议关闭操作系统中不必要的端口'
  clause: GB/T 22239-2019 2级 L2-CES1-12 入侵防范
- id: REM-WINDOWS-2-13
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 13
  priority: 低
  problem: '1、未对操作系统的接入方式/网络地址范围进行限制；

    2、操作系统接入方式/网络地址范围限制不合理'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议对操作系统接入方式/网络地址范围进行限制（例如必须通过VPN、堡垒机等进行登录访问，限制仅特定IP地址段能够访问等）；

    2、建议合理设置操作系统的接入方式/网络地址范围（例如必须通过VPN、堡垒机等进行登录访问，限制仅特定IP地址段能够访问等）'
  clause: GB/T 22239-2019 2级 L2-CES1-13 入侵防范
- id: REM-WINDOWS-2-14
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 14
  priority: 中
  problem: /
  cause: —
  action: /
  clause: GB/T 22239-2019 2级 L2-CES1-14 入侵防范
- id: REM-WINDOWS-2-15
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 15
  priority: 高
  problem: '1、未定期对操作系统进行漏洞扫描；

    2、未提供操作系统漏洞扫描报告；

    3、未及时对发现的操作系统漏洞进行测试和修复'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议定期1-3个月对操作系统进行一次漏洞扫描；

    2、建议每次漏洞扫描后将扫描报告保存留档；

    3、建议对扫描发现的操作系统漏洞进行测试评估并修复，保留相应的修复记录。'
  clause: GB/T 22239-2019 2级 L2-CES1-15 入侵防范
- id: REM-WINDOWS-2-16
  title: 恶意代码防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 16
  priority: 高
  problem: '1、操作系统未安装主机防病毒软件；

    2、未定期对防病毒软件的病毒库进行更新；

    3、防病毒软件中不具备杀毒记录，无法确保软件防护功能是否正常运行'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为操作系统部署主机型防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议对防病毒软件进行功能进行配置，确保其杀毒和拦截功能运行正常，并保留相应的记录。'
  clause: GB/T 22239-2019 2级 L2-CES1-16 恶意代码防范
- id: REM-WINDOWS-2-17
  title: 可信验证要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 17
  priority: 低
  problem: '1、未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、部署了可信验证检测的设备，但检测到可信性受到破坏时无法进行报警。'
  cause: 系统被篡改无法发现、后门植入
  action: '1、建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警；

    2、建议对可信验证设备的配置进行检查和调整，使其发现可信性受到破坏后及时向管理员进行报警。'
  clause: GB/T 22239-2019 2级 L2-CES1-17 可信验证
- id: REM-WINDOWS-2-18
  title: 数据完整性要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 18
  priority: 低
  problem: '操作系统远程管理时采用Telnet/Ftp协议，无法保证鉴别数据传输过程中的完整性

    或

    未启用并设置“远程（RDP）连接要求使用指定的安全层”为“SSL”'
  cause: 传输或存储数据被篡改
  action: 建议采用加密的远程连接方式对操作系统管理，如采用RDP协议的远程桌面管理方式，并设置“远程（RDP）连接要求使用指定的安全层”为“SSL”
  clause: GB/T 22239-2019 2级 L2-CES1-18 数据完整性
- id: REM-WINDOWS-2-19
  title: 数据备份恢复要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 19
  priority: 中
  problem: /
  cause: —
  action: /
  clause: GB/T 22239-2019 2级 L2-CES1-19 数据备份恢复
- id: REM-WINDOWS-2-20
  title: 数据备份恢复要求未满足
  applies_to:
    level:
