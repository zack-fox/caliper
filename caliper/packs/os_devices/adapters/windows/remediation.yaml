  priority: 高
  problem: '1、操作系统中存在XX账户/XX组账户能够对审计记录进行修改/删除；

    2、未定期对操作系统日志记录进行备份；

    3、操作系统日志记录保存时间小于6个月'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议修改XX账户/XX组账户的权限，限制账户对操作系统日志记录的删除、修改等操作权限；

