    family:
    - server
    item_seqs:
    - 22
  priority: 高
  problem: '1、操作系统未安装主机防病毒软件；

    2、未定期对防病毒软件的病毒库进行更新；

    3、防病毒软件中不具备杀毒记录，无法确保软件防护功能是否正常运行'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为操作系统部署主机型防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议对防病毒软件进行功能进行配置，确保其杀毒和拦截功能运行正常，并保留相应的记录。'
  clause: GB/T 22239-2019 3级 L3-CES1-23 恶意代码防范
