    - 4
    family:
    - server
    item_seqs:
    - 22
  priority: 高
  problem: '1、操作系统未安装具有防恶意代码功能的软件；

    2、未定期对防恶意代码软件及其病毒库进行更新；

    3、未采用具备主动免疫的可信验证技术识别入侵和病毒行为；

    4、防恶意代码软件中不具备入侵阻断记录或杀毒记录，无法确保软件防护功能是否正常运行'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为操作系统部署具有防恶意代码功能的软件；

    2、建议定期对防恶意代码软件及其病毒库进行更新；

    3、建议采用具备主动免疫的可信验证技术来识别入侵和病毒行为；

    4、建议对防病毒软件进行功能进行配置，确保其杀毒和拦截功能运行正常，并保留相应的阻断记录及杀毒记录。'
  clause: GB/T 22239-2019 4级 L4-CES1-22 恶意代码防范
