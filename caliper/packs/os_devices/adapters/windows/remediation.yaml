- id: REM-WINDOWS-4-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、登录操作系统时未对用户进行身份鉴别；

    2、操作系统中用户身份标识不唯一；

    3、操作系统口令强度不完善；

    4、操作系统未设置口令复杂度策略或口令更换周期策略

    5、未在三个月内进行口令更改'
  cause: 身份冒用、口令猜测与暴力破解
  action: "1、建议登录操作系统时必须对用户进行身份鉴别，不允许用空口令进行登录；\n2、建议为不同用户设立不同的身份标识；\n3、建议增强当前使用账户的口令强度，使口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种；\n4、建议启用操作系统口令复杂度策略和口令更换周期策略，保证口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种，且保证定期90天系统提醒更换账户口令，策略设置如下：\n密码复杂度要求：已启用       \n密码长度最小值：8个字符     \n密码最短使用周期：1天\n密码最长使用期限：90天      \n强制密码历史：3个记住的密码      \n用可还原的加密来存储密码：已禁用\n5、建议每个三月内进行一次口令更改。"
  clause: GB/T 22239-2019 4级 L4-CES1-01 身份鉴别
- id: REM-WINDOWS-4-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、操作系统未设置登录失败处理功能；

    2、操作系统未设置超时自动退出功能'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议启用操作系统的登录失败处理功能，如登录失败5次锁定30分钟，策略设置如下:

    账户锁定时间：30X分钟

    账户锁定阈值：5次无效登录

    复位账户锁定计数器：30分钟之后；

    2、建议启用操作系统屏幕保护功能，勾选“在恢复时显示登录屏幕”，等待时间设置为30分钟后自动断开连接'
  clause: GB/T 22239-2019 4级 L4-CES1-02 身份鉴别
- id: REM-WINDOWS-4-03
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 3
  priority: 高
  problem: '1、操作系统未采用加密方式进行远程管理；

    2、未设置RDP连接的安全层级别'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议禁止Telnet/FTP的明文传输管理方式；

    2、建议将“远程（RDP）连接要求使用指定的安全层”设置为“SSL”'
  clause: GB/T 22239-2019 4级 L4-CES1-03 身份鉴别
- id: REM-WINDOWS-4-04
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 4
  priority: 高
  problem: '1、操作系统未采用双因子鉴别技术对登录用户进行身份验证

    2、操作系统所使用的XX身份验证方式不为密码技术'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议登录操作系统时采用双因子鉴别技术对用户进行身份鉴别，例如用户名/口令+USB-key/数字证书/令牌等；

    2、建议将其中一种身份鉴别方式改为密码技术'
  clause: GB/T 22239-2019 4级 L4-CES1-04 身份鉴别
