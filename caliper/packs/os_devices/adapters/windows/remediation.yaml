  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 20
  priority: 高
  problem: '1、未定期对操作系统进行漏洞扫描；

    2、未提供操作系统漏洞扫描报告；

    3、未及时对发现的操作系统漏洞进行测试和修复'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议定期1-3个月对操作系统进行一次漏洞扫描；

    2、建议每次漏洞扫描后将扫描报告保存留档；

    3、建议对扫描发现的操作系统漏洞进行测试评估并修复，保留相应的修复记录。'
  clause: GB/T 22239-2019 3级 L3-CES1-21 入侵防范
