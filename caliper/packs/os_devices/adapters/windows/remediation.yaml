  title: 入侵防范要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 21
  priority: 低
  problem: '1、未部署主机型入侵检测系统；

    2、操作系统部署的入侵检测系统无告警措施'
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: '1、建议部署主机型入侵检测软件，对操作系统层面入侵行为进行检测；

    2、建议启用/增设入侵检测软件的实时告警功能，确保第一时间发现入侵行为并采取措施进行阻止。'
