    family:
    - server
    item_seqs:
    - 20
  priority: 中
  problem: /
  cause: —
  action: /
  clause: GB/T 22239-2019 2级 L2-CES1-20 数据备份恢复
- id: REM-WINDOWS-2-21
  title: 剩余信息保护要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 21
  priority: 低
  problem: 操作系统未采取措施清除剩余鉴别信息
  cause: 残留信息泄露
  action: 建议将操作系统“交互式登录：不显示最后的用户名”、“关机：清除虚拟内存页面”两项策略设置为启用状态，避免鉴别信息被恶意获取。
  clause: GB/T 22239-2019 2级 L2-CES1-21 剩余信息保护
