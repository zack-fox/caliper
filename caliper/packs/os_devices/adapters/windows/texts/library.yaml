texts:
- seq: 1
  standard_code: L2-CES1-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换：
  issue_summary: 1、登录操作系统时未对用户进行身份鉴别；
  issue_detail: 经核查：1）登录操作系统时未使用用户名及口令，未使用口令进行登录，查看control userpasswords2，未勾选“要使用本计算机，用户必须输入用户名和密码”；2）查看“控制面板-管理工具-计算机管理-本地用户和组”，具有相同的账户名XXXX；3）当前登录的用户口令长度小于8位，仅包含大写字母、小写字母、数字、特殊符号中的其中一种/两种；4）查看“控制面板-管理工具-计算机管理-本地用户和组”，XXX账户勾选了密码永不过期，查看“控制面板-管理工具-本地安全策略-账户策略-密码策略”，口令长度及更换周期设置如下：，密码复杂度要求：        已禁用，密码长度最小值：         xx个字符，密码最短使用周期：     xx天，密码最长使用期限：     xx天，强制密码历史：             xx个记住的密码，用可还原的加密来存储密码：  已启用；5）执行命令net user查看XXX账户上次修改口令时间为XXXX，在三个月内未进行口令更换，不满足安全要求。
  hazard: '1、鉴别信息不完善，使合法用户的鉴别信息更容易被攻击者所获取，从而使合法用户身份被冒用，对相关系统的正常运行带来影响；

    2、发生安全事故后，可能无法追溯到自然人；

    3、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    4、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；

    5、存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性；'
  remediation: "1、建议登录操作系统时必须对用户进行身份鉴别，不允许用空口令进行登录；\n2、建议为不同用户设立不同的身份标识；\n3、建议增强当前使用账户的口令强度，使口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种；\n4、建议启用操作系统口令复杂度策略和口令更换周期策略，保证口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种，且保证定期90天系统提醒更换账户口令，策略设置如下：\n密码复杂度要求：已启用       \n密码长度最小值：8个字符     \n密码最短使用周期：1天\n密码最长使用期限：90天      \n强制密码历史：3个记住的密码      \n用可还原的加密来存储密码：已禁用\n5、建议每个三月内进行一次口令更改。"
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 2
  standard_code: L2-CES1-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施：
  issue_summary: 1、操作系统未设置登录失败处理功能；
  issue_detail: 经核查：1）操作系统具有登录失败处理功能和登录连接超时处理功能；2）查看“控制面板-管理工具-本地安全策略-账户策略-密码锁定策略”，操作系统未启用登录失败处理功能，账户锁定策略为：，账户锁定时间：不适用，账户锁定阈值：0次无效登录，复位账户锁定计数器：不适用；3）查看“个性化-屏幕保护程序”，操作系统未启用屏幕保护功能，未勾选“在恢复时显示登录屏幕”。
  hazard: '1、登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问；

    2、可能存在由于人员长时间离开未自动退出而导致系统重要信息泄露。'
  remediation: '1、建议启用操作系统的登录失败处理功能，如登录失败5次锁定30分钟，策略设置如下:

    账户锁定时间：30X分钟

    账户锁定阈值：5次无效登录

    复位账户锁定计数器：30分钟之后；

    2、建议启用操作系统屏幕保护功能，勾选“在恢复时显示登录屏幕”，等待时间设置为30分钟后自动断开连接'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 3
  standard_code: L2-CES1-03
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听。
  issue_summary: 1、操作系统未采用加密方式进行远程管理；
  issue_detail: 经核查：1）登录操作系统时采用远程管理的方式，；2）未启用“远程（RDP）连接要求使用指定的安全层”；3）未禁用Telnet、FTP的方式，无法保证鉴别数据在网络传输过程中的保密性。
  hazard: '1、使用XXX远程管理方式时使用明文传输协议进行网络管理，增加了鉴别信息或管理信息被网络截取进行攻击的风险。

    2、未设置安全层级别，远程管理时加密强度不够存在风险'
  remediation: '1、建议禁止Telnet/FTP的明文传输管理方式；

    2、建议将“远程（RDP）连接要求使用指定的安全层”设置为“SSL”'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 4
  standard_code: L2-CES1-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: a）应对登录的用户分配账户和权限；
  issue_summary: 1、未对需要登录使用设备的人员单独设立账户并分配权限；
  issue_detail: 经核查：1）未对需要登录使用设备的人员单独设立账户并分配权限；2）存在匿名账户XXX，且未对其进行禁用或限制。
  hazard: '1、可能出现多人共用一个账户的情况，发生误操作不利于追溯自然人；

    2、存在可以通过匿名账户非授权访问设备造成风险的情况'
  remediation: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 5
  standard_code: L2-CES1-05
  layer: 安全计算环境
  control_point: 访问控制
  control_item: b）应重命名或删除默认账户，修改默认账户的默认口令：
  issue_summary: 1、未重命名默认管理用户Administrator的账户名、未禁用默认账户Guest；
  issue_detail: 经核查：1）未重命名默认管理用户Administrator的账户名，未禁用默认账户Guest；2）未修改XXX默认账户的默认口令。
  hazard: '1、用户名及口令更容易被恶意用户猜测获得，合法用户身份被仿冒，导致操作系统被非授权访问；

    2、口令被恶意用户猜测获得，合法用户身份被仿冒，导致操作系统被非授权访问。'
  remediation: '1、建议重命名操作系统默认管理用户Administrator的账户名，禁用默认账户Guest；

    2、建议修改XXX默认账户的默认口令'
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 6
  standard_code: L2-CES1-06
  layer: 安全计算环境
  control_point: 访问控制
  control_item: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在：
  issue_summary: 1、操作系统中存在多余账户XXX；
  issue_detail: 经核查：1）操作系统中存在多余账户XXX；2）操作系统中存在过期账户XXX；3）账户与实际人员未对应，存在多人共用一个账户XXX的情况。
  hazard: '1、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致操作系统被非授权访问；

    2、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问；

    3、发生安全事故后，可能不便于追溯到自然人。'
  remediation: '1、建议删除操作系统中多余账户XXX；

    2、建议删除操作系统中过期账户XXX；

    3、建议为需要使用操作系统的人员单独设立账户，避免多人共用一个账户的情况'
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 7
  standard_code: L2-CES1-07
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离：
  issue_summary: 未实现管理用户权限分离
  issue_detail: 经核查：1）未设立系统管理员账户、审计管理员账户、安全管理员等账户，未实现管理用户的权限分离。
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 8
  standard_code: L2-CES1-08
  layer: 安全计算环境
  control_point: 安全审计
  control_item: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计：
  issue_summary: 1、操作系统未启用审计功能；
  issue_detail: 经核查：1）操作系统未启用日志审计功能。
  hazard: '1、可能存在无法对安全事件进行准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    2、可能存在无法对安全事件进行准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    3、可能存在无法对安全事件进行准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患。'
  remediation: '1、建议启用操作系统的审计功能；

    2、建议启用操作系统审计功能中与用户账户相关的审计策略；

    3、启用操作系统审计功能中各种重要安全事件相关的审计策略'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 9
  standard_code: L2-CES1-09
  layer: 安全计算环境
  control_point: 安全审计
  control_item: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息：
  issue_summary: 操作系统审计记录仅包含XX，无法完整的记录审计相关的信息
  issue_detail: 经核查：1）操作系统审计记录中未包含：XX、XXX、XX、XX等审计相关信息。
  hazard: 审计相关的信息不完整，可能造成无法对安全事件进行有效追溯。
  remediation: 建议完整的记录操作系统审计相关信息，至少应包含：日期和时间、用户、事件类型、事件是否成功等重要信息
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 10
  standard_code: L2-CES1-10
  layer: 安全计算环境
  control_point: 安全审计
  control_item: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等。
  issue_summary: 1、操作系统中存在XX账户/XX组账户能够对审计记录进行修改/删除；
  issue_detail: 经核查：1）未对审计记录进行保护，XX账户/XX组账户能够手动删除或修改审计记录；2）未定期对审计记录进行备份；3）审计记录保存时间小于6个月。
  hazard: '1、可能导致审计管理员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    2、当存储空间被耗尽时，可能导致审计信息缺失，不便于安全事件的追溯；

    3、日志保存时间不足，审计信息缺失，不便于安全事件的追溯。'
  remediation: '1、建议修改XX账户/XX组账户的权限，限制账户对操作系统日志记录的删除、修改等操作权限；

    2、建议定期3个月对操作系统日志记录进行备份保存；

    3、建议延长日志记录的保存时间，至少保证日志记录留存时间大于6个月'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 高
- seq: 11
  standard_code: L2-CES1-11
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: a）应遵循最小安装的原则，仅安装需要的组件和应用程序：
  issue_summary: 1、操作系统中安装了与多余的组件XXX/应用软件XXX；
  issue_detail: 经核查：1）操作系统中部署了非必要的组件和应用程序XX；2）存在部分组件/应用程序XX未遵循最小化安装原则。
  hazard: '1、多余组件或应用程序可能存在安全漏洞，或影响操作系统性能，造成业务中断；

    2、多余组件或应用程序可能存在安全漏洞，或影响操作系统性能，造成业务中断。'
  remediation: '1、建议删除操作系统中安装的多余组件XXX/应用软件XXX；

    2、建议删除部分组件XXX/应用程序XXX中非必要的连带组件，确保最小化安装。'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 12
  standard_code: L2-CES1-12
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: b）应关闭不需要的系统服务、默认共享和高危端口：
  issue_summary: 1、操作系统中未关闭不必要的系统服务XXX；
  issue_detail: 经核查：1）操作系统未关闭不必要的XXX系统服务；2）操作系统未关闭默认共享功能；3）操作系统未关闭不必要的端口。
  hazard: '1、存在不必要的系统服务遭受利用的可能，造成信息泄露或网络攻击等；

    2、操作系统默认共享功能可能会被遭到利用，造成系统数据泄漏或病毒入侵、网络攻击等；

    3、不必要的端口可能会被恶意利用，导致系统遭到病毒入侵和网络攻击。'
  remediation: '1、建议关闭操作系统中不必要的系统服务XXX；

    2、建议关闭操作系统的默认共享功能；

    3、建议关闭操作系统中不必要的端口'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 13
  standard_code: L2-CES1-13
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制：
  issue_summary: 1、未对操作系统的接入方式/网络地址范围进行限制；
  issue_detail: 经核查：1）通过XX的方式访问操作系统，未对接入方式/网络地址范围进行限制；2）接入方式/网络地址范围限制不合理，通过XX方式仍可登录。
  hazard: '1、恶意用户可使用任意终端对操作系统进行访问或暴力破解，导致系统遭到入侵；

    2、恶意用户可使用任意终端对操作系统进行访问或暴力破解，导致系统遭到入侵。'
  remediation: '1、建议对操作系统接入方式/网络地址范围进行限制（例如必须通过VPN、堡垒机等进行登录访问，限制仅特定IP地址段能够访问等）；

    2、建议合理设置操作系统的接入方式/网络地址范围（例如必须通过VPN、堡垒机等进行登录访问，限制仅特定IP地址段能够访问等）'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 低
- seq: 14
  standard_code: L2-CES1-14
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求：
  issue_summary: /
  issue_detail: —
  hazard: /
  remediation: /
  threat: —
  inherent_risk: 中
- seq: 15
  standard_code: L2-CES1-15
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞。
  issue_summary: 1、未定期对操作系统进行漏洞扫描；
  issue_detail: 经核查：1）未定期对操作系统进行漏洞扫描，若未定期进行漏扫，则2-3无需记录；2）不具备漏洞扫描报告；3）未及时对发现的系统漏洞进行测试和修复。
  hazard: '1、可能存在无法及时发现漏洞而增大系统遭受网络攻击行为的概率，导致重要数据泄露，影响系统正常运行；

    2、无法有效收集掌握系统漏洞情况；

    3、可能存在已知漏洞被入侵者利用，遭受到网络攻击，造成系统信息泄露，影响正常使用。'
  remediation: '1、建议定期1-3个月对操作系统进行一次漏洞扫描；

    2、建议每次漏洞扫描后将扫描报告保存留档；

    3、建议对扫描发现的操作系统漏洞进行测试评估并修复，保留相应的修复记录。'
  threat: 漏洞利用、恶意代码植入、非授权外联
