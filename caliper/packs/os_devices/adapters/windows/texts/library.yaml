  issue_summary: 1、操作系统未安装具有防恶意代码功能的软件；
  issue_detail: 经核查：1）未安装具有防恶意代码功能的软件；2）未定期对防恶意代码软件及其病毒库进行更新；3）未采用具备主动免疫的可信验证技术识别入侵和病毒行为；4）不具备杀毒记录，无法确保软件防护功能是否正常运行。
  hazard: '1、缺乏病毒监控机制将不利于管理员掌握系统内各主机操作系统的病毒防护现状；

    2、病毒库更新不及时，无法在病毒暴发时采取及时的应对措施；

    3、可能无法主动识别和免疫入侵行为和病毒行为；

    4、当恶意代码在内部网络中传播时可能无法及时发现并发出告警。'
  remediation: '1、建议为操作系统部署具有防恶意代码功能的软件；

    2、建议定期对防恶意代码软件及其病毒库进行更新；

    3、建议采用具备主动免疫的可信验证技术来识别入侵和病毒行为；

    4、建议对防病毒软件进行功能进行配置，确保其杀毒和拦截功能运行正常，并保留相应的阻断记录及杀毒记录。'
