rules:
- item: 1
  point: 1
  block: Password hash algorithm
  expect:
    contains: pam_unix.so
  pass_reason: 登录采用 PAM 身份鉴别
  fail_reason: 未发现 PAM 身份鉴别配置
- item: 1
  point: 2
  block: Duplicate UID / UID=0 accounts
  expect:
    contains: fact:duplicate_uid.none=true
  pass_reason: 未发现重复 UID，身份标识唯一
  fail_reason: 存在重复 UID，身份标识不唯一
- item: 1
  point: 3
  block: Empty / expired password
  expect:
    contains: fact:empty_password.none=true
  pass_reason: 未发现空口令账户
  fail_reason: 存在空口令账户
- item: 1
  point: 4
  block: Password complexity
  expect:
    contains: fact:pam.password_complexity.enabled=true
  pass_reason: 已配置口令复杂度策略
  fail_reason: 未配置口令复杂度策略
- item: 1
  point: 4
  block: Password policy (login.defs)
  expect:
    lt:
      prefix: PASS_MAX_DAYS
      value: 91
  pass_reason: 口令最大有效期不超过 90 天
  fail_reason: 口令最大有效期超过 90 天或未限制
- item: 2
  point: 1
  block: Login failure lockout (faillock)
  expect:
    contains: fact:faillock.module=true
  pass_reason: 已启用登录失败处理模块
  fail_reason: 未启用登录失败处理模块
- item: 2
  point: 2
  block: Login failure lockout (faillock)
  expect:
    contains: fact:faillock.policy=true
  pass_reason: 已配置非法登录次数限制与锁定时间
  fail_reason: 未配置非法登录次数限制或锁定时间
- item: 2
  point: 3
  block: Session timeout TMOUT
  expect:
    contains: fact:session.tmout.valid=true
  pass_reason: 已配置登录连接超时自动退出
  fail_reason: 未配置登录连接超时自动退出
- item: 3
  point: 1
  block: SSH host key algorithm
  expect:
    contains: 'SHA256:'
  pass_reason: 远程管理使用 SSH 加密通道
  fail_reason: 未发现 SSH 主机密钥，远程管理加密情况无法确认
- item: 4
  point: 1
  block: Privileged groups
  expect:
    contains: 'sudo:x:'
  pass_reason: 已为用户分配账户并划分管理权限
  fail_reason: 未发现管理权限分配，账户权限情况无法确认
- item: 4
  point: 2
  block: Accounts and last password change
  expect:
    all:
    - not_contains: ftp
    - not_contains: guest
  pass_reason: 未发现匿名或默认来宾账户
  fail_reason: 存在匿名或默认来宾账户
- item: 7
  point: 1
  block: Separation of duty (three roles)
  expect:
    contains: sudo user
  pass_reason: 已按角色划分管理用户
  fail_reason: 未发现角色划分
- item: 7
  point: 2
  block: Separation of duty (three roles)
  expect:
    all:
    - contains: sudo user
    - contains: audit reader
  pass_reason: 管理权限与审计权限已分离
  fail_reason: 未实现管理用户权限分离
- item: 7
  point: 3
  block: sudo authorization / NOPASSWD
  expect:
    not_contains: 'NOPASSWD:'
  pass_reason: 未发现免密提权，符合最小权限
  fail_reason: 存在免密提权配置，权限未最小化
- item: 8
  point: 1
  block: Log service
  expect:
    contains: fact:log_service.active=true
  pass_reason: 已启用系统日志服务
  fail_reason: 未启用系统日志服务
- item: 8
  point: 2
  block: auditd status and rules
  expect:
    all:
    - contains: fact:auditd.active=true
    - contains: fact:auditd.rules_loaded=true
  pass_reason: 审计服务已启用且审计规则覆盖系统用户
  fail_reason: 审计服务未启用或审计规则未覆盖系统用户
- item: 8
  point: 3
  block: auditd status and rules
  expect:
    all:
    - contains: fact:auditd.active=true
    - contains: fact:auditd.rules_loaded=true
  pass_reason: 已对重要用户行为和重要安全事件配置审计规则
  fail_reason: 未对重要用户行为或重要安全事件配置审计规则
- item: 9
  point: 1
  block: auditd status and rules
  expect:
    all:
    - contains: fact:auditd.active=true
    - contains: fact:auditd.rules_loaded=true
  pass_reason: 审计服务已启用并加载审计规则
  fail_reason: 审计未启用或未加载规则，审计记录字段无法核查
- item: 9
  point: 1
  block: Recent login records
  expect:
    contains: wtmp begins
  pass_reason: 登录审计记录包含时间与用户信息
  fail_reason: 未读取到登录审计记录
- item: 10
  point: 1
  block: Log dir permissions
  expect:
    contains: /var/log
  pass_reason: 日志目录已设置访问权限
  fail_reason: 日志目录权限无法核查
- item: 10
  point: 2
  block: Log retention
  expect:
    contains: fact:log.retention.six_months=true
  pass_reason: 日志留存周期满足六个月要求
  fail_reason: 日志留存周期不足六个月
- item: 10
  point: 2
  block: Log archives on disk
  expect:
    contains: fact:log.archives.present=true
  pass_reason: 历史日志已归档备份
  fail_reason: 历史日志未归档备份
- item: 11
  point: 1
  block: Running services
  expect:
    all:
    - not_contains: telnet
    - not_contains: rsh
  pass_reason: 未运行常见冗余网络服务，符合最小安装
  fail_reason: 存在冗余网络服务，未遵循最小安装
- item: 11
  point: 2
  block: Running services
  expect:
    all:
    - not_contains: xinetd
    - not_contains: inetd
  pass_reason: 未发现非必要组件服务
  fail_reason: 存在非必要组件服务
- item: 12
  point: 1
  block: Running services
  expect:
    all:
    - not_contains: telnet
    - not_contains: rsh
  pass_reason: 未运行非必要系统服务
  fail_reason: 存在非必要系统服务
- item: 12
  point: 2
  block: Listening ports / processes
  expect:
    all:
    - not_contains: ':21 '
    - not_contains: ':23 '
    - not_contains: :3389
    - not_contains: ':445 '
  pass_reason: 未监听常见高危端口
  fail_reason: 存在高危端口监听
- item: 13
  point: 1
  block: Remote login source restriction
  expect:
    any:
    - contains: AllowUsers
    - contains: AllowGroups
    - contains: hosts.deny
  pass_reason: 已限制远程管理终端接入范围
  fail_reason: 未限制远程管理终端接入范围
- item: 15
  point: 1
  block: Patches / reboot
  expect:
    contains: security 0
  pass_reason: 无待安装安全补丁
  fail_reason: 存在待安装安全补丁
- item: 15
  point: 2
  block: Patches / reboot
  expect:
    not_contains: reboot required
  pass_reason: 已安装补丁并完成重启生效
  fail_reason: 补丁安装后未重启，漏洞可能仍未修复
- item: 16
  point: 1
  block: Security agent (EDR / AV / IDS)
  expect:
    contains: fact:security_agent.process.present=true
  pass_reason: 已部署防恶意代码软件
  fail_reason: 未部署防恶意代码软件
- item: 16
  point: 2
  block: Security agent (EDR / AV / IDS)
  expect:
    contains: fact:security_agent.package.present=true
  pass_reason: 已安装防恶意代码组件，可定期更新病毒库
  fail_reason: 未安装防恶意代码组件，病毒库无法更新
