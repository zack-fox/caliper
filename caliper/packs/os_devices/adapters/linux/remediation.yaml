    item_seqs:
    - 3
  priority: 高
  problem: '1、远程登录服务器时采用Telnet/FTP明文传输协议进行连接；

    2、服务器未关闭Telnet/FTP明文传输方式'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议在远程管理时采用SSH加密协议进行连接；

    2、建议关闭服务器Telnet/FTP明文传输管理方式'
  clause: GB/T 22239-2019 4级 L4-CES1-03 身份鉴别
- id: REM-LINUX-4-04
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 4
  priority: 高
  problem: '服务器未采用双因子鉴别技术对登录用户进行身份验证

    或

    服务器所使用的X身份验证方式非密码技术技术'
  cause: 身份冒用、口令猜测与暴力破解
  action: '建议登录服务器时采用双因子鉴别技术对用户进行身份鉴别，例如用户名口令+USB-key/数字证书/令牌等；

    或

    建议将第二种身份鉴别方式改为密码技术'
  clause: GB/T 22239-2019 4级 L4-CES1-04 身份鉴别
