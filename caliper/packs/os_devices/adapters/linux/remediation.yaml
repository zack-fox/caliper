  action: 建议将服务器日志记录内容进行完善，至少包含：事件的日期和时间、用户、事件类型、主体标识、客体标识和结果等信息
  clause: GB/T 22239-2019 4级 L4-CES1-13 安全审计
- id: REM-LINUX-4-14
  title: 安全审计要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 14
  priority: 高
  problem: '1、服务器中非授权用户可以对审计记录进行修改/删除；

    2、未定期对服务器日志记录进行备份；

    3、服务器日志记录保存时间小于6个月'
  cause: 审计记录被篡改或删除、行为无法追溯
  action: '1、建议将var/audit/audit.log文件权限设置为644范围以内，避免非授权用户对其中的日志记录进行删除、修改；

    2、建议定期对服务器日志记录进行备份保存；

    3、建议加长日志记录的保存时间，至少保存6个月'
  clause: GB/T 22239-2019 4级 L4-CES1-14 安全审计
