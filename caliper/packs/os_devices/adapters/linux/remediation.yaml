  cause: 越权访问、权限滥用
  action: 分设系统管理员、审计管理员、安全管理员，按最小权限授权。
  clause: GB/T 22239-2019 3级 L3-CES1-08 访问控制
- id: REM-LINUX-3-09
  title: 访问控制要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 9
  priority: 高
  problem: e）应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则；
  cause: 越权访问、权限滥用
  action: 按最小权限设置关键文件权限与属主，收紧 umask。
  clause: GB/T 22239-2019 3级 L3-CES1-09 访问控制
- id: REM-LINUX-3-10
  title: 访问控制要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 10
  priority: 高
  problem: f）访问控制的粒度应达到主体为用户级或进程级，客体为文件、数据库表级；
  cause: 越权访问、权限滥用
  action: 细化文件权限，启用 ACL，回收过宽权限。
  clause: GB/T 22239-2019 3级 L3-CES1-10 访问控制
- id: REM-LINUX-3-11
  title: 访问控制要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 11
  priority: 高
  problem: 按机构口径固定不符合；未启用的直接填本句。
  cause: 越权访问、权限滥用
  action: 有条件的启用 SELinux 等强制访问控制并设置安全标记。
  clause: GB/T 22239-2019 3级 L3-CES1-11 访问控制
