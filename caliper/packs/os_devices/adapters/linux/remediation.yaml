- id: REM-LINUX-3-04
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 3
    family:
    - server
    item_seqs:
    - 4
  priority: 高
  problem: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  cause: 身份冒用、口令猜测与暴力破解
  action: 采用双因素鉴别，第二因子使用数字证书、USB Key、令牌等密码技术。
  clause: GB/T 22239-2019 3级 L3-CES1-04 身份鉴别
- id: REM-LINUX-3-05
