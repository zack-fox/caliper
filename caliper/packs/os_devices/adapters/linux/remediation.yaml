version: 0.1.0
status: active
rules:
- id: REM-LINUX-2-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 1
  priority: 中
  problem: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  cause: 身份冒用、口令猜测与暴力破解
  action: 配置口令复杂度与有效期策略，禁用空口令，按 90 天周期改密。
  clause: GB/T 22239-2019 2级 L2-CES1-01 身份鉴别
- id: REM-LINUX-2-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 2
  priority: 中
  problem: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  cause: 身份冒用、口令猜测与暴力破解
  action: 配置登录失败锁定与 TMOUT 超时退出。
  clause: GB/T 22239-2019 2级 L2-CES1-02 身份鉴别
- id: REM-LINUX-2-03
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 3
  priority: 中
  problem: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  cause: 身份冒用、口令猜测与暴力破解
  action: 采用 SSH 加密管理，关闭 telnet/ftp。
  clause: GB/T 22239-2019 2级 L2-CES1-03 身份鉴别
- id: REM-LINUX-2-04
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 4
  priority: 中
  problem: a）应对登录的用户分配账户和权限；
  cause: 越权访问、权限滥用
  action: 按人员单独开户授权，禁用匿名账户，限制默认账户权限。
  clause: GB/T 22239-2019 2级 L2-CES1-04 访问控制
- id: REM-LINUX-2-05
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 5
  priority: 中
  problem: b）应重命名或删除默认账户，修改默认账户的默认口令；
  cause: 越权访问、权限滥用
  action: 重命名或禁用默认账户，修改默认口令为强口令。
  clause: GB/T 22239-2019 2级 L2-CES1-05 访问控制
- id: REM-LINUX-2-06
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 6
  priority: 高
  problem: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  cause: 越权访问、权限滥用
  action: 删除多余与过期账户，按人开户，禁止共享。
  clause: GB/T 22239-2019 2级 L2-CES1-06 访问控制
- id: REM-LINUX-2-07
  title: 访问控制要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 7
  priority: 中
  problem: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  cause: 越权访问、权限滥用
  action: 分设系统管理员、审计管理员、安全管理员，按最小权限授权。
  clause: GB/T 22239-2019 2级 L2-CES1-07 访问控制
- id: REM-LINUX-2-08
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 8
  priority: 中
  problem: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 启用 auditd 与 rsyslog，补全审计规则与关键事件。
  clause: GB/T 22239-2019 2级 L2-CES1-08 安全审计
- id: REM-LINUX-2-09
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 9
  priority: 中
  problem: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息；
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 完善审计记录字段，至少包含时间、用户、类型、结果。
  clause: GB/T 22239-2019 2级 L2-CES1-09 安全审计
- id: REM-LINUX-2-10
  title: 安全审计要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 10
  priority: 高
  problem: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等；
  cause: 审计记录被篡改或删除、行为无法追溯
  action: 收紧日志权限，定期备份，留存不少于 6 个月。
  clause: GB/T 22239-2019 2级 L2-CES1-10 安全审计
- id: REM-LINUX-2-11
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 11
  priority: 中
  problem: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: 按最小安装原则卸载非必要组件。
  clause: GB/T 22239-2019 2级 L2-CES1-11 入侵防范
- id: REM-LINUX-2-12
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 12
  priority: 高
  problem: b）应关闭不需要的系统服务、默认共享和高危端口；
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: 关闭非必要服务、默认共享与高危端口。
  clause: GB/T 22239-2019 2级 L2-CES1-12 入侵防范
- id: REM-LINUX-2-13
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 13
  priority: 中
  problem: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: 通过堡垒机/VPN 接入，限制源地址范围。
  clause: GB/T 22239-2019 2级 L2-CES1-13 入侵防范
- id: REM-LINUX-2-14
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 14
  priority: 中
  problem: 按机构口径固定不适用，不再填符合/不符合。
  cause: —
  action: 无。
  clause: GB/T 22239-2019 2级 L2-CES1-14 入侵防范
- id: REM-LINUX-2-15
  title: 入侵防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 15
  priority: 中
  problem: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞；
  cause: 漏洞利用、恶意代码植入、非授权外联
  action: 定期漏扫，高风险漏洞评估后及时修复并复测。
  clause: GB/T 22239-2019 2级 L2-CES1-15 入侵防范
- id: REM-LINUX-2-16
  title: 恶意代码防范要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 16
  priority: 高
  problem: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  cause: 病毒木马感染、勒索软件
  action: 部署防恶意代码软件，定期更新病毒库并留存查杀记录。
  clause: GB/T 22239-2019 2级 L2-CES1-16 恶意代码防范
- id: REM-LINUX-2-17
  title: 可信验证要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 17
  priority: 低
  problem: 按机构口径固定不符合；应用系统、数据库、中间件等为不适用，后续单独改。
  cause: 系统被篡改无法发现、后门植入
  action: 有条件的可部署可信验证，作为增强措施。
  clause: GB/T 22239-2019 2级 L2-CES1-17 可信验证
- id: REM-LINUX-2-18
  title: 数据完整性要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 18
  priority: 中
  problem: a）应采用校验技术保证重要数据在传输过程中的完整性。
  cause: 传输或存储数据被篡改
  action: 采用 SSH 等加密通道，必要时增加完整性校验。
  clause: GB/T 22239-2019 2级 L2-CES1-18 数据完整性
- id: REM-LINUX-2-19
  title: 数据备份恢复要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 19
  priority: 高
  problem: a）应提供重要数据的本地数据备份与恢复功能；
  cause: 数据丢失、业务中断
  action: 建立本地备份策略，定期恢复测试并留存记录。
  clause: GB/T 22239-2019 2级 L2-CES1-19 数据备份恢复
- id: REM-LINUX-2-20
  title: 数据备份恢复要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 20
  priority: 高
  problem: b）应提供异地备份功能，利用通信网络将重要数据定时批量传输至备份场地；
  cause: 数据丢失、业务中断
  action: 建立异地备份并定期验证恢复。
  clause: GB/T 22239-2019 2级 L2-CES1-20 数据备份恢复
- id: REM-LINUX-2-21
  title: 剩余信息保护要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 21
  priority: 中
  problem: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除；
  cause: 残留信息泄露
  action: 关闭可还原加密，确保注销清空会话与缓存。
  clause: GB/T 22239-2019 2级 L2-CES1-21 剩余信息保护
- id: REM-LINUX-2-22
  title: 个人信息保护要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 22
  priority: 中
  problem: 按机构口径固定不适用；新增单元，原表缺失。
  cause: —
  action: 无。
  clause: GB/T 22239-2019 2级 L2-CES1-22 个人信息保护
- id: REM-LINUX-2-23
  title: 个人信息保护要求未满足
  applies_to:
    level:
    - 2
    family:
    - server
    item_seqs:
    - 23
  priority: 中
  problem: 按机构口径固定不适用；新增单元，原表缺失。
  cause: —
  action: 无。
  clause: GB/T 22239-2019 2级 L2-CES1-23 个人信息保护
- id: REM-LINUX-3-01
  title: 身份鉴别要求未满足
