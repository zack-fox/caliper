    3、未采用主动免疫可信验证技术'
  cause: 病毒木马感染、勒索软件
  action: '1、建议为服务器部署主机防病毒软件；

    2、建议定期对防病毒软件病毒库进行更新；

    3、建议采用主动免疫可信验证技术'
  clause: GB/T 22239-2019 4级 L4-CES1-22 恶意代码防范
- id: REM-LINUX-4-23
  title: 可信验证要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 23
  priority: 低
  problem: '1、服务器未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、不能够在应用程序所有执行环节进行动态可信验证；

    3、验证可信性受到破坏后未进行告警；

    4、验证结果未形成审计记录送至安全管理中心

    5、未进行动态关联感知'
  cause: 系统被篡改无法发现、后门植入
  action: 建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的所有执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心，并进行动态关联感知
  clause: GB/T 22239-2019 4级 L4-CES1-23 可信验证
