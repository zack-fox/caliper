- id: REM-LINUX-4-01
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 1
  priority: 高
  problem: '1、登录服务器时未对用户进行身份鉴别；

    2、服务器中用户身份标识不唯一；

    3、服务器口令强度不够完善；

    4、服务器未设置口令更换策略；

    5、服务器未设置口令复杂度要求；

    6、服务器未定期进行口令更改'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议登录访问服务器时必须对用户进行身份鉴别，不允许用空口令登录；

    2、建议为不同用户设立不同的身份标识；

    3、建议增强服务器口令强度，长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合；

    4、建议在/etc/login.defs文件中完善服务器口令更换策略；

    5、建议在/etc/pam.d/system-auth文件中设置服务器口令复杂度策略，强制要求口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的任意三种组合

    6、建议定期在口令有效期内（至少90天内）进行口令更改'
  clause: GB/T 22239-2019 4级 L4-CES1-01 身份鉴别
- id: REM-LINUX-4-02
  title: 身份鉴别要求未满足
  applies_to:
    level:
    - 4
    family:
    - server
    item_seqs:
    - 2
  priority: 低
  problem: '1、服务器未设置登录失败处理功能；

    2、服务器未设置超时自动退出功能'
  cause: 身份冒用、口令猜测与暴力破解
  action: '1、建议在/etc/pam.d/system-auth 或 /etc/pam.d/sshd文件中为服务器设置登录失败处理功能，例如登录失败3次锁定30分钟；

    2、建议在/etc/profile文件中为服务器设置超时自动退出功能，例如600秒无操作自动退出'
  clause: GB/T 22239-2019 4级 L4-CES1-02 身份鉴别
- id: REM-LINUX-4-03
  title: 身份鉴别要求未满足
