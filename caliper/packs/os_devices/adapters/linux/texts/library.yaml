texts:
- seq: 1
  standard_code: L2-CES1-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_detail: 经核查：1）该设备存在空口令账户，未对登录用户进行身份鉴别；2）查看 /etc/passwd，存在 UID 相同的账户 X 和 Y，身份标识不具备唯一性；3）当前账户口令长度小于 8 位，仅由数字组成；4）系统中存在弱口令、通用口令账户；5）未在 /etc/pam.d/system-auth 中设置口令复杂度策略；6）/etc/login.defs 中未设置口令有效期，账户长期未更换口令。
  hazard: 口令易被猜测或暴力破解，导致合法身份被冒用。
  remediation: 配置口令复杂度与有效期策略，禁用空口令，按 90 天周期改密。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 中
- seq: 2
  standard_code: L2-CES1-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_detail: 经核查：1）未配置登录失败锁定策略，可无限次尝试口令；2）未配置登录连接超时退出，终端长时间无人值守仍保持会话。
  hazard: 口令可被暴力猜解，终端无人值守导致信息泄露。
  remediation: 配置登录失败锁定与 TMOUT 超时退出。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 中
- seq: 3
  standard_code: L2-CES1-03
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  issue_summary: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  issue_detail: 经核查：1）该设备通过 telnet/ftp 明文协议进行远程管理；2）系统中仍运行 telnet、ftp 服务进程，鉴别信息以明文传输，可被网络嗅探窃取。
  hazard: 鉴别信息可被嗅探，导致账号口令泄露。
  remediation: 采用 SSH 加密管理，关闭 telnet/ftp。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 中
- seq: 4
  standard_code: L2-CES1-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: a）应对登录的用户分配账户和权限；
  issue_summary: a）应对登录的用户分配账户和权限；
  issue_detail: 经核查：1）未为登录用户单独分配账户和权限；2）系统中存在匿名账户且未禁用，默认账户权限未限制。
  hazard: 多人共用账户，误操作无法追溯；匿名账户可非授权访问。
  remediation: 按人员单独开户授权，禁用匿名账户，限制默认账户权限。
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 5
  standard_code: L2-CES1-05
  layer: 安全计算环境
  control_point: 访问控制
  control_item: b）应重命名或删除默认账户，修改默认账户的默认口令；
  issue_summary: b）应重命名或删除默认账户，修改默认账户的默认口令；
  issue_detail: 经核查：1）默认管理账户 root 未重命名，默认账户 X 未禁用；2）默认账户口令未修改，仍为出厂默认口令。
  hazard: 默认账户与口令易被猜测，导致非授权访问。
  remediation: 重命名或禁用默认账户，修改默认口令为强口令。
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 6
  standard_code: L2-CES1-06
  layer: 安全计算环境
  control_point: 访问控制
  control_item: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  issue_summary: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  issue_detail: 经核查：1）存在多余账户 X；2）存在过期账户 X；3）存在多人共用 X 账户的情况。
  hazard: 过期账户可被利用，共享账户无法追溯自然人。
  remediation: 删除多余与过期账户，按人开户，禁止共享。
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 7
  standard_code: L2-CES1-07
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  issue_summary: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  issue_detail: 经核查：该设备未划分管理角色，全部运维使用 root 账户，未实现管理用户权限分离和最小权限。
  hazard: 管理员权限过大，行为无法被监督制约。
  remediation: 分设系统管理员、审计管理员、安全管理员，按最小权限授权。
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 8
  standard_code: L2-CES1-08
  layer: 安全计算环境
  control_point: 安全审计
  control_item: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  issue_summary: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  issue_detail: 经核查：该设备未启用 auditd、rsyslog，系统无审计记录，无法对用户行为和安全事件进行审计。
  hazard: 安全事件无法追溯，隐患无法及时发现。
  remediation: 启用 auditd 与 rsyslog，补全审计规则与关键事件。
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 中
- seq: 9
  standard_code: L2-CES1-09
  layer: 安全计算环境
  control_point: 安全审计
  control_item: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息；
  issue_summary: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息；
  issue_detail: 经核查：审计记录缺少用户、事件类型或事件成功标志，信息不完整，无法进行事件回溯。
  hazard: 审计信息不完整，事件无法有效追溯。
  remediation: 完善审计记录字段，至少包含时间、用户、类型、结果。
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 中
- seq: 10
  standard_code: L2-CES1-10
  layer: 安全计算环境
  control_point: 安全审计
  control_item: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等；
  issue_summary: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等；
  issue_detail: 经核查：1）普通账户可删除、修改审计日志；2）未定期备份；3）日志留存不足 6 个月。
  hazard: 审计记录被删改或覆盖，事件无法追溯。
  remediation: 收紧日志权限，定期备份，留存不少于 6 个月。
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 高
- seq: 11
  standard_code: L2-CES1-11
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  issue_summary: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  issue_detail: 经核查：该设备安装了大量与业务无关的组件和应用程序，未遵循最小安装原则。
  hazard: 多余组件存在漏洞，扩大攻击面。
  remediation: 按最小安装原则卸载非必要组件。
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 中
- seq: 12
  standard_code: L2-CES1-12
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: b）应关闭不需要的系统服务、默认共享和高危端口；
  issue_summary: b）应关闭不需要的系统服务、默认共享和高危端口；
  issue_detail: 经核查：1）系统中启用了与业务无关的服务 XX；2）未关闭默认共享；3）开放了高危端口 XX。
  hazard: 多余服务与端口可被利用入侵。
  remediation: 关闭非必要服务、默认共享与高危端口。
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 13
  standard_code: L2-CES1-13
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  issue_summary: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  issue_detail: 经核查：该设备未限制终端接入方式和网络地址范围，任意地址均可尝试远程管理。
  hazard: 任意终端可尝试管理，暴力破解风险上升。
  remediation: 通过堡垒机/VPN 接入，限制源地址范围。
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 中
- seq: 14
  standard_code: L2-CES1-14
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求；
  issue_summary: 按机构口径固定不适用，不再填符合/不符合。
  issue_detail: —
  hazard: 无（对象不适用）。
  remediation: 无。
  threat: —
  inherent_risk: 中
- seq: 15
  standard_code: L2-CES1-15
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞；
  issue_summary: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞；
  issue_detail: 经核查：1）未定期开展漏洞扫描；2）无法提供漏洞扫描报告；3）发现的高风险漏洞未及时修复。
  hazard: 已知漏洞可被利用，导致入侵或业务中断。
  remediation: 定期漏扫，高风险漏洞评估后及时修复并复测。
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 中
- seq: 16
  standard_code: L2-CES1-16
  layer: 安全计算环境
  control_point: 恶意代码防范
  control_item: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  issue_summary: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  issue_detail: 经核查：该设备未安装防恶意代码软件，无法识别和阻断恶意代码行为。
  hazard: 恶意代码在主机间传播，业务受损。
  remediation: 部署防恶意代码软件，定期更新病毒库并留存查杀记录。
  threat: 病毒木马感染、勒索软件
  inherent_risk: 高
- seq: 17
  standard_code: L2-CES1-17
  layer: 安全计算环境
  control_point: 可信验证
  control_item: a）可基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心。
  issue_summary: 按机构口径固定不符合；应用系统、数据库、中间件等为不适用，后续单独改。
  issue_detail: 经核查：未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和计算应用程序等进行可信验证。
  hazard: 无可信链，无法主动发现系统被篡改。
  remediation: 有条件的可部署可信验证，作为增强措施。
  threat: 系统被篡改无法发现、后门植入
  inherent_risk: 低
- seq: 18
  standard_code: L2-CES1-18
  layer: 安全计算环境
  control_point: 数据完整性
  control_item: a）应采用校验技术保证重要数据在传输过程中的完整性。
  issue_summary: a）应采用校验技术保证重要数据在传输过程中的完整性。
  issue_detail: 经核查：该设备采用 telnet/ftp 明文传输，未对鉴别数据、配置数据采取完整性保护措施。
  hazard: 传输数据可被篡改且无法检测。
  remediation: 采用 SSH 等加密通道，必要时增加完整性校验。
  threat: 传输或存储数据被篡改
  inherent_risk: 中
- seq: 19
  standard_code: L2-CES1-19
  layer: 安全计算环境
  control_point: 数据备份恢复
  control_item: a）应提供重要数据的本地数据备份与恢复功能；
  issue_summary: a）应提供重要数据的本地数据备份与恢复功能；
  issue_detail: 经核查：该设备未对重要配置数据进行本地备份，无可用恢复手段。
  hazard: 配置丢失或损坏后无法恢复。
  remediation: 建立本地备份策略，定期恢复测试并留存记录。
  threat: 数据丢失、业务中断
  inherent_risk: 高
- seq: 20
  standard_code: L2-CES1-20
  layer: 安全计算环境
  control_point: 数据备份恢复
  control_item: b）应提供异地备份功能，利用通信网络将重要数据定时批量传输至备份场地；
  issue_summary: b）应提供异地备份功能，利用通信网络将重要数据定时批量传输至备份场地；
  issue_detail: 经核查：未提供异地备份功能，重要数据仅在本地留存。
  hazard: 场地级灾难导致数据全损。
  remediation: 建立异地备份并定期验证恢复。
  threat: 数据丢失、业务中断
  inherent_risk: 高
- seq: 21
  standard_code: L2-CES1-21
  layer: 安全计算环境
  control_point: 剩余信息保护
  control_item: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除；
  issue_summary: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除；
  issue_detail: 经核查：1）注销后会话可直接恢复，无需重新鉴别；2）口令以可还原加密方式存储；3）鉴别信息在存储空间释放后仍可读取。
  hazard: 鉴别信息残留，可被提取复用。
  remediation: 关闭可还原加密，确保注销清空会话与缓存。
  threat: 残留信息泄露
  inherent_risk: 中
- seq: 22
  standard_code: L2-CES1-22
  layer: 安全计算环境
  control_point: 个人信息保护
  control_item: a）应仅采集和保存业务必需的用户个人信息；
  issue_summary: 按机构口径固定不适用；新增单元，原表缺失。
  issue_detail: —
  hazard: 无（对象不适用）。
  remediation: 无。
  threat: —
  inherent_risk: 中
- seq: 23
  standard_code: L2-CES1-23
  layer: 安全计算环境
  control_point: 个人信息保护
  control_item: b）应禁止未授权访问和非法使用用户个人信息。
  issue_summary: 按机构口径固定不适用；新增单元，原表缺失。
  issue_detail: —
  hazard: 无（对象不适用）。
  remediation: 无。
  threat: —
  inherent_risk: 中
- seq: 4
  standard_code: L3-CES1-04
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  issue_summary: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  issue_detail: 经核查：该设备仅采用用户名+口令一种鉴别方式，未采用两种或两种以上组合的鉴别技术。
  hazard: 单因子口令被破解后可直接登录。
  remediation: 采用双因素鉴别，第二因子使用数字证书、USB Key、令牌等密码技术。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 9
  standard_code: L3-CES1-09
  layer: 安全计算环境
  control_point: 访问控制
  control_item: e）应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则；
  issue_summary: e）应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则；
  issue_detail: 经核查：1）未指定授权主体配置访问控制策略；2）/etc/shadow 权限为 777 或属主非 root；3）普通账户可直接读取 /etc/shadow。
  hazard: 关键文件可被非授权读取或篡改。
  remediation: 按最小权限设置关键文件权限与属主，收紧 umask。
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 10
  standard_code: L3-CES1-10
  layer: 安全计算环境
  control_point: 访问控制
  control_item: f）访问控制的粒度应达到主体为用户级或进程级，客体为文件、数据库表级；
