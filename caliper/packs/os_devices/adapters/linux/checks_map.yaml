- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Empty / expired password
  block_index: 5
  kind: judge
  session:
  - kind: shell
    pattern: ^awk\s+-F:\s+.*\$2\s*==.*\/etc\/shadow\b
    empty: success
  - kind: shell
    pattern: ^(?:cat|more|less)\s+\/etc\/shadow\b
  normalize: empty_password
  binds:
  - item: 1
    points:
    - 3
  - level: 4
    item: 1
    points:
    - 3
  - level: 2
    item: 1
    points:
    - 3
- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Password hash algorithm
  block_index: 6
  kind: judge
  session:
  - kind: shell
    pattern: ^(?:grep\b.*\bpam_unix\b.*\/etc\/pam\.d\b|(?:cat|more|less)\s+\/etc\/pam\.d\/(?:system-auth|password-auth|common-auth|common-password)\b)
  binds:
  - level: 2
    item: 1
    points:
    - 1
- os_family:
