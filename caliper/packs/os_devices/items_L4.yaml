  控制项: b）应保证存有敏感数据的存储空间被释放或重新分配前得到完全清除。
  重要程度: 重要
  检查内容: 应核查相关配置信息或系统设计文档，敏感数据所在的存储空间被释放或重新分配给其他用户前是否得到完全清除。
  判断标准: '符合：敏感数据的存储空间被释放后重新分配前得到完全清除；

