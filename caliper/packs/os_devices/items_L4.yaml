- item_id: L4-CES1-01
  level: 4
  seq: 1
  unit_no: 1
  控制点: 身份鉴别
  控制项: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  重要程度: 重要
  检查内容: '1) 应核查用户在登录时是否采用了身份鉴别措施；

    2) 应核查用户列表确认用户身份标识是否具有唯 一性；

    3) 应核查用户配置信息或测试验证是否不存在空口令用户；

    4) 应核查用户鉴别信息是否具有复杂度要求并定期更换。'
  判断标准: 如果 1)~4) 均为肯定，则符合本测评单元指标要求，否则不符合或部分符合本测评单元指标要求。
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-02
  level: 4
  seq: 2
  unit_no: 2
  控制点: 身份鉴别
  控制项: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  重要程度: 重要
  检查内容: '1) 应核查是否配置并启用了登录失败处理功能；

    2) 应核查是否配置并启用了限制非法登录功能，非法登录达到一定次数后采取特定动作，如账户锁定等；

    3) 应核查是否配置并启用了登录连接超时及自动退出功能。'
  判断标准: "符合：1、2都符合时，结果为符合。        \n部分符合：1或2不符合时，结果为部分符合。\n不符合：1、2不符合，结果判定为不符合。"
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-03
  level: 4
  seq: 3
  unit_no: 3
  控制点: 身份鉴别
  控制项: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  重要程度: 关键
  检查内容: 应核查是否采用加密等安全方式对系统进行远程管理，防止鉴别信息在网络传输过程中被窃听。
  判断标准: '符合：鉴别信息加密传输，结果判定为符合；

    部分符合：无；

    不符合：鉴别信息不加密传输。

    '
  policy: binary
  mode: auto
  binary: true
  optional_clause: false
- item_id: L4-CES1-04
  level: 4
  seq: 4
  unit_no: 4
  控制点: 身份鉴别
  控制项: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  重要程度: 关键
  检查内容: '1) 应核查是否采用动态口令、数字证书、生物技术和设备指纹等两种或两种以上组合的鉴别技术对用户身份进行鉴别；

    2) 应核查其中一种鉴别技术是否使用密码技术来实现。'
  判断标准: "符合：采用usb棒、动态口令、数字证书、生物技术、设备指纹等身份认证技术手段对用户进行身份鉴别结果判定为符合；                       \n部分符合：无部分符合的情况；    \n不符合：仅采用用户名+口令的鉴别方式结果判定为不符合。"
  policy: manual
  mode: manual
  binary: false
  optional_clause: false
- item_id: L4-CES1-05
  level: 4
  seq: 5
  unit_no: 5
  控制点: 访问控制
  控制项: a）应对登录的用户分配账户和权限；
  重要程度: 重要
  检查内容: '1) 应核查是否为用户分配了账户和权限及相关设置情况；

    2) 应核查是否已禁用或限制匿名、默认账户的访问权限。'
  判断标准: '符合：1、2都符合时，结果判定为符合；

    部分符合：1、2其中有一项未达到判定为部分符合；

    不符合：均未达到为不符合。'
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-06
  level: 4
  seq: 6
  unit_no: 6
  控制点: 访问控制
  控制项: b）应重命名或删除默认账户，修改默认账户的默认口令；
  重要程度: 重要
  检查内容: '1) 应核查是否已经重命名默认账户或默认账户已被删除；

    2) 应核查是否已修改默认账户的默认口令。'
  判断标准: '符合：已重名系统默认账户或修改了默认账户口令；

    部分符合：无

    不符合：其他均为不符合。'
  policy: binary
  mode: auto
  binary: true
  optional_clause: false
- item_id: L4-CES1-07
  level: 4
  seq: 7
  unit_no: 7
  控制点: 访问控制
  控制项: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在；
  重要程度: 重要
  检查内容: '1) 应核查是否不存在多余或过期账户，管理员用户与账户之间是否一一对应；

    2) 应测试验证多余的、过期的账户是否被删除或停用。'
  判断标准: 如果 1) 和 2) 均为肯定，则符合本测评单元指标要求，否则不符合或部分符合本测评单元指标要求。
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
  manual_points:
  - point: 2
    reason: 人工核查账户归属、共享关系，并测试多余/过期账户是否已删除或停用
- item_id: L4-CES1-08
  level: 4
  seq: 8
  unit_no: 8
  控制点: 访问控制
  控制项: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  重要程度: 一般
  检查内容: '1)应核查是否进行角色划分；

    2)应核查管理用户的权限是否已进行分离；

    3)应核查管理用户权限是否为其工作任务所需的最小权限。'
  判断标准: '符合：1、2都符合时，结果判定为符合；

    部分符合：如果分类建立了权限分离的用户（管理员、审计员、操作员、应用账户等），但无账户权限表，结果判定为部分符合；

    不符合：其他均为不符合。'
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-09
  level: 4
  seq: 9
  unit_no: 9
  控制点: 访问控制
  控制项: e）应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则；
  重要程度: 一般
  检查内容: '1）应核查是否由授权主体（如管理用户）负责配置访问控制策略；

    2）应核查授权主体是否依据安全策略配置了主体对客体的访问规则；

    3）应测试验证用户是否有可越权访问情形。'
  判断标准: '符合：1、2都符合时，结果判定为符合；

    部分符合：1、2其中有一项未达到，判定为部分符合；

    不符合：均未达到为不符合。'
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-10
  level: 4
  seq: 10
  unit_no: 10
  控制点: 访问控制
  控制项: f）访问控制的粒度应达到主体为用户级或进程级，客体为文件、数据库表级；
  重要程度: 一般
  检查内容: 应核查访问控制策略的控制粒度是否达到主体为用户级或进程级，客体为文件、数据库表、记录或字段级。
  判断标准: '符合：操作系统提供访问控制功能，通过基于角色、自主访问或强制访问控制策略，达到主体为用户级或进程级，客体为文件、数据库表、记录或字段级；

    不符合：其他均为不符合。'
  policy: binary
  mode: auto
  binary: true
  optional_clause: false
- item_id: L4-CES1-11
  level: 4
  seq: 11
  unit_no: 11
  控制点: 访问控制
  控制项: g）应对重要主体、客体设置安全标记，并依据安全标记和强制访问控制规则确定主体对客体的访问。
  重要程度: 一般
  检查内容: '1) 应核查是否对主体、客体设置了安全标记；

    2) 应测试验证是否依据主体、客体安全标记控制主体对客体访问的强制访问控制策略。'
  判断标准: "符合：1、2都符合，结果判定为符合；                            \n部分符合：1、2其中有一项未达到，判定为部分符合；\n不符合：1和2都不符合，结果判定为不符合。   "
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
  manual_points:
  - point: 2
    reason: 强制访问控制测试需人工核查
- item_id: L4-CES1-12
  level: 4
  seq: 12
  unit_no: 12
  控制点: 安全审计
  控制项: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计；
  重要程度: 重要
  检查内容: '1) 应核查是否开启了安全审计功能；

    2) 应核查安全审计范围是否覆盖到每个用户；

    3) 应核查是否对重要的用户行为和重要安全事件进行审计。'
  判断标准: "符合：开启安全审计功能，审计覆盖到每个系统用户，对重要用户行为和事件进行审计；\n部分符合：开启安全审计功能，审计覆盖到每个系统用户，但审计事件无法覆盖重要的用户行为和重要安全事件；       \n不符合：未开启安全审计功能或安全审计功能无法覆盖到系统所有用户。"
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-13
  level: 4
  seq: 13
  unit_no: 13
  控制点: 安全审计
  控制项: b）审计记录应包括事件的日期和时间、用户、事件类型、主体标识、客体标识和结果等；
  重要程度: 一般
  检查内容: 应核查审计记录信息是否包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息。
  判断标准: "符合：开启安全审计功能，且审计记录包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息； \n不符合：未开启安全审计功能，或审计记录不全，无法进行事件回溯。"
  policy: binary
  mode: auto
  binary: true
  optional_clause: false
- item_id: L4-CES1-14
  level: 4
  seq: 14
  unit_no: 14
  控制点: 安全审计
  控制项: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等；
  重要程度: 一般
  检查内容: '1) 应核查是否采取了保护措施对审计记录进行保护；

    2) 应核查是否采取技术措施对审计记录进行定期 备 份，并核查其备份策略。'
  判断标准: "符合：通过日志覆盖周期、存储方式、日志文件/空间大小、日志文件操作权限等设置，定期对系统日志文件进行备份，备份文件留存不少于六个月，实现对审计记录保护；   \n不符合：对审计记录无任何保护措施，且未定期备份。"
  policy: all_positive
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-15
  level: 4
  seq: 15
  unit_no: 15
  控制点: 安全审计
  控制项: d）应对审计进程进行保护，防止未经授权的中断。
  重要程度: 一般
  检查内容: 应测试验证通过非审计管理员的其他账户来中断审计进程，验证审计进程是否受到保护。
  判断标准: '符合：对审计进程进行保护，无法单独中断；

    不符合：审计进程可被非授权中断。'
  policy: binary
  mode: manual
  binary: true
  optional_clause: false
- item_id: L4-CES1-16
  level: 4
  seq: 16
  unit_no: 16
  控制点: 入侵防范
  控制项: a）应遵循最小安装的原则，仅安装需要的组件和应用程序；
  重要程度: 重要
  检查内容: '1）应核查是否遵循最小安装原则；

    2）应核查是否未安装非必要的组件和应用程序。'
  判断标准: '符合：服务器操作系统遵循最小安装的原则，仅安装需要的组件和应用程序

    不符合：服务器存在多余的组件和应用系统，开放了多余的服务端口'
  policy: all_positive
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-17
  level: 4
  seq: 17
  unit_no: 17
  控制点: 入侵防范
  控制项: b）应关闭不需要的系统服务、默认共享和高危端口；
  重要程度: 关键
  检查内容: '1) 应核查是否关闭了非必要的系统服务和默认共享；

    2) 应核查是否不存在非必要的高危端口。'
  判断标准: "符合：1、2均符合时，结果为符合；              \n部分符合：1、2其中有一项未达到判定为部分符合；         \n不符合：其他为不符合。"
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-18
  level: 4
  seq: 18
  unit_no: 18
  控制点: 入侵防范
  控制项: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制；
  重要程度: 重要
  检查内容: 应核查配置文件或参数等是否对终端接入范围进行限制。
  判断标准: '符合：限制终端登录地址；

    不符合：未限制终端登录地址。'
  policy: binary
  mode: auto
  binary: true
  optional_clause: false
- item_id: L4-CES1-19
  level: 4
  seq: 19
  unit_no: 19
  控制点: 入侵防范
  控制项: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求；
  重要程度: 关键
  检查内容: '1) 应核查系统设计文档的内容是否包括数据有效性检验功能的内容或模块；

    2) 应测试验证是否对人机接口或通信接口输入的内容进行有效性检验。'
  判断标准: 默认不适用。
  policy: na
  mode: na
  binary: false
  optional_clause: false
- item_id: L4-CES1-20
  level: 4
  seq: 20
  unit_no: 20
  控制点: 入侵防范
  控制项: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞；
  重要程度: 重要
  检查内容: '1) 应通过漏洞扫描、渗透测试等方式核查是否不存在高风险漏洞；

    2) 应核查是否在经过充分测试评估后及时修补漏洞。'
  判断标准: "符合：定期操作系统漏洞扫描，并有扫描报告和整改结果，且安装重要安全补丁。     \n部分符合：其余，结果为部分符合；\n不符合：未做操作系统漏洞扫描，且未安装重要安全补丁。"
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-21
  level: 4
  seq: 21
  unit_no: 21
  控制点: 入侵防范
  控制项: f）应能够检测到对重要节点进行入侵的行为，并在发生严重入侵事件时提供报警。
  重要程度: 重要
  检查内容: '1) 应访谈并核查是否有入侵检测的措施；

    2) 应核查在发生严重入侵事件时是否提供报警。'
  判断标准: "符合：1、2、3均符合时，结果为符合；          \n部分符合：1符合时，2或者3为不符合时，结果为部分符合。\n不符合：1不符合，结果判定为不符合。"
  policy: mixed_partial
  mode: manual
  binary: false
  optional_clause: false
- item_id: L4-CES1-22
  level: 4
  seq: 22
  unit_no: 22
  控制点: 恶意代码防范
  控制项: a）应采主动免疫可信验证机制及时识别入侵和病毒行为，并将其有效阻断。
  重要程度: 重要
  检查内容: '1) 应核查是否安装了防恶意代码软件或相应功能的软件，定期进行升级和更新防恶意代码库；

    2) 应核查是否采用主动免疫可信验证技术及时识别入侵和病毒行为；

    3) 应核查当识别入侵和病毒行为时是否将其有效阻断。'
  判断标准: 如果1)和3)或2)和3)均为肯定，则符合本测评单元指标要求，否则不符合或部分符合本测评单元指标要求。
  policy: mixed_partial
  mode: auto
  binary: false
  optional_clause: false
- item_id: L4-CES1-23
  level: 4
  seq: 23
  unit_no: 23
  控制点: 可信验证
  控制项: a）可基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的所有执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心，并进行动态关联感知。
  重要程度: 一般
  检查内容: '1）应核查是否基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2）应检查是否在应用程序的所有执行环节进行动态可信验证；

    3）应测试验证当检测到计算设备的可信性受到破坏后是否进行报警；

    4）应测试验证结果是否以审计记录的形式送至安全管理中心；

    5）应核查是否能够进行动态关联感知。'
  判断标准: "符合：1、2、3均符合时，结果为符合；          \n部分符合：1符合时，2或者3为不符合时，结果为部分符合；\n不符合：1不符合，结果判定为不符合。"
  policy: all_positive
  mode: manual
  binary: false
  optional_clause: true
