  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 4
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议按岗位分配账户和最小权限，删除匿名或共享账户。
  clause: ACCOUNT_PERM
- id: REM-NET-L2-05
  title: DEFAULT 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 5
  priority: 中
  problem: 设备配置不符合指导书要求。
