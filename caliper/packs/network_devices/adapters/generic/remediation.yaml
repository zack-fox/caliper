rules:
- id: REM-NET-L2-01
  title: AUTH_ID 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 1
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议为每个管理账户设置唯一用户名和满足复杂度要求的口令，并启用口令有效期与登录失败处理策略。
  clause: AUTH_ID
- id: REM-NET-L2-02
  title: LOGIN_FAIL 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 2
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议启用登录失败锁定、登录超时自动退出等登录失败处理措施。
  clause: LOGIN_FAIL
- id: REM-NET-L2-03
  title: REMOTE 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 3
  priority: 高
  problem: 设备配置不符合指导书要求。
