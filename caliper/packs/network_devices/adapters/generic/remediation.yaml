  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 6
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议删除或禁用多余、过期账户，并定期核查账户清单。
