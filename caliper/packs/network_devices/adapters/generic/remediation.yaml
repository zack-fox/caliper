version: 0.1.0
status: active
rules:
- id: REM-NET-L2-01
  title: AUTH_ID 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 1
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议为每个管理账户设置唯一用户名和满足复杂度要求的口令，并启用口令有效期与登录失败处理策略。
  clause: AUTH_ID
- id: REM-NET-L2-02
  title: LOGIN_FAIL 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 2
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议启用登录失败锁定、登录超时自动退出等登录失败处理措施。
  clause: LOGIN_FAIL
- id: REM-NET-L2-03
  title: REMOTE 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 3
  priority: 高
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议仅启用 SSH/HTTPS 等加密远程管理方式，关闭 Telnet/HTTP 明文管理。
  clause: REMOTE
- id: REM-NET-L2-04
  title: ACCOUNT_PERM 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 4
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议按岗位分配账户和最小权限，删除匿名或共享账户。
  clause: ACCOUNT_PERM
- id: REM-NET-L2-05
  title: DEFAULT 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 5
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议重命名或删除默认账户，并修改默认口令。
  clause: DEFAULT
- id: REM-NET-L2-07
  title: PRIV_SEP 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 7
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议划分系统管理员、安全管理员和审计管理员等角色，实现权限分离。
  clause: PRIV_SEP
- id: REM-NET-L2-08
  title: AUDIT_ENABLE 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 8
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议启用安全审计功能，确保审计覆盖每个用户和重要安全事件。
  clause: AUDIT_ENABLE
- id: REM-NET-L2-10
  title: AUDIT_PROTECT 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 10
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议将审计记录备份至日志服务器，并限制审计记录访问。
  clause: AUDIT_PROTECT
- id: REM-NET-L2-13
  title: TERMINAL 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 13
  priority: 中
  problem: 设备配置不符合指导书要求。
  cause: 设备安全基线未配置或配置未落到该设备。
  action: 建议通过 ACL 或接入方式限制管理终端地址范围。
  clause: TERMINAL
- id: REM-NET-L2-17
  title: INTEGRITY_TRANSFER 整改
  applies_to:
    level:
    - 2
    family:
    - network
    item_seqs:
    - 17
  priority: 中
  problem: 设备配置不符合指导书要求。
