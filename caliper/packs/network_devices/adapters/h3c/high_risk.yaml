- hr_id: HR-15
  可降风险: false
  降风险前提: ''
  level_min: 2
  control_point: 个人信息保护
  问题简述: 违规采集和存储个人信息
  标准要求: 应仅采集和保存业务必需的用户个人信息。
  适用范围: 第二级及以上定级对象。
  问题描述: 系统在未授权情况下，违规采集、存储用户个人隐私信息，或法律法规、主管部门严令禁止采集、保存的个人信息。
  缓解措施: 无。
  风险评价: 上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。
  整改建议: 建议根据国家、行业主管部门以及标准的相关规定（如《信息安全技术 个人信息安全规范》），明确向用户表明采集信息的内容、用途以及相关的安全责任，并在用户同意、授权的情况下采集、保存业务必需的用户个人信息。
  binds_items:
  - 32
- hr_id: HR-16
  可降风险: false
  降风险前提: ''
  level_min: 2
  control_point: ''
  问题简述: 违规访问和使用个人信息
  标准要求: 应禁止未授权访问和非法使用用户个人信息。
  适用范围: 第二级及以上定级对象。
  问题描述: 未按国家相关法律法规、政策标准、以及行业主管部门要求等相关规定使用个人信息，包括但不限于在未授权情况下将用户信息提交给第三方处理、未脱敏的个人信息用于其他非核心业务系统或测试环境、非法交易、泄漏用户个人信息等、未严格控制个人信息查询及导出权限等。
  缓解措施: 无。
  风险评价: 上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。
  整改建议: 建议根据国家、行业主管部门以及标准的相关规定（如《信息安全技术 个人信息安全规范》），通过技术和管理手段，防止未授权访问和非法使用用户个人信息。
  binds_items:
  - 22
  - 33
