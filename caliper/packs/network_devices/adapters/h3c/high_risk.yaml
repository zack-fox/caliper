- hr_id: HR-01
  可降风险: true
  降风险前提: 仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施；或采用两种或两种以上身份鉴别措施。
  level_min: 2
  control_point: 身份鉴别
  问题简述: 存在空口令、弱口令、通用口令或无身份鉴别措施
  标准要求: 应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换。
  适用范围: 第二级及以上定级对象。
  问题描述: '1) 存在可登录的空口令账户、无身份鉴别措施或身份鉴别措施可被绕过等；

    2) 存在可登录的弱口令账户，如长度在6 位以下，或存在单个、相同、连续数字/字母/字符及常见字典等易猜测的口令；

    3) 多个不同被测对象的管理账户口令相同、或同一被测对象中多个不同管理账户口令相同。'
  缓解措施: '1) 具有仅限本地登录，或具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施；

    2) 采用不可绕过的两种或两种以上组合的身份鉴别措施。'
  风险评价: '1) 存在可登录的空口令账户、弱口令账户、通用口令、以及无身份鉴别措施或身份鉴别措施可被绕过等情况时，但被测对象仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施，可根据实际措施效果酌情降低风险等级；

    2) 存在可登录的空口令账户、弱口令账户、通用口令、以及无身份鉴别措施或身份鉴别措施可被绕过等情况时，但被测对象采用两种或两种以上身份鉴别措施，可根据实际措施效果酌情降低风险等级。'
  整改建议: 建议删除或修改账户通用口令，重命名默认账户，制定相关管理制度，规范口令的最小长度、复杂度与生命周期，并根据管理制度要求，合理配置账户口令复杂度和定期更换策略；此外，建议为不同设备配备不同的口令，避免一台设备口令被破解影响所有设备安全。
  binds_items:
  - 1
- hr_id: HR-02
  可降风险: true
  降风险前提: 采用不可绕过的两种或两种以上组合身份鉴别措施，仅获得口令无法成功登录。
  level_min: 2
  control_point: ''
  问题简述: 鉴别信息明文传输
  标准要求: 当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听。
  适用范围: 第二级及以上定级对象。
  问题描述: '1) 鉴别信息以明文方式在网络环境中传输；

    2) 鉴别信息使用编码、隐藏等形式进行传输，但仍可以被还原出明文。'
  缓解措施: 采用不可绕过的两种或两种以上组合的身份鉴别措施，仅获得口令无法成功登录。
  风险评价: 鉴别信息以明文方式传输，或鉴别信息使用编码、隐藏等形式进行传输，但仍可以被还原出明文的，但采用不可绕过的两种或两种以上组合的身份鉴别措施，仅获得口令无法成功登录，可根据实际措施效果酌情降低风险等级。
  整改建议: '建议尽可能避免通过网络环境对网络设备、安全设备、操作系统、数据库等进行远程管理。如确有需要，则建议采取措施或使用加密机制（如VPN加密通道、开启SSH、HTTPS协议等），防止鉴别

    信息在网络传输过程中被窃听。'
  binds_items:
  - 3
- hr_id: HR-03
  可降风险: true
  降风险前提: 登录和访问过程中多次鉴别且鉴别信息动态变化，或重要业务操作前不同阶段采用不同鉴别方式，或仅限本地登录、具有带外管理等措施。
  level_min: 3
  control_point: ''
  问题简述: 未采用两种或两种以上组合身份鉴别技术
  标准要求: 应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  适用范围: 第三级及以上定级对象。
  问题描述: 未采用两种或两种以上组合鉴别技术对用户进行身份鉴别。
  缓解措施: '1) 在登录和访问过程中，多次进行身份鉴别，且每次鉴别信息动态变化；

    2) 在完成重要业务操作前的不同阶段采用不同的鉴别方式进行身份鉴别；

    3) 仅限本地登录或具有带外管理等措施。'
  风险评价: '1) 未采用两种或两种以上组合鉴别技术对用户进行身份鉴别，但在登录和访问过程中，多次进行身份鉴别，且每次鉴别信息动态变化，可根据实际措施效果酌情降低风险等级；

    2) 未采用两种或两种以上组合鉴别技术对用户进行身份鉴别，但在完成重要业务操作前的不同阶段采用不同的鉴别方式进行身份鉴别，可根据实际措施效果酌情降低风险等级；

    3) 未采用两种或两种以上组合鉴别技术对用户进行身份鉴别，但仅限本地登录或具有带外管理等措施，可根据实际措施效果酌情降低风险等级。'
  整改建议: '建议核心设备、操作系统等增加除用户名/口令以外的身份鉴别技术，如基于密码技术的动态口令/令牌等鉴别方式，使用多种鉴别技术进行身份鉴别，增强身份鉴别的安全力度；对于使用堡垒机

    或统一身份认证机制实现多种身份鉴别的场景，建议通过地址绑定等技术措施，确保设备只能通过该机制进行身份认证，无旁路现象存在。'
  binds_items:
  - 4
- hr_id: HR-04
  可降风险: true
  降风险前提: 采用不可绕过的两种或两种以上组合身份鉴别措施，或具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施，使用默认口令无法成功登录。
  level_min: 2
  control_point: 访问控制
  问题简述: 未重命名默认账户名且未修改默认口令
  标准要求: 应重命名或删除默认账户，修改默认账户的默认口令。
  适用范围: 第二级及以上定级对象。
  问题描述: 存在公开的默认账户或默认口令，未重命名默认账户且未修改默认口令。
  缓解措施: '1) 采用不可绕过的两种或两种以上组合的身份鉴别措施，仅使用默认口令无法成功登录；

    2) 具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施，使用默认口令无法成功登录。'
  风险评价: '1) 存在公开的默认账户或默认口令，未重命名默认账户且未修改默认口令，但采用不可绕过的两种或两种以上组合的身份鉴别措施，仅使用默认口令无法成功登录，可根据实际措施效果酌情降低风险等级；

    2) 存在公开的默认账户和默认口令，未重命名默认账户且未修改默认口令，但具有登录地址限制、登录终端限制、物理位置限制等远程登录管控措施，仅使用默认口令无法成功登录，可根据实际措施效果酌情降低风险等级。'
  整改建议: 建议网络设备、安全设备、主机设备（包括操作系统、数据库等）等重命名或删除默认管理员账户，修改默认密码，使其具备一定的安全强度，增强账户安全性。
  binds_items:
  - 5
  - 6
- hr_id: HR-05
  可降风险: true
  降风险前提: 仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，以及操作行为审计等监控措施。
  level_min: 3
  control_point: ''
  问题简述: 访问控制策略存在缺陷或不完善，存在越权访问可能
  标准要求: 应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则。
  适用范围: 第三级及以上定级对象。
  问题描述: '1) 业务应用系统/平台访问控制策略存在缺陷或不完善，可非授权访问系统功能模块或查看、操作其他用户的数据；

    2) 数据库管理系统访问控制策略存在缺陷或不完善，存在数据库的超级管理员权限被授予非数据库管理员用户、或数据库的默认超级管理员账户被用于非数据库管理用途；

    3) 操作系统访问控制策略存在缺陷或不完善，存在以操作系统超级管理员权限运行的数据库、中间件、应用程序等非操作系统级进程或服务。'
  缓解措施: 具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，以及操作行为审计等监控措施。
  风险评价: 业务应用系统/平台、数据库管理系统、操作系统等访问控制策略存在缺陷或不完善，存在越权访问可能，但具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，以及操作行为审计等监控措施，可根据实际措施效果酌情降低风险等级。
  整改建议: 建议根据系统用户及其所需的访问权限，设计系统访问控制策略，并依据该策略为系统用户分配与其角色或职责相匹配的访问权限，避免垂直越权和平行越权行为的发生。对应用系统的重要页面、功能模块进行重新进行身份、权限鉴别，确保应用系统不存在访问控制失效情况。
  binds_items:
  - 4
  - 5
  - 7
  - 8
  - 9
  - 10
- hr_id: HR-06
  可降风险: true
  降风险前提: 具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，或主机入侵检测、恶意代码检测等防护措施正常有效，使相关漏洞难以利用。
  level_min: 2
  control_point: 入侵防范
  问题简述: 开启多余的系统服务、默认共享和高危端口
  标准要求: 应关闭不需要的系统服务、默认共享和高危端口。
  适用范围: 第二级及以上定级对象。
  问题描述: 开启多余的系统服务、默认共享和高危端口，且可被远程访问。
  缓解措施: '1) 具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，使得多余系统服务、默认共享和高危端口相关漏洞难以利用；

    2) 具有主机入侵检测或恶意代码检测等防护措施，相关检测和防护功能正常有效，使得多余系统服务、默认共享和高危端口相关漏洞难以利用。'
  风险评价: '1) 开启多余的系统服务、默认共享和高危端口，且可被远程访问，但具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，使得多余系统服务、默认共享和高危端口相关漏洞难以利用，可根据实际措施效果酌情降低风险等级；

    2) 开启多余的系统服务、默认共享和高危端口，且可被远程访问，但具有主机入侵检测或恶意代码检测等防护措施，相关检测和防护功能正常有效，使得多余系统服务、默认共享和高危端口相关漏洞难以利用，可根据实际措施效果酌情降低风险等级。'
  整改建议: 建议网络设备、安全设备、主机设备等关闭不必要的服务和端口，降低安全隐患。
  binds_items:
  - 12
  - 17
- hr_id: HR-07
  可降风险: true
  降风险前提: 通过非互联网等公共通信网络管理或访问，且具有仅限本地访问、远程访问管控措施，或主机入侵检测、恶意代码检测等防护措施正常有效；通过互联网管理或访问的无缓解措施。
  level_min: 2
  control_point: ''
  问题简述: 存在可被利用的高危安全漏洞
  标准要求: 应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞。
  适用范围: 第二级及以上定级对象。
  问题描述: '1) 通过互联网管理或访问的系统或设备，存在外界披露的可被利用的高危安全漏洞；

    2) 通过非互联网等公共通信网络管理或访问的系统或设备，经测试验证确认存在缓冲区溢出、越权访问、远程代码执行等可被利用的高危安全漏洞。'
  缓解措施: '1) 通过互联网管理或访问的系统或设备，存在外界披露的可被利用的高危安全漏洞，无缓解措施；

    2) 通过非互联网等公共通信网络管理或访问的系统或设备，具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，使得高危漏洞难以利用；

    3) 通过非互联网等公共通信网络管理或访问的系统或设备，具有主机入侵检测或恶意代码检测等防护措施，相关检测和防护功能正常有效，使得高危漏洞难以利用。'
  风险评价: '1) 通过互联网管理或访问的系统或设备，存在外界披露的可被利用的高危安全漏洞，上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险；

    2) 通过非互联网等公共通信网络管理或访问的系统或设备，存在外界披露的可被利用的高危安全漏洞，但具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，使得高危漏洞难以利用，可根据实际措施效果酌情降低风险等级；

    3) 通过非互联网等公共通信网络管理或访问的系统或设备，具有主机入侵检测或恶意代码

    检测等防护措施，相关检测和防护功能正常有效，使得高危漏洞难以利用，可根据实际措

    施效果酌情降低风险等级。'
  整改建议: 建议在充分测试的情况下，及时对设备进行补丁更新，修补已知的高风险安全漏洞；此外，还应定期对设备进行漏洞扫描，及时处理发现的风险漏洞，提高设备稳定性与安全性。
  binds_items:
  - 15
  - 20
- hr_id: HR-08
  可降风险: true
  降风险前提: 不对互联网等公共通信网络提供服务，且具有仅限本地访问、远程访问管控措施及操作行为审计，或采用WEB应用防火墙、WEB流量过滤、网页防篡改等技术措施进行防护。
  level_min: 2
  control_point: ''
  问题简述: 数据有效性检验功能缺失或不完善
  标准要求: 应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求。
  适用范围: 第二级及以上定级对象。
  问题描述: 未提供数据有效性检验功能或数据有效性校验功能不完善，存在SQL 注入、跨站脚本、文件上传等造成严重后果的高风险安全漏洞。
  缓解措施: '1) 不对互联网等公共通信网络提供服务，且具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，以及操作行为审计等技术措施，使得高风

    险安全漏洞难以利用；

    2) 采用WEB 应用防火墙、WEB 流量过滤、网页防篡改等技术措施进行防护，使得高风险安全漏洞难以利用。'
  风险评价: '1) 未提供数据有效性检验功能或数据有效性校验功能不完善，存在SQL 注入、跨站脚本、文件上传等造成严重后果的高风险安全漏洞，但由于不对互联网等公共通信网络提供服务，且具有仅限本地访问，或具有登录地址限制、登录终端限制、物理位置限制等远程访问管控措施，以及操作行为审计等技术措施，使得高风险安全漏洞难以利用，可根据实际措施效果酌情降低风险等级；

    2) 未提供数据有效性检验功能或数据有效性校验功能不完善，存在SQL 注入、跨站脚本、文件上传等造成严重后果的高风险安全漏洞，但采用WEB 应用防火墙、WEB 流量过滤、网页防篡改等技术措施进行防护，使得高风险安全漏洞难以利用，可根据实际措施效果酌情降低风险等级。'
  整改建议: 建议修改应用系统代码，对输入数据的格式、长度、特殊字符进行校验和必要的过滤，提高应用系统的安全性，防止相关漏洞的出现。
  binds_items:
  - 14
  - 19
- hr_id: HR-09
  可降风险: true
  降风险前提: 使用非Windows操作系统且不对互联网等公共通信网络提供服务，并具有USB介质管控、软件白名单、主机入侵检测、主机安全审计等技术措施；或在关键网络节点采取有效的恶意代码检测和清除措施。
  level_min: 2
  control_point: 恶意代码防范
  问题简述: 恶意代码防范措施缺失
  标准要求: 应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库（第二级）；应采用免受恶意代码攻击的技术措施或主动免疫可信验证机制及时识别入侵和病毒行为，并将其有效阻断（第三级）。
  适用范围: 第二级及以上定级对象。
  问题描述: '1) 未采取恶意代码检测和清除措施；

    2) 恶意代码防范产品授权已过期；

    3) 恶意代码特征库/规则库等一个月以上未更新。'
  缓解措施: '1) 使用了Linux、Unix、Solaris、CentOS、AIX、Mac 等非Windows 操作系统的定级对象，且不对互联网等公共通信网络提供服务，具有USB 介质管控、软件白名单、主机入侵检测、主机安全审计等技术措施；

    2) 使用了Linux、Unix、Solaris、CentOS、AIX、Mac 等非Windows 操作系统的定级对象，且在关键网络节点处采取了有效的恶意代码检测和清除的技术措施；

    3) 使用Windows 操作系统的定级对象，未采取恶意代码检测和清除措施，或恶意代码防范产品授权已过期，或恶意代码特征库/规则库等一个月以上未更新，无缓解措施。'
  风险评价: '1) 未采取恶意代码检测和清除措施，或恶意代码防范产品授权已过期，或恶意代码特征库/规则库等一个月以上未更新，但使用了Linux、Unix、Solaris、CentOS、AIX、Mac 等非Windows 操作系统的定级对象，且不对互联网等公共通信网络提供服务，具有USB 介质管控、软件白名单、主机入侵检测、主机安全审计等技术措施，可根据实际措施效果酌情降低风险等级；

    2) 未采取恶意代码检测和清除措施，或恶意代码防范产品授权已过期，或恶意代码特征库/规则库等一个月以上未更新，但使用了Linux、Unix、Solaris、CentOS、AIX、Mac 等非Windows 操作系统的定级对象，且在关键网络节点处采取了有效的恶意代码检测和清除的技术措施，可根据实际措施效果酌情降低风险等级；

    3) 未采取恶意代码检测和清除措施，或恶意代码防范产品授权已过期，或恶意代码特征库/规则库等一个月以上未更新，所使用的操作系统为Windows 操作系统，上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。'
  整改建议: 建议在关键网络节点及主机操作系统上均部署恶意代码检测和清除产品，开启恶意代码检测和清除功能，并及时更新恶意代码库。网络层与主机层恶意代码防范产品宜形成异构模式，有效检测及清除可能出现的恶意代码攻击。
  binds_items:
  - 20
  - 30
- hr_id: HR-10
  可降风险: true
  降风险前提: 仅鉴别信息明文传输且采用不可绕过的两种或两种以上组合身份鉴别措施，获得鉴别信息无法成功登录；重要个人信息或重要业务数据明文传输的无缓解措施。
  level_min: 3
  control_point: 数据保密性
  问题简述: 重要数据明文传输
  标准要求: 应采用密码技术保证重要数据在传输过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等。
  适用范围: 第三级及以上定级对象。
  问题描述: 鉴别信息、重要个人信息或重要业务数据等以明文的方式在网络环境中传输。
  缓解措施: '1) 鉴别信息以明文的方式在网络环境中传输，但采用不可绕过的两种或两种以上组合的身份鉴别措施，获得鉴别信息无法成功登录；

    2) 重要个人信息或重要业务数据等以明文的方式在网络环境中传输，无缓解措施。'
  风险评价: '1) 鉴别信息以明文的方式在网络环境中传输，但采用不可绕过的两种或两种以上组合的身份鉴别措施，获得鉴别信息无法成功登录，可根据实际措施效果酌情降低风险等级；

    2) 重要个人信息或重要业务数据等以明文的方式在网络环境中传输，上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。'
  整改建议: 建议采用密码技术保证重要数据在传输过程中的保密性，且相关密码技术符合国家密码管理部门的规定。
  binds_items:
  - 25
  - 26
- hr_id: HR-11
  可降风险: true
  降风险前提: 不对互联网等公共通信网络提供服务，且具有仅限本地访问或带外管理等措施；或具有数据库防火墙、数据防泄露等技术措施且防护功能和策略正确有效。
  level_min: 3
  control_point: ''
  问题简述: 重要数据明文存储
  标准要求: 应采用密码技术保证重要数据在存储过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等。
  适用范围: 第三级及以上定级对象。
  问题描述: 鉴别信息、重要个人信息、具有保密性需求的重要业务数据以明文的方式存储。
  缓解措施: '1) 不对互联网等公共通信网络提供服务，且具有仅限本地访问或带外管理等措施；

    2) 具有数据库防火墙、数据防泄露等技术措施，相关防护功能和策略正确有效。'
  风险评价: '1) 鉴别信息、重要个人信息、重要业务数据以明文的方式存储，但不对互联网等公共通信网络提供服务，且具有仅限本地访问或带外管理等措施，可根据实际措施效果酌情降低风险等级；

    2) 鉴别信息、重要个人信息、重要业务数据以明文的方式存储，但具有数据库防火墙策略、数据防泄露等技术措施，相关防护功能和策略正确有效，可根据实际措施效果酌情降低风险等级。'
  整改建议: 建议采用密码技术保证重要数据在存储过程中的保密性，且相关密码技术符合国家密码管理部门的规定。
  binds_items:
  - 26
  - 27
- hr_id: HR-12
  可降风险: true
  降风险前提: 采用多数据中心或冗余方式部署，重要数据存在多个可用副本；备份到互联网网盘或相关存储环境的无缓解措施。
  level_min: 3
  control_point: 数据备份恢复
  问题简述: 重要数据无本地备份措施
  标准要求: 应提供重要数据的本地数据备份与恢复功能。
  适用范围: 第三级及以上定级对象。
  问题描述: '1) 重要数据未提供任何数据备份措施；

    2) 重要数据备份到互联网网盘或相关存储环境。'
  缓解措施: '1) 采用多数据中心或冗余方式部署，重要数据存在多个可用副本；

    2) 重要数据备份到互联网网盘或相关存储环境，无缓解措施。'
  风险评价: '1) 重要数据未提供任何数据备份措施，但系统采用多数据中心或冗余方式部署，重要数据存在多个可用副本，可根据实际措施效果酌情降低风险等级；

    2) 重要数据备份到互联网网盘或相关存储环境，上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。'
  整改建议: 建议建立备份恢复机制，定期对重要数据进行备份以及恢复测试，确保在出现数据破坏时，可利用备份数据进行恢复，此外，应对备份文件妥善保存，不要放在互联网网盘、开源代码平台等不可控环境中，避免重要信息泄露。
  binds_items:
  - 18
  - 27
  - 28
- hr_id: HR-13
  可降风险: false
  降风险前提: ''
  level_min: 3
  control_point: ''
  问题简述: 数据处理系统冗余措施缺失
  标准要求: 应提供重要数据处理系统的热冗余，保证系统的高可用性。
  适用范围: 业务连续性要求高的第三级及以上定级对象。
  问题描述: 对于业务连续性要求较高的被测对象，处理重要数据的设备（如重要服务器、重要数据库管理系统等）未采用热冗余方式部署，发生故障后可能导致重要业务中断。
  缓解措施: 无。
  风险评价: 上述安全问题一旦被威胁利用后，可能会导致等级保护对象面临高风险。
  整改建议: 建议对重要数据处理系统采用热冗余技术，提高系统的可用性。
  binds_items:
  - 29
  - 30
- hr_id: HR-14
  可降风险: false
  降风险前提: ''
  level_min: 4
  control_point: ''
  问题简述: 无异地灾备措施
  标准要求: 应建立异地灾难备份中心，提供业务应用的实时切换。
  适用范围: 业务连续性要求高的第四级及以上定级对象。
