rules:
- rule_id: H3C-L3-01-P02-01
  level: 3
  item: 1
  point: 2
  block: H3C 账户与权限配置
  expect:
    contains: fact:h3c.users.unique=true
  pass_reason: 用户列表中的用户名唯一，未发现相同用户名账户。
  fail_reason: 用户列表存在相同用户名，身份标识不满足唯一性。
- rule_id: H3C-L3-01-P03-02
  level: 3
  item: 1
  point: 3
  block: H3C 账户与权限配置
  expect:
    contains: fact:h3c.users.empty_password=none
  pass_reason: 本地用户均配置了口令，未发现空口令账户。
  fail_reason: 存在未配置口令或空口令的本地用户。
- rule_id: H3C-L3-05-P02-03
  level: 3
  item: 5
  point: 2
  block: H3C 账户与权限配置
  expect:
    contains: fact:h3c.users.anonymous=none
  pass_reason: 未发现匿名或公共账户。
  fail_reason: 存在匿名、guest 或 public 等可登录账户。
- rule_id: H3C-L3-06-P01-04
  level: 3
  item: 6
  point: 1
  block: H3C 账户与权限配置
  expect:
    contains: fact:h3c.users.default_account=none
  pass_reason: 未发现使用默认名称的可登录账户。
  fail_reason: 存在 admin、h3c 等默认名称账户且未被禁用或重命名。
- rule_id: H3C-L3-08-P02-05
  level: 3
  item: 8
  point: 2
  block: H3C 账户与权限配置
  expect:
    contains: fact:h3c.roles.privilege_distinct=true
  pass_reason: 不同管理用户配置了不同角色或权限级别。
  fail_reason: 管理用户角色或权限级别未区分，存在权限过度集中。
- rule_id: H3C-L3-02-P03-06
  level: 3
  item: 2
  point: 3
  block: H3C 账户与权限配置
  expect:
    lt:
      prefix: fact:h3c.timeout.idle_minutes=
      value: 31
  pass_reason: 管理终端空闲超时时间不超过 30 分钟。
  fail_reason: 未配置空闲超时或超时时间超过 30 分钟。
- rule_id: H3C-L3-01-P04-07
  level: 3
  item: 1
  point: 4
  block: H3C 口令控制策略
  expect:
    all:
    - contains: fact:h3c.password_control.enabled=true
    - lt:
        prefix: fact:h3c.password_control.aging_days=
        value: 91
    - gt:
        prefix: fact:h3c.password_control.length=
        value: 7
    - gt:
        prefix: fact:h3c.password_control.composition_types=
        value: 2
  pass_reason: 已启用全局口令管理，口令有效期、长度和组成复杂度满足要求。
  fail_reason: 未启用口令管理，或口令有效期、长度、组成复杂度至少一项不满足要求。
- rule_id: H3C-L3-02-P01-08
  level: 3
  item: 2
  point: 1
  block: H3C 口令控制策略
  expect:
    all:
    - contains: fact:h3c.password_control.enabled=true
    - gt:
        prefix: fact:h3c.password_control.login_attempt=
        value: 0
  pass_reason: 已启用口令管理并配置登录失败次数限制。
  fail_reason: 未启用口令管理或未配置登录失败次数限制。
- rule_id: H3C-L3-02-P02-09
  level: 3
  item: 2
  point: 2
  block: H3C 口令控制策略
  expect:
    all:
    - lt:
        prefix: fact:h3c.password_control.login_attempt=
        value: 11
    - gt:
        prefix: fact:h3c.password_control.lock_minutes=
        value: 4
  pass_reason: 登录失败次数阈值不超过 10 次，且锁定时间不少于 5 分钟。
  fail_reason: 登录失败次数阈值过大或未配置足够的锁定时间。
- rule_id: H3C-L3-03-P02-10
  level: 3
  item: 3
  point: 2
  block: H3C 远程管理加密
  expect:
    contains: fact:h3c.remote.encrypted=true
  pass_reason: 远程管理使用 SSH/HTTPS 加密，未启用 Telnet/HTTP 明文管理。
  fail_reason: 远程管理仍启用 Telnet/HTTP 等明文协议，鉴别信息可能被窃听。
- rule_id: H3C-L3-23-P01-11
  level: 3
  item: 23
  point: 1
  block: H3C 远程管理加密
  expect:
    contains: fact:h3c.remote.encrypted=true
  pass_reason: 数据传输采用 SSH/HTTPS 加密通道。
  fail_reason: 数据传输使用明文协议，完整性无法保证。
- rule_id: H3C-L3-25-P01-12
  level: 3
  item: 25
  point: 1
  block: H3C 远程管理加密
  expect:
    contains: fact:h3c.remote.encrypted=true
  pass_reason: 数据传输采用 SSH/HTTPS 加密通道。
  fail_reason: 数据传输使用明文协议，保密性无法保证。
- rule_id: H3C-L3-12-P01-13
  level: 3
  item: 12
  point: 1
  block: H3C 安全审计
  expect:
    contains: fact:h3c.audit.info_center=true
  pass_reason: 信息中心已启用，具备安全审计功能。
  fail_reason: 信息中心未启用，未开启安全审计功能。
- rule_id: H3C-L3-12-P03-14
  level: 3
  item: 12
  point: 3
  block: H3C 安全审计
  expect:
    all:
    - contains: fact:h3c.audit.info_center=true
    - contains: fact:h3c.audit.logbuffer=true
  pass_reason: 信息中心和日志缓冲区均已启用，可记录重要用户行为和安全事件。
  fail_reason: 日志缓冲区未启用，无法确认重要用户行为和安全事件被审计。
- rule_id: H3C-L3-14-P02-15
  level: 3
  item: 14
  point: 2
  block: H3C 安全审计
  expect:
    contains: fact:h3c.audit.loghost=true
  pass_reason: 已配置日志主机，审计记录可定期备份到外部系统。
  fail_reason: 未配置日志主机，审计记录缺少外部备份。
- rule_id: H3C-L3-18-P01-16
  level: 3
  item: 18
  point: 1
  block: H3C 管理终端限制
  expect:
    contains: fact:h3c.acl.vty_restricted=true
  pass_reason: 管理终端已通过 ACL 限制接入范围。
  fail_reason: 未发现管理终端接入范围限制配置。
- rule_id: H3C-L3-24-P01-17
  level: 3
  item: 24
  point: 1
  block: H3C 口令密文存储
  expect:
    contains: fact:h3c.secret_storage.cipher=true
  pass_reason: 口令以 irreversible-cipher/cipher 等密文形式存储。
  fail_reason: 口令以 simple 等明文形式存储，完整性无法保证。
- rule_id: H3C-L3-26-P01-18
  level: 3
  item: 26
  point: 1
  block: H3C 口令密文存储
  expect:
    contains: fact:h3c.secret_storage.cipher=true
  pass_reason: 口令以 irreversible-cipher/cipher 等密文形式存储。
  fail_reason: 口令以 simple 等明文形式存储，保密性无法保证。
