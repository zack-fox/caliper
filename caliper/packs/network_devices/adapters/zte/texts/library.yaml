- seq: 3
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  issue_summary: 1、远程管理设备时未采取措施防止鉴别信息在网络传输过程中被窃听；
  issue_detail: 2、采用SSH/HTTPS方式进行远程管理，但未禁用Telnet/HTTP管理方式
  hazard: 采用明文传输的协议管理设备时，账号、口令等重要数据可能被嗅探并盗用，导致设备被非授权访问。
  remediation: 建议采用SSH或HTTPS的方式对设备进行远程管理，并禁用Telnet/HTTP等方式，防止鉴别信息在网络传输过程中被窃听。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 4
  control_point: 身份鉴别
  control_item: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
  issue_summary: 未采用两种或两种以上组合的鉴别技术对用户进行身份鉴别
  issue_detail: ''
  hazard: 登录口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问
  remediation: 建议对设备采用两种或两种以上组合的鉴别技术实现用户身份鉴别，且其中一种鉴别技术为密码技术，如使用基于国密算法技术的动态口令或令牌等
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 8
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  issue_summary: 未实现管理用户的权限分离
  issue_detail: ''
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约
  remediation: 建议对设备账户权限进行梳理，建立如：网络管理员、安全管理员、审计管理员等角色的若干账户，实现管理用户的权限分离
  threat: 越权访问、权限滥用
  inherent_risk: 高
