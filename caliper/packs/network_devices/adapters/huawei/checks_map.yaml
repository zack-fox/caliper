    - 1
  - item: 24
    level: 4
    points: *id014
  - item: 26
    level: 3
    points: &id015
    - 1
  - item: 27
    level: 4
    points: *id015
  session:
  - kind: network
    pattern: ^\s*display\s+current-configuration\s*\|\s*include\s+password\b
