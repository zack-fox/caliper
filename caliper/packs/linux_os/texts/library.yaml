  layer: 安全计算环境
  control_point: 入侵防范
  control_item: b） 应关闭不需要的系统服务、默认共享和高危端口。
  issue_summary: 部分操作系统存在多余端口和默认共享。
  issue_detail: =G317
  hazard: 多余端口和默认共享服务可能存在安全漏洞，或影响服务器性能，造成业务中断。
  remediation: 建议加强操作系统的管理，关闭不必要的共享服务和端口，降低安全隐患。
  threat: 恶意代码,网络攻击,泄密
  inherent_risk: 高
- seq: 318
  standard_code: SHTEC-14-01-01-3X-04-03
  layer: 安全计算环境
  control_point: 入侵防范
  control_item: c） 应能通过漏洞扫描工具、人工漏洞排查等手段，发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞；
  issue_summary: 未定期对系统进行漏洞扫描，无法及时发现可能存在的漏洞并及时修复。
  issue_detail: =G318
  hazard: 未定期进行漏洞扫描，无法及时发现可能存在的漏洞并及时修复。
  remediation: 建议定期进行漏洞扫描，及时发现可能存在的漏洞，并在充分验证的情况下修复漏洞，并定期对计算设备的补丁进行更新。
  threat: 网络攻击
  inherent_risk: 中
- seq: 319
  standard_code: SHTEC-14-01-01-3X-05-01
  layer: 安全计算环境
  control_point: 恶意代码防范
  control_item: a） 应采用免受恶意代码攻击的技术措施或采用主动免疫可信验证机制及时识别入侵和病毒行为，并将其有效阻断；
  issue_summary: Linux操作系统未安装防恶意代码软件。
  issue_detail: =G319
  hazard: 存在发生恶意代码在系统内部网络传播的可能性。
  remediation: 建议在Linux操作系统上安装防病毒软件，并及时进行病毒库更新，以保障操作系统运行安全。
  threat: 恶意代码
  inherent_risk: 中
- seq: 320
  standard_code: SHTEC-14-01-01-3X-07-01
  layer: 安全计算环境
  control_point: 数据完整性
  control_item: a） 采用密码技术保证重要数据在传输过程中的完整性，包括但不限于调度信息、鉴别数据、重要业务数据、重要审计数据、重要配置数据、重要媒体内容数据和重要个人信息等；
  issue_summary: 未对重要数据进行加密传输。
  issue_detail: ''
  hazard: 系统在数据传输过程中未对敏感信息（如系统管理数据、鉴别信息和重要业务数据等）进行加密处理，敏感信息以明文方式传输。
  remediation: 建议对系统管理数据、鉴别信息及重要业务数据采用经国家密码主管部门认可的密码技术，保证其在通信过程中数据的私密性。
  threat: 篡改
  inherent_risk: 高
- seq: 321
  standard_code: SHTEC-14-01-01-3X-12-01
  layer: 安全计算环境
  control_point: 业务连续性保障
  control_item: a） 播出直接相关系统应保证节目传输链路的冗余，并能够在发生故障时切换；
  issue_summary: 未对关键播出设备进行热冗余部署，不能保证该设备出现故障后能正常播放。
  issue_detail: ''
  hazard: 关键播出设备未进行热备部署，出现故障后可能影响正常播出。
  remediation: 建议对关键播出设备进行热冗余部署，保证该设备出现故障时能自动切换继续运行，切换过程不会对正常播出造成影响
  threat: 软硬件故障
  inherent_risk: 中
