  control_item: a）应仅采集和保存业务必需的用户个人信息；
  issue_summary: 未制定个人信息相关管理制度。
  issue_detail: =G145
  hazard: 未制定个人信息相关管理制度，可能存在违规采集和存储个人信息，造成个人信息泄露的风险。
  remediation: 建议根据国家、行业主管部门以及标准的相关规定（如《信息安全技术 个人信息安全规范》），制订个人信息相关管理制度，明确向用户表明采集信息的内容、用途以及相关的安全责任，并在用户同意、授权的情况下采集、保存业务必需的用户个人信息。
  threat: 管理不到位
  inherent_risk: 中
