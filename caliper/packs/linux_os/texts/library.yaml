  inherent_risk: 中
- seq: 144
  standard_code: SHTEC-05-01-01-3X-10-02
  layer: 安全计算环境
  control_point: 剩余信息保护
  control_item: b）应保证存有敏感数据的存储空间被释放或重新分配前得到完全清除。
  issue_summary: 操作系统未采取措施保证敏感数据所在存储空间重新分配前得到完全清除。
  issue_detail: =G144
  hazard: 可能被未授权人员获取相关信息，导致信息泄露。
  remediation: 建议采取技术措施保证系统重要信息资源存储空间在释放或再分配前完全清除，避免敏感/重要数据的泄露； Windows设置：清除虚拟内存页面：运行->regedit.msc->计算机配置->windows配置->安全设置->本地策略->安全选项，启用“关机前清除虚拟内存页面”2）关闭密码还原功能；：运行->gpedit.msc->windows设置->安全设置->账户策略->密码策略，禁用“用可还原的加密来存储密码”。
  threat: 泄密
  inherent_risk: 中
- seq: 145
  standard_code: SHTEC-05-01-01-3X-11-01
  layer: 安全计算环境
