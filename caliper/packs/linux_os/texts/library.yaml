texts:
- seq: 1
  standard_code: SHTEC-05-01-01-01-03-02
  layer: 安全物理环境
  control_point: 防盗窃和防破坏
  control_item: b）应将通信线缆铺设在隐蔽安全处。
  issue_summary: 通信线缆铺未设在隐蔽安全处，铺设不规范，布线混乱。
  issue_detail: ''
  hazard: 通信线缆被触碰而导致通信故障的可能性增大，从而影响信息系统的正常运行。
  remediation: 建议将通信线缆铺设在隐蔽安全处，避免通信线缆被盗窃和破坏。
  threat: 物理损害
  inherent_risk: 中
- seq: 2
  standard_code: SHTEC-05-01-01-01-05-01
  layer: 安全物理环境
  control_point: 防火
  control_item: a）机房应设置火灾自动消防系统，能够自动检测火情、自动报警，并自动灭火；
  issue_summary: 机房未设置火灾自动消防系统，在发生火情后无法及时自动进行灭火。
  issue_detail: ''
  hazard: 增加了无法及时触发火灾报警并进行自动灭火而造成损失的风险。
  remediation: 建议为机房安装火灾感应报警装置、自动气体灭火系统。
  threat: 软硬件故障
  inherent_risk: 中
- seq: 3
  standard_code: SHTEC-05-01-01-01-08-01
  layer: 安全物理环境
  control_point: 温湿度控制
  control_item: a）应设置温湿度自动调节设施，使机房温湿度的变化在设备运行所允许的范围之内。
  issue_summary: 机房未配备专用精密空调对温湿度进行控制。
  issue_detail: =G3
  hazard: 机房当前使用普通空调进行温度控制，未配备专用精密空调对温、湿度分别进行控制，不利于机房内设备的安全稳定运行。
  remediation: 建议配备机房精密空调进行温湿度控制，温度15~30℃，湿度30％～80％。
  threat: 软硬件故障
  inherent_risk: 中
- seq: 4
  standard_code: SHTEC-05-01-01-01-09-01
  layer: 安全物理环境
  control_point: 电力供应
  control_item: a）应在机房供电线路上配置稳压器和过电压防护设备；
  issue_summary: 机房未在供电线路上配置稳压器和过电压防护设备。
  issue_detail: =G4
  hazard: 机房未在供电线路上配置稳压器和过电压防护设备，一旦电网出现供电异常将影响设备的正常运行，严重时将造成设备损坏。
  remediation: 建议在供电线路上配置稳压器和过电压防护设备。
  threat: 软硬件故障
  inherent_risk: 中
- seq: 5
  standard_code: SHTEC-05-01-01-01-10-01
  layer: 安全物理环境
  control_point: 电磁防护
  control_item: a）电源线和通信线缆应隔离铺设，避免互相干扰。
  issue_summary: 机房内电源线和通信线缆未隔离铺设。
  issue_detail: =G5
  hazard: 机房内电源线和通信未隔离铺设，可能造成设备通信干扰，从而导致系统运行故障。
  remediation: 建议机房内电源线和通信线缆隔离铺设，避免造成设备通信干扰导致系统运行故障。
  threat: 软硬件故障
  inherent_risk: 中
- seq: 6
  standard_code: SHTEC-05-01-01-04-01-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 数据库未设置鉴别信息复杂度校验机制，且未定期更换口令。
  issue_detail: =G6
  hazard: 存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性。
  remediation: 建议实现口令复杂度校验功能，根据安全需要对用户口令的复杂度和更换周期进行合理设置，保证口令长度8位以上，由大小写字母、数字和特殊字符至少三种以上组合而成，并定期每3个月更换数据库口令。
  threat: 网络攻击
  inherent_risk: 中
- seq: 7
  standard_code: SHTEC-05-01-01-04-01-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 操作系统自身鉴别信息复杂度校验机制不完善，且未定期更换口令。
  issue_detail: =G7
  hazard: 存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性。
  remediation: 建议根据需要对系统用户口令设置复杂度限制，口令的复杂度（8位以上、至少字母、数字、符号等混合组成）并更换周期进行合理设置（90天以内），且定期在口令有效期周期内更换口令，不允许新设定的口令与前次旧口令相同。
  threat: 网络攻击
  inherent_risk: 中
- seq: 8
  standard_code: SHTEC-05-01-01-04-01-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 应用系统未设置口令有效期策略，且未定期更换口令。
  issue_detail: =G8
  hazard: 口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议根据需要对口令设置有效期并定期更换，周期进行合理设置（90天以内），不允许新设定的口令与前次旧口令相同，降低受到口令猜测、非授权访问的风险。
  threat: 网络攻击
  inherent_risk: 中
- seq: 9
  standard_code: SHTEC-05-01-01-04-01-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 系统未设置口令有效期策略，且未定期更换口令。
  issue_detail: =G9
  hazard: 口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议根据需要对口令设置有效期并定期更换，周期进行合理设置（90天以内），不允许新设定的口令与前次旧口令相同，降低受到口令猜测、非授权访问的风险。
  threat: 网络攻击
  inherent_risk: 中
- seq: 10
  standard_code: SHTEC-05-01-01-04-01-01
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换；
  issue_summary: 操作系统未设置口令复杂度策略及口令有效期策略，且未定期更换口令。
  issue_detail: =G10
  hazard: 存在使用穷举法进行口令的暴力破解或口令被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问的可能性。
  remediation: 建议根据需要对系统用户口令设置复杂度限制，口令的复杂度（8位以上、至少字母、数字、符号等混合组成）并更换周期进行合理设置（90天以内），且定期在口令有效期周期内更换口令，不允许新设定的口令与前次旧口令相同。
  threat: 网络攻击
  inherent_risk: 中
- seq: 11
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 数据库未设置登录失败处理，超时自动退出时间不合理。
  issue_detail: =G11
  hazard: 登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议完善数据库登录失败处理功能及超时自动退出功能，如登录失败3~5次锁定账户30分钟，30分钟无操作自动断开连接。
  threat: 网络攻击
  inherent_risk: 中
- seq: 12
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: MongoDB数据库未设置登录失败处理功能和超时自动退出功能。
  issue_detail: =G12
  hazard: 登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: "建议设置MongoDB数据库登录失败处理功能及超时自动退出功能，如在 mongod.conf配置文件中配置： net: \n maxIncomingConnectionsIdleTime: 1800000  ；\nsecurity:\n  authenticationRestrictions: \n      maxFailedAttempts: 5 \n      lockoutPeriod: 600 。"
  threat: 网络攻击
  inherent_risk: 中
- seq: 13
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 应用系统未设置登录连接超时自动退出策略。
  issue_detail: =G13
  hazard: 登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议配置登录连接超时处理功能，如：10分钟未进行操作，退出登录等。
  threat: 泄密,管理不到位
  inherent_risk: 中
- seq: 14
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 应用系统未设置登录连接超时自动退出策略。
  issue_detail: =G14
  hazard: 未设置登录连接超时自动退出策略长时间离开设备不锁屏可能导致重要信息泄露。
  remediation: 建议配置登录连接超时处理功能，如：10分钟未进行操作，退出登录等。
  threat: 泄密,管理不到位
  inherent_risk: 中
- seq: 15
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: 系统管理软件未设置登录连接超时自动退出策略。
  issue_detail: =G15
  hazard: 未设置登录连接超时自动退出策略长时间离开设备不锁屏可能导致重要信息泄露。
  remediation: 建议配置登录连接超时处理功能，如：10分钟未进行操作，退出登录等。
  threat: 泄密,管理不到位
  inherent_risk: 中
- seq: 16
  standard_code: SHTEC-05-01-01-04-01-02
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施；
  issue_summary: MySQL数据库未配置登录超时退出功能，且登录连接超时自动退出的超时时间值过大。
  issue_detail: =G16
  hazard: 登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问。
  remediation: 建议mysql数据库安装并启用connection_control插件，并设置相关参数为：connection_control_failed_connections_threshold=3，connection_control_max_connection_delay=2147483647，connection_control_min_connection_delay=600000；connection_control=10；interactive_timeout=1800；wait_timeout=1800。
  threat: 网络攻击
  inherent_risk: 中
- seq: 17
  standard_code: SHTEC-05-01-01-04-01-03
  layer: 安全计算环境
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听；
  issue_summary: 数据库未启用SSL/TLS加密配置，不能防止鉴别信息在网络传输过程中被窃听。
  issue_detail: =G17
  hazard: 数据库账号、口令等鉴别信息明文传输，容易被监听，可能造成数据泄漏。
  remediation: 建议数据库启用SSL/TLS加密协议保证用户鉴别信息的传输安全。
  threat: 篡改
  inherent_risk: 高
- seq: 18
  standard_code: SHTEC-05-01-01-04-02-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  issue_summary: 未设置审计管理员账户和安全管理员账户，无法实现特权用户的权限分离。
  issue_detail: =G18
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议系统授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的审计管理员、安全管理员，对各类用户的操作行为进行审计监督。
  threat: 管理不到位
  inherent_risk: 中
- seq: 19
  standard_code: SHTEC-05-01-01-04-02-04
  layer: 安全计算环境
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离；
  issue_summary: 未设置系统管理员账户、审计管理员账户和安全管理员账户，无法实现特权用户的权限分离。
  issue_detail: =G19
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议系统授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的审计管理员、安全管理员，对各类用户的操作行为进行审计监督。
  threat: 管理不到位
  inherent_risk: 中
- seq: 20
  standard_code: SHTEC-05-01-01-04-02-07
  layer: 安全计算环境
  control_point: 访问控制
  control_item: g）应对重要主体和客体设置安全标记，并控制主体对有安全标记信息资源的访问。
  issue_summary: 未对重要主体和客体设置安全标记，并控制主体对有安全标记信息资源的访问。
  issue_detail: =G20
  hazard: 存在恶意用户通过修改用户权限等方法，非授权访问重要信息资源的可能。
  remediation: 建议对重要主体和客体设置安全标记，并控制主体对有安全标记信息资源的访问。
  threat: 未授权行为
  inherent_risk: 低
- seq: 21
  standard_code: SHTEC-05-01-01-04-07-01
  layer: 安全计算环境
  control_point: 数据完整性
  control_item: a）应采用校验技术保证重要数据在传输过程中的完整性。
  issue_summary: 未采用校验技术或密码技术保证重要数据在传输过程中的完整性。
  issue_detail: =G21
  hazard: 可能导致重要数据在传输过程中被攻击者劫持、篡改。
  remediation: 建议对重要数据采用经国家密码管理局认可的密码技术或校验技术保证传输过程中数据的完整性。
  threat: 篡改
  inherent_risk: 中
- seq: 22
  standard_code: SHTEC-05-01-01-04-07-02
  layer: 安全计算环境
  control_point: 数据完整性
  control_item: b）应采用校验技术或密码技术保证重要数据在存储过程中的完整性，包括但不限于鉴别数据、重要业务数据、重要审计数据、重要配置数据、重要视频数据和重要个人信息等。
  issue_summary: 未采用校验技术或密码技术或所采的技术不能保证鉴别数据存储完整性的验证。
  issue_detail: =G22
  hazard: 可能导致重要数据在存储过程中被恶意篡改。重要数据在存储过程中被攻击者篡改成功的可能性增大，会影响到信息系统的正常运行，进而可能使企业的业务运营、声誉、经济利益受损。
  remediation: 建议对重要数据采用经国家密码主管部门认可的校验技术或密码技术，保证其在存储过程中数据的完整性。
  threat: 篡改
  inherent_risk: 中
- seq: 23
  standard_code: SHTEC-05-01-01-04-08-02
  layer: 安全计算环境
  control_point: 数据保密性
  control_item: b）应采用密码技术保证重要数据在存储过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等。
  issue_summary: 未采取密码技术保证重要数据在存储过程中的保密性。
  issue_detail: =G23
  hazard: 除鉴别信息以外的其他重要数据在存储过程中被窃听的可能性增大，进而可能使单位的业务运营、声誉、经济利益受损。
  remediation: 建议对重要数据采用经国家密码主管部门认可的密码技术，保证重要数据在存储过程中的保密性。
  threat: 敏感信息泄漏
  inherent_risk: 高
- seq: 24
  standard_code: SHTEC-05-01-01-04-08-02
  layer: 安全计算环境
  control_point: 数据保密性
  control_item: b）应采用密码技术保证重要数据在存储过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等。
  issue_summary: 未对除鉴别数据以外的重要数据进行加密存储。
  issue_detail: =G24
