  standard_code: SHTEC-05-01-01-3X-10-01
  layer: 安全计算环境
  control_point: 剩余信息保护
  control_item: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除。
  issue_summary: Windows操作系统身份鉴别信息释放或清除机制不完善。
  issue_detail: =G142
  hazard: 身份鉴别信息释放或清除机制存在缺陷，利用剩余鉴别信息，可能非法访问系统资源或进行操作；
  remediation: 建议windows服务器禁用“用可还原的加密来存储密码”和启用“交互式登录：不显示最后的用户名”,保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除
  threat: 越权或滥用
  inherent_risk: 中
- seq: 143
  standard_code: SHTEC-05-01-01-3X-10-02
  layer: 安全计算环境
  control_point: 剩余信息保护
  control_item: b）应保证存有敏感数据的存储空间被释放或重新分配前得到完全清除。
