# 六套规则库清单：新增、替换或下线规则库只改这里。
# status: active（必须有规则） / scaffold（框架已就位，规则待补）
version: 0.1.0
libraries:
  capture:
    title: 数据采集命令库
    status: active
    path: capture.yaml
  record:
    title: 记录表生成规则库
    status: active
    path: record.yaml
  judge:
    title: 记录表判定规则库
    status: active
    paths:
      - rules/level2.yaml
      - rules/level3.yaml
  remediation:
    title: 风险分析与整改建议库
    status: active
    path: remediation.yaml
  high_risk:
    title: 高风险判定规则库
    status: active
    path: high_risk.yaml
  major:
    title: 重大风险隐患规则库
    status: active
    path: major.yaml
