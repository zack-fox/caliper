# 三级初版规则（安全计算环境）
#
# 规则只读证据块文本，不碰资产名。每条规则 = 一个实施点在一个检查块上的判定。
# 同一实施点可以有多条规则（AND），用于组合多个检查块。
# 条件 DSL 见 core/rules/dsl.py：all/any + eq/ne/in/not_in/contains/not_contains/
# exists/not_exists/regex_empty/gt/lt，嵌套最多两层。
#
# 初版规则以样例采集脚本的输出文案为基准，后续按现场反馈迭代。

rules:
  # ---- 身份鉴别 ----
  - item: 1
    point: 1
    block: Duplicate UID / UID=0 accounts
    expect: {contains: "fact:duplicate_uid.none=true"}
    pass_reason: 未发现重复 UID
    fail_reason: 存在重复 UID，身份标识不唯一

  - item: 1
    point: 2
    block: Duplicate UID / UID=0 accounts
    expect: {contains: "fact:uid0.only_root=true"}
    pass_reason: UID=0 账户仅 root
    fail_reason: 除 root 外还存在 UID=0 账户

  - item: 1
    point: 3
    block: Empty / expired password
    expect: {contains: "fact:empty_password.none=true"}
    pass_reason: 未发现空口令账户
    fail_reason: 存在空口令账户

  - item: 1
    point: 4
    block: Password complexity
    expect: {contains: "fact:pam.password_complexity.enabled=true"}
    pass_reason: 已配置口令复杂度策略
    fail_reason: 未配置口令复杂度策略

  - item: 1
    point: 4
    block: Password policy (login.defs)
    expect: {lt: {prefix: "PASS_MAX_DAYS", value: 91}}
    pass_reason: 口令最大有效期不超过 90 天
    fail_reason: 口令最大有效期超过 90 天或未限制

  - item: 2
    point: 1
    block: Login failure lockout (faillock)
    expect: {contains: "fact:faillock.module=true"}
    pass_reason: 已启用登录失败处理模块
    fail_reason: 未启用登录失败处理模块

  - item: 2
    point: 2
    block: Login failure lockout (faillock)
    expect: {contains: "fact:faillock.policy=true"}
    pass_reason: 已配置失败次数与锁定时间
    fail_reason: 未配置失败次数或锁定时间

  - item: 2
    point: 3
    block: Session timeout TMOUT
    expect: {contains: "fact:session.tmout.valid=true"}
    pass_reason: 已配置登录连接超时退出
    fail_reason: 未配置登录连接超时退出

  - item: 3
    point: 1
    block: SSH host key algorithm
    expect: {contains: "SHA256:"}
    pass_reason: 远程管理使用 SSH 加密通道
    fail_reason: 未发现 SSH 主机密钥，远程管理加密情况无法确认

  # ---- 访问控制 ----
  - item: 5
    point: 1
    block: Key file permissions
    expect:
      all:
        - {contains: "fact:file_permissions.passwd.secure=true"}
        - {contains: "fact:file_permissions.shadow.secure=true"}
    pass_reason: 账户与鉴别信息文件权限符合要求
    fail_reason: 账户或鉴别信息文件权限不符合要求

  - item: 7
    point: 1
    block: Accounts and last password change
    expect: {contains: "fact:account.expired.none=true"}
    pass_reason: 未发现过期账户
    fail_reason: 存在过期账户或无法确认账户过期状态

  - item: 10
    point: 1
    block: World-writable / tmp perms
    expect: {contains: "none"}
    pass_reason: 未发现全局可写关键文件
    fail_reason: 存在全局可写文件，访问控制粒度不足

  - item: 10
    point: 1
    block: umask
    expect: {not_contains: "0002"}
    pass_reason: 默认 umask 未放开其他用户写权限
    fail_reason: 默认 umask 允许其他用户写，访问控制粒度不足

  - item: 11
    point: 1
    block: SELinux status
    expect: {contains: "fact:security_labels.configured=true"}
    pass_reason: 已配置主体、客体安全标记
    fail_reason: 未配置主体、客体安全标记

  # ---- 安全审计 ----
  - item: 12
    point: 1
    block: auditd status and rules
    expect:
      all:
        - {contains: "fact:auditd.active=true"}
        - {contains: "fact:auditd.rules_loaded=true"}
    pass_reason: 审计服务已启用且已加载审计规则
    fail_reason: 审计服务未启用或未加载审计规则

  - item: 12
    point: 3
    block: Log forwarding
    expect: {contains: "fact:log.forwarding.enabled=true"}
    pass_reason: 审计记录已转发至集中日志
    fail_reason: 未配置日志转发

  - item: 13
    point: 1
    block: Recent login records
    expect: {contains: "wtmp begins"}
    pass_reason: 登录审计记录可读取
    fail_reason: 未读取到登录审计记录

  - item: 14
    point: 1
    block: Log retention
    expect: {contains: "fact:log.retention.six_months=true"}
    pass_reason: 日志留存周期满足半年要求
    fail_reason: 日志留存周期不足半年

  - item: 14
    point: 1
    block: Log dir permissions
    expect: {contains: "/var/log"}
    pass_reason: 日志目录权限可核查
    fail_reason: 日志目录权限无法核查

  - item: 14
    point: 2
    block: Log archives on disk
    expect: {contains: "fact:log.archives.present=true"}
    pass_reason: 历史日志已归档
    fail_reason: 历史日志未归档

  # ---- 入侵防范 ----
  - item: 17
    point: 1
    block: Listening ports / processes
    expect:
      all:
        - {not_contains: ":21 "}
        - {not_contains: ":23 "}
        - {not_contains: ":3389"}
        - {not_contains: ":445 "}
    pass_reason: 未监听常见高危端口
    fail_reason: 存在高危端口监听

  - item: 17
    point: 2
    block: Backup job / NFS
    expect: {not_contains: "mount at"}
    pass_reason: 未发现默认共享挂载
    fail_reason: 存在默认共享挂载

  - item: 18
    point: 1
    block: Remote login source restriction
    expect:
      any:
        - {contains: "AllowUsers"}
        - {contains: "AllowGroups"}
        - {contains: "hosts.deny"}
    pass_reason: 已限制远程登录来源
    fail_reason: 未限制远程登录来源

  - item: 20
    point: 1
    block: Patches / reboot
    expect: {contains: "security 0"}
    pass_reason: 无待安装安全补丁
    fail_reason: 存在待安装安全补丁

  - item: 20
    point: 2
    block: Patches / reboot
    expect: {not_contains: "reboot required"}
    pass_reason: 无待重启生效的补丁
    fail_reason: 补丁安装后未重启，漏洞可能仍未修复

  # ---- 恶意代码防范 ----
  - item: 22
    point: 1
    block: Security agent (EDR / AV / IDS)
    expect: {contains: "fact:security_agent.process.present=true"}
    pass_reason: 已部署主机安全防护进程
    fail_reason: 未发现主机安全防护进程

  - item: 22
    point: 2
    block: New malware / fileless
    expect: {not_contains: "-> /home/"}
    pass_reason: 未发现用户目录下的可疑可执行进程
    fail_reason: 存在用户目录下运行的可疑可执行进程

  - item: 22
    point: 3
    block: Backdoor / proxy / C2 process
    expect: {contains: "none found"}
    pass_reason: 未发现后门或代理进程
    fail_reason: 发现疑似后门或代理进程

  # ---- 数据保密性 ----
  # item 27 的口径是 manual（需访谈确认加密范围），初版不自动判定，留给人工。

  # ---- 中间件与数据库补充 ----
  # 中间件/数据库块只在对应组件或资产族部署时出现。optional_block 让规则在块缺失时
  # 跳过该实施点，避免把“未部署”误判为未采集；块存在但输出 not detected/skipped 时按不适用通过。
  - item: 1
    point: 4
    block: MySQL 口令复杂度策略
    expect:
      any:
        - {contains: "fact:mysql.plugin.validate_password.status=ACTIVE"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 数据库已启用口令复杂度插件或未部署数据库
    fail_reason: 数据库未启用口令复杂度插件
    optional_block: true

  - item: 2
    point: 2
    block: MySQL 登录失败处理
    expect:
      any:
        - {contains: "fact:mysql.plugin.connection_control.status=ACTIVE"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 数据库已启用登录失败控制或未部署数据库
    fail_reason: 数据库未启用登录失败控制
    optional_block: true

  - item: 6
    point: 1
    block: MySQL 空口令与匿名账户
    expect:
      any:
        - {contains: "fact:mysql.account.anonymous.none=true"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 未发现匿名账户或未部署数据库
    fail_reason: 存在匿名账户
    optional_block: true

  - item: 6
    point: 2
    block: MySQL 空口令与匿名账户
    expect:
      any:
        - {contains: "fact:mysql.account.empty_password.none=true"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 未发现空口令账户或未部署数据库
    fail_reason: 存在空口令账户
    optional_block: true

  - item: 8
    point: 1
    block: Separation of duty (three roles)
    expect: {contains: "sudo user"}
    pass_reason: 已划分系统管理角色
    fail_reason: 未划分系统管理角色

  - item: 8
    point: 2
    block: Separation of duty (three roles)
    expect:
      all:
        - {contains: "sudo user"}
        - {contains: "audit reader"}
    pass_reason: 管理权限与审计权限已分离
    fail_reason: 未实现管理权限与审计权限分离

  - item: 8
    point: 3
    block: Nginx version / run user
    expect:
      any:
        - {contains: "www-data"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 中间件工作进程以非特权账户运行或未部署
    fail_reason: 中间件以特权账户运行，权限未最小化
    optional_block: true

  - item: 9
    point: 2
    block: MySQL 账户权限与最小化
    expect:
      all:
        - {contains: "fact:mysql.privileges.complete=true"}
        - {contains: "fact:mysql.privileges.no_wildcard_super=true"}
    pass_reason: 账户权限清单完整，且未发现对任意来源开放的超级权限账户
    fail_reason: 账户权限清单不完整，或存在对任意来源开放的超级权限账户
    optional_block: true

  - item: 12
    point: 1
    block: Nginx log path
    expect:
      any:
        - {contains: "access_log"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 中间件访问日志已配置或未部署
    fail_reason: 未发现中间件访问日志配置
    optional_block: true

  - item: 12
    point: 3
    block: MySQL 审计日志
    expect:
      any:
        - {contains: "fact:mysql.audit.enabled=true"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 数据库已开启审计日志或未部署数据库
    fail_reason: 数据库未开启审计日志
    optional_block: true

  - item: 13
    point: 1
    block: Nginx log format / sample
    expect:
      any:
        - {contains: "combined"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 中间件日志格式包含审计所需字段或未部署
    fail_reason: 中间件日志格式无法确认审计字段
    optional_block: true

  - item: 14
    point: 2
    block: Nginx log retention
    expect:
      any:
        - {contains: "fact:log.retention.six_months=true"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 中间件日志留存满足半年要求或未部署
    fail_reason: 中间件日志留存不足半年
    optional_block: true

  - item: 16
    point: 1
    block: Running services
    expect:
      all:
        - {not_contains: "telnet"}
        - {not_contains: "rsh"}
    pass_reason: 未运行常见冗余网络服务
    fail_reason: 存在冗余网络服务

  - item: 16
    point: 2
    block: Running services
    expect:
      all:
        - {not_contains: "xinetd"}
        - {not_contains: "inetd"}
    pass_reason: 未发现非必要组件服务
    fail_reason: 存在非必要组件服务

  - item: 16
    point: 2
    block: Apache
    expect:
      any:
        - {contains: "not detected"}
        - {contains: "not installed"}
        - {contains: "skipped"}
    pass_reason: 未安装 Apache
    fail_reason: 检测到 Apache，需核实是否为必需组件
    optional_block: true

  - item: 16
    point: 2
    block: Tomcat
    expect:
      any:
        - {contains: "not detected"}
        - {contains: "not installed"}
        - {contains: "skipped"}
    pass_reason: 未安装 Tomcat
    fail_reason: 检测到 Tomcat，需核实是否为必需组件
    optional_block: true

  - item: 17
    point: 2
    block: Docker containers
    expect:
      all:
        - {not_contains: "0.0.0.0:"}
        - {not_contains: ":::"}
    pass_reason: 容器端口未对全网卡暴露
    fail_reason: 容器端口对全网卡暴露
    optional_block: true

  - item: 17
    point: 2
    block: Nginx listen port
    expect:
      all:
        - {not_contains: ":21 "}
        - {not_contains: ":23 "}
        - {not_contains: ":3389"}
        - {not_contains: ":445 "}
    pass_reason: 中间件未监听常见高危端口
    fail_reason: 中间件存在高危端口监听
    optional_block: true

  - item: 18
    point: 1
    block: MySQL 远程访问限制
    expect:
      any:
        - {contains: "fact:mysql.remote_access.restricted=true"}
        - {contains: "not detected"}
        - {contains: "skipped"}
    pass_reason: 数据库远程访问已受限或未部署数据库
    fail_reason: 数据库远程访问未受限
    optional_block: true
