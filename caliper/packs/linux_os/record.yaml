# 记录表生成规则库
#
# 公司记录表口径已定：只取三值并带分，部分符合在生成记录表时按不符合(0分)落表，
# 判定层仍保留五值供追溯。字段顺序固定为：
# 序号 / 控制点 / 控制项 / 结果记录 / 符合情况 / 备注 / 重要程度 / 检查内容 / 判断标准
version: 0.2.0
status: active
rules:
  - id: REC-01
    match: 符合
    text: 符合(1分)
  - id: REC-02
    match: 部分符合
    text: 不符合(0分)
  - id: REC-03
    match: 不符合
    text: 不符合(0分)
  - id: REC-04
    match: 不适用
    text: 不适用
  - id: REC-05
    match: 未采集
    text: ""
