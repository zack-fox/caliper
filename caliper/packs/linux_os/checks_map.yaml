- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Duplicate UID / UID=0 accounts
  block_index: 4
  kind: judge
  session:
  - kind: shell
    pattern: '^(?:cut\s+-d:\s+-f3\s+/etc/passwd\b.*\buniq\s+-d\b|awk\s+-F:\s+.*\$3\s*==\s*0.*\/etc\/passwd\b)'
    empty: success
  normalize: duplicate_uid
  binds:
  - item: 1
    points:
    - 1
    - 2
  - level: 2
    item: 1
    points:
    - 2
- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Accounts and last password change
  block_index: 5
  kind: judge
  session:
  - kind: shell
    pattern: '^(?:chage\s+-l\b|awk\s+-F:\s+.*\/etc\/passwd\b.*\bchage\s+-l\b|awk\s+-F:\s+.*\bexpire=.*\/etc\/shadow\b)'
  normalize: accounts
  binds:
  - item: 1
    points:
    - 4
  - item: 7
    points:
    - 1
  - level: 2
    item: 4
    points:
    - 2
- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Empty / expired password
  block_index: 6
  kind: judge
  session:
  - kind: shell
    pattern: '^awk\s+-F:\s+.*\$2\s*==.*\/etc\/shadow\b'
    empty: success
  - kind: shell
    pattern: '^(?:cat|more|less)\s+\/etc\/shadow\b'
  normalize: empty_password
  binds:
  - item: 1
    points:
    - 3
  - level: 2
    item: 1
    points:
    - 3
- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
  title: Password hash algorithm
  block_index: 7
  kind: judge
  session:
  - kind: shell
    pattern: '^(?:grep\b.*\bpam_unix\b.*\/etc\/pam\.d\b|(?:cat|more|less)\s+\/etc\/pam\.d\/(?:system-auth|password-auth|common-auth|common-password)\b)'
  binds:
  - item: 1
    points:
    - 4
  - level: 2
    item: 1
    points:
    - 1
- os_family:
  - debian
  - rhel
  section: 2. IDENTIFICATION
