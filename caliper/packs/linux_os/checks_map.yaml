    pattern: '^(?:grep\b.*pam_(?:pwquality|cracklib).*\/etc\/pam\.d\b|(?:cat|more|less)\s+\/etc\/(?:security\/pwquality\.conf|pam\.d\/(?:system-auth|password-auth|common-auth|common-password))\b)'
    empty: success
  normalize: password_complexity
  binds:
