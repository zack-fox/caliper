    pattern: '^(?:grep\b.*pam_(?:faillock|tally\d*).*\/etc\/pam\.d\b|(?:cat|more|less)\s+\/etc\/(?:security\/faillock\.conf|pam\.d\/(?:system-auth|password-auth|common-auth|common-password))\b)'
