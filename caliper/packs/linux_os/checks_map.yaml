  section: 1. SYSTEM
  title: Host / OS / kernel / time
  block_index: 1
  kind: context
  session:
  - kind: shell
    pattern: '^(?:(?:cat|more)\s+/etc/(?:os-release|centos-release|redhat-release)\b|hostnamectl\b|uname\s+-a\b)'
  normalize: os
  binds: []
- os_family:
  - debian
  - rhel
  section: 1. SYSTEM
  title: Network
  block_index: 2
