  title: 身份鉴别整改
  applies_to:
    level:
    - 3
    family:
    - database
    item_seqs:
    - 4
  priority: 高
  problem: 身份鉴别相关配置不符合指导书要求。
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: 建议按指导书要求完善数据库安全配置。
  clause: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
