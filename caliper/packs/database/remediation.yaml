- id: REM-GENERIC-L3-09
  title: 访问控制整改
  applies_to:
    level:
    - 3
    family:
    - database
    item_seqs:
    - 9
  priority: 高
  problem: 访问控制相关配置不符合指导书要求。
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: 建议制定并落实数据库访问控制策略，按默认拒绝原则授权。
  clause: e）应由授权主体配置访问控制策略，访问控制策略规定主体对客体的访问规则：
- id: REM-GENERIC-L3-10
  title: 访问控制整改
  applies_to:
    level:
    - 3
    family:
    - database
    item_seqs:
    - 10
  priority: 高
  problem: 访问控制相关配置不符合指导书要求。
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: 建议按最小权限细化访问控制粒度，避免过宽授权。
  clause: f）访问控制的粒度应达到主体为用户级或进程级，客体为文件、数据库表级：
- id: REM-GENERIC-L3-11
  title: 访问控制整改
  applies_to:
    level:
    - 3
    family:
    - database
    item_seqs:
    - 11
  priority: 高
  problem: 访问控制相关配置不符合指导书要求。
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: 建议对重要数据设置安全标记，并基于标记实施访问控制。
  clause: g）应对重要主体和客体设置安全标记，并控制主体对有安全标记信息资源的访问。
