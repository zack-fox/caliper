  unit_no: 27
  控制点: 数据保密性
  控制项: a）应采用密码技术保证重要数据在传输过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等：
  重要程度: 重要
  检查内容: '方法：现场核查。

