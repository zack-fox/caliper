  mode: na
  binary: false
- item_id: L3-CES1-25
  level: 3
  seq: 24
  unit_no: 25
  控制点: 数据完整性
  控制项: a）应采用校验技术或密码技术保证重要数据在传输过程中的完整性，包括但不限于鉴别数据、重要业务数据、重要审计数据、重要配置数据、重要视频数据和重要个人信息等：
  重要程度: 重要
  检查内容: '方法：现场核查。

    核查步骤：

    1）是否涉及远程管理： 查看用户表中host列是否配置远程连接地址，命令：select user,host from mysql.user; 可远程的账号状态为：%

    2）是否采用校验技术或密码技术保证传输过程中的完整性： 检查数据库是否开启ssl： show global variables like ''%ssl%''; have_openssl、have_ssl的值为YES \s查看 ssl的值不为“Not in use” 开启了并使用了SSL 1项不符合，则未涉及远程管理，此项不适用 2项不符合，则该测评项判定为不符合'
  判断标准: 1、2项均符合为符合。
  policy: binary
  mode: auto
  binary: true
  manual_points:
  - point: 1
    reason: 是否涉及远程管理需访谈确认；仅本地管理时该项不适用
- item_id: L3-CES1-26
  level: 3
  seq: 25
  unit_no: 26
  控制点: 数据完整性
  控制项: b）应采用校验技术或密码技术保证重要数据在存储过程中的完整性，包括但不限于鉴别数据、重要业务数据、重要审计数据、重要配置数据、重要视频数据和重要个人信息等。
  重要程度: 重要
  检查内容: '方法：现场核查。

    核查步骤：

    1）查看数据库中用户表密码字段，命令：select user,host,plugin from mysql.user;，账户登录口令是否何种算法存储

    2）查看数据库中的重要业务数据、重要个人信息等重要数据是否采用密码技术或校验技术进行存储 能够保证数据存储完整性的方法有：对称加密算法-CBCMAC模式、对称加密算法-GCM模式、带密钥的杂凑算法（HMAC）、数字签名技术 若所有重要数据均采用密码技术或校验技术进行存储，则该项符合； 若仅部分数据采用密码技术或校验技术进行存储，则该项部分符合；其余情况判定为不符合'
  判断标准: 子项全部满足为符合，全部不满足为不符合，其余为部分符合。
  policy: binary
  mode: auto
  binary: true
  manual_points:
  - point: 2
    reason: 业务数据是否加密存储需结合表空间与文件核查
