- id: REM-SQLSERVER-L4-01
  title: 身份鉴别整改
  applies_to:
    level:
    - 4
    family:
    - database
    item_seqs:
    - 1
  priority: 高
  problem: '1、登录数据库时未对用户进行身份鉴别；

    2、数据库中用户身份标识不唯一；

    3、数据库口令强度不完善；

    4、数据库未设置口令复杂度策略或口令更换周期策略'
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: "1、建议登录数据库时必须对用户进行身份鉴别，禁用Windows身份验证方式，不允许用空口令进行登录；\n2、建议为不同用户设立不同的身份标识；\n3、建议增强当前使用账户的口令强度，使口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种；\n4、建议数据库勾选“强制实施密码策略”、“强制密码过期策略”，并在数据库所在的操作系统上启用口令复杂度策略和口令更换周期策略，保证口令长度大于8位，至少包含大写字母、小写字母、数字以及特殊符号中的其中三种，且保证定期90天系统提醒更换账户口令，策略设置如下：\n密码复杂度要求：已启用       \n密码长度最小值：8个字符     \n密码最短使用周期：1天\n密码最长使用期限：90天      \n强制密码历史：3个记住的密码      \n用可还原的加密来存储密码：已禁用"
  clause: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换：
- id: REM-SQLSERVER-L4-02
  title: 身份鉴别整改
  applies_to:
    level:
    - 4
    family:
    - database
    item_seqs:
    - 2
  priority: 低
  problem: '1、数据库未勾选“强制实施密码策略”；

    2、数据库所在的操作系统上未设置登录失败处理策略；

    3、数据库未设置超时自动退出功能'
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: '1、建议数据库勾选“强制实施密码策略”，继承操作系统的登录失败处理功能；

    2、建议启用数据库所在的操作系统的登录失败处理功能，如登录失败5次锁定30分钟，策略设置如下:

    账户锁定时间：30X分钟

    账户锁定阈值：5次无效登录

    复位账户锁定计数器：30分钟之后；

    2、建议合理设置数据库的远程查询超时值'
  clause: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施：
