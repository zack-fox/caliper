texts:
- seq: 1
  control_point: 身份鉴别
  control_item: a）应对登录的用户进行身份标识和鉴别，身份标识具有唯一性，身份鉴别信息具有复杂度要求并定期更换：
  issue_summary: '1、未对登录数据的用户采取措施进行身份标识和鉴别。

    2、数据库中允许新建相同用户、身份表述不具备唯一性。

    3、当前帐户口令强度偏弱，仅由大写字母、小写字母、数字及特殊字符组成,长度X位。

    4、未设置口令复杂度校验功能，无法校验用户设置口令强度。

    5、口令未定期进行更换。'
  issue_detail: ''
  hazard: '1、使合法用户身份被冒用，导致系统被非授权访问，对相关系统的正常运行带来影响。

    2、不便于安全事件的追溯，不易发现系统的安全隐患。

    3/4、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致数据库被非授权访问。

    5、可能发生旧口令被使用，从而易导致系统被非授权访问。'
  remediation: '1、建议根据需要对登录的用户采取身份标识和鉴别措施。

    2、建议加强数据库安全措施，不允许设置相同账户。

    3、建议设置一定强度的口令，如长度达到八位及以上，至少包含大写字母、小写字母、数字、特殊字符中的三种，并且不易被猜解。

    4、建议根据需要对用户口令设置复杂度校验功能，如口令长度最小长度8位，密码必须包含大写字母、小写字母、数字、特殊字符中的三种。

    5、建议定期三个月更换一次口令。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 2
  control_point: 身份鉴别
  control_item: b）应具有登录失败处理功能，应配置并启用结束会话、限制非法登录次数和当登录连接超时自动退出等相关措施：
  issue_summary: '1、未配置登录失败处理功能/登录失败处理措施设置不完善。

    2、未配置登录超时处理措施/登录超时处理措施设置不完善。'
  issue_detail: ''
  hazard: '1、登录口令可能被恶意用户使用暴力猜解方式获得，合法用户身份被仿冒，导致系统被非授权访问。

    2、可能由于人员长时间离开电脑未锁屏而导致系统重要信息泄露。'
  remediation: '1、建议对登录失败采取必要的安全措施，如登录失败5次锁定帐户X分钟等。

    2、建议对登录超时采取必要的安全措施，如登录超时30分钟自动退出账户。'
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 3
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听。
  issue_summary: 未采取措施防止鉴别信息在网络传输过程中被窃听
  issue_detail: ''
  hazard: 1、帐号、口令等重要数据可能被嗅探并盗用，导致系统被非授权访问；增加了鉴别信息或管理信息被网络截取进行攻击的风险。
  remediation: 建议数据库采取外部加密机制或启用SSL加密机制保证数据库远程管理时用户鉴别信息的传输安全。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 低
- seq: 4
  control_point: 访问控制
  control_item: a）应对登录的用户分配账户和权限：
  issue_summary: '1、未对需要登录使用设备的人员单独设立账户并分配权限；

    2、未对匿名账户XXX进行禁用或限制'
  issue_detail: ''
  hazard: '1、可能出现多人共用一个账户的情况，发生误操作不利于追溯自然人；

    2、存在可以通过匿名账户非授权访问设备造成风险的情况'
  remediation: '1、建议为需要登录使用服务器的人员单独设立账户并分配权限；

    2、建议对匿名账户进行禁用'
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 5
  control_point: 访问控制
  control_item: b）应重命名或删除默认账户，修改默认账户的默认口令：
  issue_summary: '1、未重命名数据库默认账户XXX

    2、未修改XXX账户的默认口令'
  issue_detail: ''
  hazard: '1、用户名及口令更容易被恶意用户猜测获得，合法用户身份被仿冒，导致数据库被非授权访问；

    2、口令被恶意用户猜测获得，合法用户身份被仿冒，导致数据库被非授权访问。'
  remediation: '1、建议对数据库默认账户xxx进行重命名，禁用默认账户yyy；

    2、建议对XXX账户默认口令进行修改'
  threat: 越权访问、权限滥用
  inherent_risk: 中
- seq: 6
  control_point: 访问控制
  control_item: c）应及时删除或停用多余的、过期的账户，避免共享账户的存在：
  issue_summary: '1、数据库中存在多余账户X；

    2、数据库中存在过期账户X；

    3、数据库中账户与实际人员未对应，存在多人共用一个X账户的情况'
  issue_detail: ''
  hazard: '1、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致数据库被非授权访问；

    2、口令可能被恶意用户猜测获得，合法用户身份被仿冒，导致系统被非授权访问；

    3、倘若发生安全事故，不便于追溯到自然人。'
  remediation: '1、建议删除数据库中多余账户X；

    2、建议删除数据库中过期账户X；

    3、建议为需要使用数据库的人员单独设立账户，避免多人共用一个账户的情况'
  threat: 越权访问、权限滥用
  inherent_risk: 高
- seq: 7
  control_point: 访问控制
  control_item: d）应授予管理用户所需的最小权限，实现管理用户的权限分离。
  issue_summary: 未实现管理用户权限分离
  issue_detail: ''
  hazard: 管理员权限过大，可能无法对管理员的行为进行监管、制约。
  remediation: 建议授予不同用户为完成各自承担的任务所需的最小权限，将系统管理员和业务操作员权限分离，并设置独立的安全审计员账户、安全管理员账户
  threat: 越权访问、权限滥用
  inherent_risk: 低
- seq: 8
  control_point: 安全审计
  control_item: a）应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计：
  issue_summary: 数据库未启用XX日志功能；
  issue_detail: ''
  hazard: 安全审计不完善，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；
  remediation: "建议启用完善的数据库功能，至少包括log_bin、general_log、 \nslow_query_log、\nlog_error"
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 9
  control_point: 安全审计
  control_item: b）审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息：
  issue_summary: 数据库中审计记录仅包括XX、YYY，未包含ZZZ等重要安全审计信息，不够完善。
  issue_detail: ''
  hazard: 审计信息不完整，可能无法对安全事件进行有效追溯。
  remediation: 建议将数据库审计记录内容进行完善，至少包含：日期和时间、用户、事件类型、事件是否成功等重要信息。
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 低
- seq: 10
  control_point: 安全审计
  control_item: c）应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等。
  issue_summary: '1、非授权用户可以对审计记录进行修改/删除；

    2、未定期对数据库审计记录进行备份；

    3、数据库日志记录保存时间小于6个月'
  issue_detail: ''
  hazard: '1、审计记录被删除，可能导致安全审计员无法利用审计日志对部分安全事件予以准确定位和追溯，同时无法及时了解设备实际运行状况以及存在的安全隐患；

    2、当数据库审计记录丢失后，不便于安全事件的追溯；

    3、日志保存时间不足，审计信息缺失，不便于安全事件的追溯。'
  remediation: '1、建议将数据库文件权限设置为644范围以内，避免非授权用户对其中的日志记录进行删除、修改；

    2、建议定期对服务器日志记录进行备份保存；

    3、建议加长日志记录的保存时间，至少保存6个月'
  threat: 审计记录被篡改或删除、行为无法追溯
  inherent_risk: 高
- seq: 11
  control_point: 入侵防范
  control_item: a）应遵循最小安装的原则，仅安装需要的组件和应用程序：
  issue_summary: ''
  issue_detail: ''
  hazard: ''
  remediation: ''
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: —
- seq: 12
  control_point: 入侵防范
  control_item: b）应关闭不需要的系统服务、默认共享和高危端口：
  issue_summary: ''
  issue_detail: ''
  hazard: ''
  remediation: ''
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 13
  control_point: 入侵防范
  control_item: c）应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制：
  issue_summary: '1、未对数据库接入方式或网络地址范围进行限制；

    2、数据库接入方式/网络地址范围限制不合理'
  issue_detail: ''
  hazard: '1、恶意用户可以尝试从任意终端对数据库进行访问并暴力破解，导致系统遭到入侵破坏；

    2、恶意用户可以尝试从任意终端对数据库进行访问并暴力破解，导致数据库遭到入侵破坏。'
  remediation: '1、建议对数据库接入方式或网络地址范围进行限制（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）；

    2、建议合理限制数据库接入方式/网络地址范围（接入方式例如必须通过VPN或堡垒机、地址范围限制例如仅特定IP允许访问）'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 低
- seq: 14
  control_point: 入侵防范
  control_item: d）应提供数据有效性检验功能，保证通过人机接口输入或通过通信接口输入的内容符合系统设定要求：
  issue_summary: ''
  issue_detail: ''
  hazard: ''
  remediation: ''
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: —
- seq: 15
  control_point: 入侵防范
  control_item: e）应能发现可能存在的已知漏洞，并在经过充分测试评估后，及时修补漏洞。
  issue_summary: '1、未定期对数据库进行漏洞扫描；

    2、未提供数据库漏洞扫描报告；

    3、未对发现的数据库漏洞进行及时修复'
  issue_detail: ''
  hazard: '1、可能存在安全漏洞，且漏洞可能被利用进行网络攻击影响正常运行，造成业务中断；

    2、无法有效收集掌握系统漏洞情况；

    3、安全漏洞可能被利用进行网络攻击影响正常运行，造成业务中断。'
  remediation: '1、建议定期对数据库进行漏洞扫描（至少一个季度进行一次）；

    2、建议每次开展漏洞扫描后将扫描报告进行保存留档；

    3、建议对扫描发现的数据库漏洞进行评估并修复，且保留修复记录'
  threat: 漏洞利用、恶意代码植入、非授权外联
  inherent_risk: 高
- seq: 16
  control_point: 恶意代码防范
  control_item: a）应安装防恶意代码软件或配置具有相应功能的软件，并定期进行升级和更新防恶意代码库。
  issue_summary: 此类对象不涉及该控制项。
  issue_detail: ''
  hazard: —
  remediation: —
  threat: —
  inherent_risk: —
- seq: 17
  control_point: 可信验证
  control_item: a）可基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警，并将验证结果形成审计记录送至安全管理中心。
  issue_summary: '1、未基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证；

    2、部署了可信验证检测的设备，但检测到可信性受到破坏时无法进行报警。'
  issue_detail: ''
  hazard: '1、无可信链和可信验证,无法通过主动免疫可信验证技术提高系统自身安全防护能力，无法实现积极主动防御；

    2、存在不能及时发现可信性受到破坏而造成系统信息泄漏或损坏的风险。'
  remediation: '1、建议基于可信根对计算设备的系统引导程序、系统程序、重要配置参数和应用程序等进行可信验证，并在应用程序的关键执行环节进行动态可信验证，在检测到其可信性受到破坏后进行报警；

    2、建议对可信验证设备的配置进行检查和调整，使其发现可信性受到破坏后及时向管理员进行报警。'
  threat: —
  inherent_risk: —
- seq: 18
  control_point: 数据完整性
  control_item: a）应采用校验技术保证重要数据在传输过程中的完整性。
  issue_summary: 数据库未采取措施保证鉴别数据在传输过程中的完整性
  issue_detail: ''
  hazard: 鉴别数据在传输过程中可能遭到劫持、篡改。
  remediation: 根据身份鉴别C项来写，涉及到别的例如审计数据的传输再另看
  threat: 传输或存储数据被篡改
  inherent_risk: 低
- seq: 19
  control_point: 数据备份恢复
  control_item: a）应提供重要数据的本地数据备份与恢复功能：
  issue_summary: '1、未提供重要数据的本地数据备份功能；

    2、未对备份文件进行恢复性测试'
  issue_detail: ''
  hazard: 本地备份策略不完善/执行不到位，在极端情况下，会影响到业务服务的持续提供，使企业的经济利益或声誉受到损害。
  remediation: 建议对数据每天至少完全备份一次，并将备份介质场外存放，此外，还应定期对备份文件进行恢复测试，确保备份文件有效。
  threat: 数据丢失、业务中断
  inherent_risk: 高
- seq: 20
  control_point: 数据备份恢复
  control_item: b）应提供异地数据备份功能，利用通信网络将重要数据定时批量传送至备份场地。
  issue_summary: 未利用通信网络将重要数据传送至备份场地
  issue_detail: ''
  hazard: 缺乏数据异地备份，在发生地震或其他灾祸的极端情况下，会影响到业务服务的持续提供，使企业的经济利益或声誉受到损害。
  remediation: 建议利用通信网络将关键数据库重要数据数据定时批量至备用场地，实现异地数据备份。
  threat: 数据丢失、业务中断
  inherent_risk: 高
- seq: 21
  control_point: 剩余信息保护
  control_item: a）应保证鉴别信息所在的存储空间被释放或重新分配前得到完全清除：
  issue_summary: 数据库未采取措施保证鉴别信息的存储空间被释放或重新分配前得到完全清除
  issue_detail: ''
  hazard: 恶意人员可能获取到合法用户的鉴别信息，并利用这些鉴别信息仿冒他人身份访问目标系统，侵害了其他合法用户的利益，影响了信息系统的正常运行。
  remediation: 建议采取相关措施，对系统内剩余信息进行彻底清除。
  threat: 残留信息泄露
  inherent_risk: 低
- seq: 22
  control_point: 个人信息保护
  control_item: a）应仅采集和保存业务必需的用户个人信息：
  issue_summary: 数据库保存了非业务所必须的用户个人信息
  issue_detail: ''
  hazard: 违规、过度采集用户个人信息，可能导致用户隐私泄露。
  remediation: 建议数据库仅保存业务必须的用户个人信息
  threat: 个人隐私泄露
  inherent_risk: 低
- seq: 23
  control_point: 个人信息保护
  control_item: b）应禁止未授权访问和非法使用用户个人信息。
  issue_summary: '1、数据库未采取措施禁止未授权访问和用户个人信息

    2、未采取措施防止非法使用用户个人信息'
  issue_detail: ''
  hazard: 可能被未授权人员获取相关信息，导致信息泄露。
  remediation: 建议严格限制对用户个人信息的访问和使用，可通过对数据库表进行权限限制/其他措施
  threat: 个人隐私泄露
  inherent_risk: 低
- seq: 24
  control_point: 身份鉴别
  control_item: c）当进行远程管理时，应采取必要措施防止鉴别信息在网络传输过程中被窃听：
  issue_summary: 未采取措施防止鉴别信息在网络传输过程中被窃听
  issue_detail: ''
  hazard: 1、帐号、口令等重要数据可能被嗅探并盗用，导致系统被非授权访问；增加了鉴别信息或管理信息被网络截取进行攻击的风险。
  remediation: 建议数据库采取外部加密机制或启用SSL加密机制保证数据库远程管理时用户鉴别信息的传输安全。
  threat: 身份冒用、口令猜测与暴力破解
  inherent_risk: 高
- seq: 25
  control_point: 身份鉴别
  control_item: d）应采用口令、密码技术、生物技术等两种或两种以上组合的鉴别技术对用户进行身份鉴别，且其中一种鉴别技术至少应使用密码技术来实现。
