# 重大风险隐患规则库
#
# 高风险命中只是候选；按相关性、严重性、高发性三维加权评分，
# 达到阈值列为重大隐患候选，仍须人工确认并留痕后才允许导出。
version: 1.0.0
status: active
threshold: 2.4
dimensions:
  - name: 相关性
    weight: 0.4
  - name: 严重性
    weight: 0.4
  - name: 高发性
    weight: 0.2
rules:
  - id: MR-01
    hr_ids: [HR-01]
    scores:
      相关性:
        score: 3
        reason: 问题描述涉及可登录的空口令、弱口令、通用口令账户或无身份鉴别措施，直接关联身份鉴别控制点。
      严重性:
        score: 3
        reason: 风险评价指出存在可登录的空口令、弱口令、通用口令或无身份鉴别措施时，需根据实际措施效果判断是否降低风险等级。
      高发性:
        score: 3
        reason: 问题描述列举长度不足、常见字典口令、多对象共用口令等常见弱口令情形。
  - id: MR-02
    hr_ids: [HR-02]
    scores:
      相关性:
        score: 3
        reason: 问题描述为鉴别信息以明文或可还原形式在网络环境中传输。
      严重性:
        score: 2
        reason: 风险评价指出获得鉴别信息可能成功登录，需结合是否采用两种或两种以上组合身份鉴别措施判断。
      高发性:
        score: 2
        reason: 问题描述涵盖明文传输以及编码、隐藏等仍可还原的传输方式。
  - id: MR-03
    hr_ids: [HR-03]
    scores:
      相关性:
        score: 3
        reason: 问题描述为未采用两种或两种以上组合鉴别技术对用户进行身份鉴别。
      严重性:
        score: 2
        reason: 风险评价按登录和访问过程中多次鉴别、重要业务操作前不同阶段鉴别、仅限本地登录或带外管理等情形判断风险。
      高发性:
        score: 2
        reason: 问题描述仅说明未采用组合鉴别技术，未列举具体利用后果。
  - id: MR-04
    hr_ids: [HR-04]
    scores:
      相关性:
        score: 3
        reason: 问题描述为存在公开的默认账户或默认口令，且未重命名默认账户、未修改默认口令。
      严重性:
        score: 3
        reason: 风险评价指出使用默认口令能否成功登录，取决于组合鉴别措施或远程登录管控是否有效。
      高发性:
        score: 3
        reason: 整改建议指向网络设备、安全设备、主机设备等常见的默认账户口令情形。
  - id: MR-05
    hr_ids: [HR-05]
    scores:
      相关性:
        score: 3
        reason: 问题描述覆盖业务应用系统、数据库管理系统和操作系统访问控制策略缺陷及越权访问可能。
      严重性:
        score: 3
        reason: 风险评价指出存在越权访问可能，需结合本地访问、远程访问管控和操作行为审计判断。
      高发性:
        score: 2
        reason: 问题描述列举非授权访问功能模块、超级管理员权限误用等情形。
  - id: MR-06
    hr_ids: [HR-06]
    scores:
      相关性:
        score: 2
        reason: 问题描述为开启多余的系统服务、默认共享和高危端口，且可被远程访问。
      严重性:
        score: 2
        reason: 风险评价以相关漏洞难以利用为判断条件，需结合远程访问管控或检测防护措施。
      高发性:
        score: 3
        reason: 问题描述指向多余系统服务、默认共享和高危端口等常见暴露面。
  - id: MR-07
    hr_ids: [HR-07]
    scores:
      相关性:
        score: 3
        reason: 问题描述为存在外界披露或经测试验证的可被利用的高危安全漏洞。
      严重性:
        score: 3
        reason: 风险评价指出通过互联网管理或访问时，上述安全问题被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 3
        reason: 问题描述区分互联网与非互联网管理访问场景，覆盖外界披露和测试验证两类漏洞。
  - id: MR-08
    hr_ids: [HR-08]
    scores:
      相关性:
        score: 3
        reason: 问题描述为未提供数据有效性检验功能或功能不完善，存在SQL注入、跨站脚本、文件上传等高风险安全漏洞。
      严重性:
        score: 3
        reason: 问题描述明确上述漏洞可造成严重后果，风险评价要求结合网络暴露和防护措施判断。
      高发性:
        score: 3
        reason: 问题描述直接列举SQL注入、跨站脚本、文件上传等常见高风险漏洞。
  - id: MR-09
    hr_ids: [HR-09]
    scores:
      相关性:
        score: 3
        reason: 问题描述为未采取恶意代码检测和清除措施、防范产品授权过期或特征库一个月以上未更新。
      严重性:
        score: 3
        reason: 风险评价区分非Windows与Windows操作系统场景，Windows场景未给出缓解措施并指出可能导致高风险。
      高发性:
        score: 2
        reason: 问题描述涵盖未部署、授权过期和特征库长期未更新等情形。
  - id: MR-10
    hr_ids: [HR-10]
    scores:
      相关性:
        score: 3
        reason: 问题描述为鉴别信息、重要个人信息或重要业务数据以明文方式在网络环境中传输。
      严重性:
        score: 3
        reason: 风险评价指出重要个人信息或重要业务数据明文传输时，上述安全问题被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 2
        reason: 问题描述覆盖鉴别信息与重要个人信息、重要业务数据两类明文传输对象。
  - id: MR-11
    hr_ids: [HR-11]
    scores:
      相关性:
        score: 3
        reason: 问题描述为鉴别信息、重要个人信息或具有保密性需求的重要业务数据以明文方式存储。
      严重性:
        score: 3
        reason: 风险评价将明文存储与本地访问、带外管理及数据库防火墙、数据防泄露等防护措施关联判断。
      高发性:
        score: 2
        reason: 问题描述覆盖鉴别信息、重要个人信息和重要业务数据三类存储对象。
  - id: MR-12
    hr_ids: [HR-12]
    scores:
      相关性:
        score: 2
        reason: 问题描述为重要数据未提供任何备份措施，或备份到互联网网盘及相关存储环境。
      严重性:
        score: 3
        reason: 风险评价指出备份到互联网网盘或相关存储环境时，上述安全问题被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 2
        reason: 问题描述区分未提供备份与备份位置不当两种情形。
  - id: MR-13
    hr_ids: [HR-13]
    scores:
      相关性:
        score: 2
        reason: 问题描述为业务连续性要求较高的被测对象未采用热冗余方式部署重要数据处理设备。
      严重性:
        score: 3
        reason: 问题描述指出发生故障后可能导致重要业务中断，风险评价指出可能导致等级保护对象面临高风险。
      高发性:
        score: 1
        reason: 问题描述仅针对业务连续性要求较高的第三级及以上定级对象，未列举多发情形。
  - id: MR-14
    hr_ids: [HR-14]
    scores:
      相关性:
        score: 2
        reason: 问题描述为未设立异地应用级容灾中心，或容灾中心无法实现业务切换。
      严重性:
        score: 3
        reason: 风险评价指出上述任一安全问题被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 1
        reason: 问题描述限定于业务连续性要求高的第四级及以上定级对象。
  - id: MR-15
    hr_ids: [HR-15]
    scores:
      相关性:
        score: 3
        reason: 问题描述为未授权情况下违规采集、存储用户个人隐私信息，或法规及主管部门禁止采集保存的个人信息。
      严重性:
        score: 3
        reason: 风险评价指出上述安全问题一旦被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 2
        reason: 问题描述涵盖未授权采集存储和法规禁止采集保存两类情形。
  - id: MR-16
    hr_ids: [HR-16]
    scores:
      相关性:
        score: 3
        reason: 问题描述为未按规定使用个人信息，包括提交第三方、未脱敏使用、非法交易泄漏和查询导出权限失控等。
      严重性:
        score: 3
        reason: 风险评价指出上述安全问题一旦被威胁利用后可能导致等级保护对象面临高风险。
      高发性:
        score: 2
        reason: 问题描述列举多种未授权访问和非法使用个人信息的情形。
