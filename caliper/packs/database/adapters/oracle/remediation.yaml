    item_seqs:
    - 27
  priority: 低
  problem: 数据库未采用密码技术保证重要数据在传输过程中的保密性。
  cause: 数据库安全基线未配置或配置未落到该实例。
  action: 建议采用密码技术保证重要数据在传输过程中的保密性。
  clause: a）应采用密码技术保证重要数据在传输过程中的保密性，包括但不限于鉴别数据、重要业务数据和重要个人信息等；
- id: REM-ORACLE-L4-28
  title: 数据保密性整改
  applies_to:
    level:
    - 4
    family:
